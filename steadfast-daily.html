<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steadfast — Daily Anchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Spectral:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1a1814;--surface:#22201c;--panel:#2a2722;--border:#3a3630;
    --gold:#b8965a;--gold-dim:#7a6038;--blue:#4a7fa5;--blue-dim:#2d5570;
    --blue-pale:#6b9dbf;--stone:#8c8070;--cream:#d4c9b0;--text:#c8bca8;--muted:#6b6254;
    --altar:#b8965a;--forge:#a0715a;--covenant:#4a7fa5;--heritage:#6b8c5a;--fortress:#8c7a5a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;letter-spacing:.01em}
  .app{display:flex;flex-direction:column;min-height:100vh}
  header{padding:26px 32px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100}
  .wordmark{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;letter-spacing:.18em;color:var(--cream);text-transform:uppercase}
  .wordmark span{color:var(--gold)}
  .header-right{display:flex;align-items:center;gap:14px}
  .date-label{font-size:.67rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .nav-btn{background:none;border:1px solid var(--border);color:var(--stone);cursor:pointer;padding:5px 13px;font-family:'Jost',sans-serif;font-size:.71rem;letter-spacing:.12em;text-transform:uppercase;transition:all .2s}
  .nav-btn:hover{border-color:var(--gold-dim);color:var(--cream)}
  .nav-btn.active{border-color:var(--gold);color:var(--gold)}
  main{flex:1;padding:0 32px 48px;max-width:720px;margin:0 auto;width:100%}
  #today-view{display:block}
  #history-view{display:none}

  /* pillar accent line under header */
  .pillar-accent{height:1px;background:var(--border);margin-bottom:0;transition:background .4s}

  .verse-day{padding:38px 0 22px;border-bottom:1px solid var(--border);margin-bottom:30px}
  .pillar-tag{display:inline-flex;align-items:center;gap:8px;font-size:.63rem;letter-spacing:.22em;text-transform:uppercase;padding:4px 10px;border:1px solid;margin-bottom:18px}
  .pillar-tag.altar{color:var(--altar);border-color:var(--altar)}
  .pillar-tag.forge{color:var(--forge);border-color:var(--forge)}
  .pillar-tag.covenant{color:var(--covenant);border-color:var(--covenant)}
  .pillar-tag.heritage{color:var(--heritage);border-color:var(--heritage)}
  .pillar-tag.fortress{color:var(--fortress);border-color:var(--fortress)}
  .pillar-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}

  .verse-seq{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .verse-title{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin-bottom:22px}
  .verse-text{font-family:'Cormorant Garamond',serif;font-size:1.72rem;font-weight:300;font-style:italic;line-height:1.55;color:var(--cream);margin-bottom:11px}
  .verse-ref{font-size:.71rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dim)}
  .divider{width:40px;height:1px;background:var(--border);margin:30px 0}
  .section-label{font-size:.63rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:13px}
  .reflect-text{font-family:'Spectral',serif;font-size:.97rem;font-weight:300;line-height:1.82;color:var(--text);margin-bottom:26px}
  .recalibrate-block{border-left:2px solid var(--blue-dim);padding:15px 20px;margin-bottom:26px;background:rgba(74,127,165,.05)}
  .recalibrate-block .section-label{color:var(--blue-pale);margin-bottom:9px}
  .recalibrate-block p{font-family:'Spectral',serif;font-size:.91rem;font-style:italic;line-height:1.77;color:var(--stone)}
  .enter-day-block{border-left:2px solid var(--gold-dim);padding:15px 20px;background:rgba(184,150,90,.05)}
  .enter-day-block .section-label{color:var(--gold);margin-bottom:9px}
  .enter-day-block p{font-family:'Spectral',serif;font-size:.91rem;line-height:1.77;color:var(--stone)}

  /* Pillar cycle strip */
  .cycle-strip{display:flex;gap:2px;margin:30px 0 0;padding-top:22px;border-top:1px solid var(--border)}
  .cycle-item{flex:1;padding:8px 4px;text-align:center;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid transparent;transition:all .2s;color:var(--muted)}
  .cycle-item.active{color:var(--cream)}
  .cycle-item.active.altar{border-color:var(--altar);color:var(--altar)}
  .cycle-item.active.forge{border-color:var(--forge);color:var(--forge)}
  .cycle-item.active.covenant{border-color:var(--covenant);color:var(--covenant)}
  .cycle-item.active.heritage{border-color:var(--heritage);color:var(--heritage)}
  .cycle-item.active.fortress{border-color:var(--fortress);color:var(--fortress)}

  .posture-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:40px}
  .posture-item{background:var(--surface);padding:15px 17px}
  .posture-pillar{font-size:.59rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .posture-question{font-family:'Spectral',serif;font-size:.87rem;font-style:italic;line-height:1.5;color:var(--text)}

  /* History */
  .history-header{padding:34px 0 18px;border-bottom:1px solid var(--border);margin-bottom:26px;display:flex;align-items:baseline;gap:14px}
  .history-title{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:300;letter-spacing:.12em;color:var(--cream);text-transform:uppercase}
  .history-count{font-size:.63rem;letter-spacing:.15em;color:var(--muted)}
  .history-empty{padding:48px 0;text-align:center;color:var(--muted);font-size:.84rem;letter-spacing:.1em}
  .history-list{display:flex;flex-direction:column;gap:2px}
  .history-item{background:var(--surface);border:1px solid var(--border);padding:18px 22px;cursor:pointer;transition:all .2s;display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center}
  .history-item:hover{background:var(--panel);border-color:var(--gold-dim)}
  .history-date{font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .history-verse{font-family:'Cormorant Garamond',serif;font-size:.98rem;font-style:italic;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .history-meta{font-size:.62rem;letter-spacing:.1em;color:var(--stone);margin-top:3px}
  .history-pillar{font-size:.57rem;letter-spacing:.17em;text-transform:uppercase;padding:3px 8px;border:1px solid;white-space:nowrap}
  .history-pillar.altar{color:var(--altar);border-color:var(--altar)}
  .history-pillar.forge{color:var(--forge);border-color:var(--forge)}
  .history-pillar.covenant{color:var(--covenant);border-color:var(--covenant)}
  .history-pillar.heritage{color:var(--heritage);border-color:var(--heritage)}
  .history-pillar.fortress{color:var(--fortress);border-color:var(--fortress)}

  /* Detail overlay */
  #detail-overlay{display:none;position:fixed;inset:0;background:rgba(26,24,20,.97);z-index:200;overflow-y:auto;padding:32px}
  .detail-inner{max-width:620px;margin:0 auto}
  .detail-close{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--muted);cursor:pointer;font-family:'Jost',sans-serif;font-size:.69rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:34px;padding:0;transition:color .2s}
  .detail-close:hover{color:var(--cream)}
  .detail-close::before{content:'←';font-size:1rem}
  .detail-date-label{font-size:.63rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .verse-day{animation:fadeUp .4s ease forwards}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border)}
  @media(max-width:600px){
    header{padding:16px 18px 13px}
    main{padding:0 18px 40px}
    .verse-text{font-size:1.42rem}
    .posture-grid{grid-template-columns:1fr}
    .history-item{grid-template-columns:1fr auto;grid-template-rows:auto auto}
    .history-date{grid-column:1}
    .history-verse-col{grid-column:1/-1;grid-row:2}
    .history-pillar{grid-row:1}
    #detail-overlay{padding:18px}
    .wordmark{font-size:1.18rem}
    .date-label{display:none}
    .cycle-item{font-size:.5rem;padding:7px 2px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="wordmark">Stead<span>fast</span></div>
    <div class="header-right">
      <span class="date-label" id="header-date"></span>
      <button class="nav-btn active" id="btn-today" onclick="showView('today')">Today</button>
      <button class="nav-btn" id="btn-history" onclick="showView('history')">Archive</button>
    </div>
  </header>
  <main>
    <div id="today-view"></div>
    <div id="history-view"></div>
  </main>
</div>
<div id="detail-overlay">
  <div class="detail-inner">
    <button class="detail-close" onclick="closeDetail()">Back to Archive</button>
    <div id="detail-content"></div>
  </div>
</div>
<script>
const VERSES_BY_PILLAR = {
  altar: [
    {
      pillar: `altar`,
      title: `When Outcomes Feel Personal`,
      verse: `To whom much is given, much will be required.`,
      ref: `Luke 12:48`,
      reflect: `When a project stalls, when a child pushes back, when the month ends short — a man who has confused stewardship with authorship takes it personally. Not just as disappointment, but as verdict. He walks back through his effort looking for what he should have done differently, as though the right combination of inputs guarantees the outcome he wanted. It does not. And that gap is where anxiety lives. The verse does not glorify pressure. It clarifies the actual assignment. To be given much is to be made responsible for faithfulness — not for sovereignty. A steward tends what is entrusted. An author controls what he has written. Most men are operating as authors while carrying a steward's assignment, and the mismatch is what makes the weight feel wrong.`,
      recalibrate: `When a result disappoints today, pause before deciding what it means about you. Ask instead whether you were faithful with your portion of it. Faithfulness is what you can answer for. The outcome has another author.`,
      enter: `Do your work today as a man who tends rather than controls. At the end of it, ask whether you were faithful — not whether it worked. Those are different questions, and only one of them is yours to answer.`,
    },
    {
      pillar: `altar`,
      title: `When Your Tone Sharpens`,
      verse: `Above all else, guard your heart, for everything you do flows from it.`,
      ref: `Proverbs 4:23`,
      reflect: `Tone rarely deteriorates because of circumstances. It deteriorates because of what a man has been rehearsing internally. Some frustration goes unexamined. Some comparison lingers. Some quiet resentment takes up residence and begins to color everything that comes out — often before he realizes it has shifted. A man can attempt to correct his speech while leaving the source untouched, and the sharpness will return because the posture that produces it was never addressed. Guarding the heart is not about emotional fragility — it is a form of leadership discipline. What circulates inside will surface outside, and it usually surfaces first toward the people who are closest.`,
      recalibrate: `If your tone was sharp this morning before the day gave you a reason, something was already running underneath it. You did not wake up irritable because of what happened at 7am — you woke up with what you went to bed carrying. Correction begins there, at whatever was left unexamined, not at the words themselves.`,
      enter: `Before you respond to the first difficult thing today, take one breath longer than feels necessary. Not to suppress what you feel — to make sure what comes out is chosen rather than reflexive. The household will feel the difference even if they cannot name it.`,
    },
    {
      pillar: `altar`,
      title: `When Faith Feels Mechanical`,
      verse: `Create in me a clean heart, O God, and renew a steadfast spirit within me.`,
      ref: `Psalm 51:10`,
      reflect: `A man can maintain the full external structure of his faith while the interior has gone quiet. He still reads. He still prays, technically. He shows up to the right places. But somewhere in the routine, the actual conversation stopped and the performance of it continued. He knows the difference. It feels hollow in a way that is hard to name without feeling like a failure for naming it. The verse does not prescribe more effort. It asks for honesty. A clean heart and a renewed spirit are not manufactured by adding more to the routine — they are restored when the man stops pretending the routine is working and says plainly that it is not. That honesty is not failure. It is the beginning of the renewal the verse is describing.`,
      recalibrate: `If you opened this page and felt nothing, that is worth acknowledging rather than pushing past. The drift is not a verdict on your faith — it is information about your posture. Name where the gap opened and when. That naming is the prayer.`,
      enter: `Pray one honest sentence today. Not a formal prayer — a real one. Whatever is actually true about where you are. Sincerity moves faster than structure when the distance between a man and God needs closing.`,
    },
    {
      pillar: `altar`,
      title: `Integrated Strength`,
      verse: `Be watchful, stand firm in the faith, act like men, be strong. Let all that you do be done in love.`,
      ref: `1 Corinthians 16:13–14`,
      reflect: `Strength and love are not opposites, though the culture treats them that way. The man who leads with only strength becomes someone his family navigates around rather than comes toward. The man who leads with only warmth becomes someone they do not fully trust when the situation requires a held line. The verse holds both together because leadership requires both — not alternating between them, but integrated. A man who is strong but harsh has not arrived at strength. He has arrived at force. Force generates compliance. Strength held in love generates trust. And trust is what allows a household to follow without fear — which is the only kind of following that holds when conditions get hard.`,
      recalibrate: `Think of a moment this week when you led with only half of what the verse describes. Either you held the line but the warmth was absent, or you were warm but the clarity was missing. Neither half alone is what the verse describes. Where does the integration need work today?`,
      enter: `Let your strength serve someone today rather than inform them of your position. Let your love include the willingness to say a hard thing. The man who can do both in the same sentence is the one his family actually trusts.`,
    },
    {
      pillar: `altar`,
      title: `Priority Before Pressure`,
      verse: `But seek first the kingdom of God and his righteousness, and all these things will be added to you.`,
      ref: `Matthew 6:33`,
      reflect: `Most men do not abandon their priorities. They defer them. The morning begins with a clear sense of what matters most, and by 9am the inbox has reorganized it. By noon the urgent has fully displaced the important. By evening the man is exhausted from activity and empty on what actually governs him — and tomorrow it begins again. The instruction is a hierarchy principle, not a productivity tip. When the ultimate is kept first, the lesser things do not disappear but they find their proper size. When it is displaced — even briefly, even reasonably — everything secondary begins to carry weight it was never designed to hold, and the man wonders why he is so tired from work that should feel meaningful.`,
      recalibrate: `Before you open the inbox, before you check what is waiting, name what is actually first today. Not what feels most urgent — what governs. Give it five minutes before the day establishes its own order for you.`,
      enter: `Seek first, then everything else. That sequence sounds simple because it is. The difficulty is that urgent things have loud voices and the ultimate does not. You have to choose it before the noise starts.`,
    },
    {
      pillar: `altar`,
      title: `Spirit of Power, Love, Self-Control`,
      verse: `For God gave us a spirit not of fear but of power and love and self-control.`,
      ref: `2 Timothy 1:7`,
      reflect: `Fear governs quietly. It does not usually announce itself as fear — it presents as caution, as wisdom, as the responsible hesitation of a man who has thought through the risks. The conversation he has been avoiding for three weeks. The boundary he has not drawn. The decision he keeps circling without making. Fear looks like patience until you examine it long enough to see that nothing is actually moving. The verse describes what has been given: power, love, and self-control. Not earned — given. The man who operates from fear has not lost access to these. He has simply not chosen them over the fear that is currently more present. That is a different problem than deficiency. It is a decision problem, and decisions can be made differently today.`,
      recalibrate: `Name the thing you have been avoiding under the banner of caution, timing, or wisdom. Ask whether it is actually any of those things, or whether it is fear operating with better vocabulary. Then decide what today requires.`,
      enter: `Act today from the disposition you want to be characterized by, not from the anxiety that presses hardest. Fear will always have a reason ready. Make the decision before consulting it.`,
    },
    {
      pillar: `altar`,
      title: `Fruit vs. Force`,
      verse: `But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, self-control.`,
      ref: `Galatians 5:22–23`,
      reflect: `A man can perform patience in the room and then say exactly what the patience was containing the moment he walks out of it. He can perform kindness toward someone he is resenting and have the resentment color every interaction for the rest of the day. The performance is exhausting because it requires constant effort to maintain what is not actually growing. That effort eventually fails. Fruit is the natural result of what is actually growing — which is why it does not require performance to sustain. The list in the verse is not a set of behaviors to produce. It is a description of what a man's character looks like when his inner life is in order. The question is not whether the fruit is visible. It is whether the root is attended to.`,
      recalibrate: `Where are you currently performing one of the qualities on this list rather than producing it? The performance is recognizable because it requires effort to maintain and collapses under pressure. The fruit does not. What is the root condition underneath?`,
      enter: `Attend to the root today rather than the display. The fruit will follow the root — and it will do so without requiring you to hold it in place. That is the difference between what is grown and what is performed.`,
    },
    {
      pillar: `altar`,
      title: `The Stayed Mind`,
      verse: `You keep him in perfect peace whose mind is stayed on you, because he trusts in you.`,
      ref: `Isaiah 26:3`,
      reflect: `By midday most men's minds have visited their finances, a difficult conversation, the project that is behind, what someone said last week, and something that has not happened yet but might. That is not thinking — that is the mind running its own agenda while the man nominally functions. The staying the verse describes is not about suppressing that drift. It is about having somewhere to return to when you notice it has happened. Perfect peace does not mean no disruption. It describes the internal condition of a man whose anchor holds even when everything above the surface is moving. The peace precedes the disruption because the staying precedes it — built in the quiet mornings before the day adds its weight.`,
      recalibrate: `Notice how many times your mind has already left the present since waking up. Where has it been? The staying is not one decision made once — it is the repeated, undramatic practice of returning. Each return is the discipline.`,
      enter: `When your mind drifts today — and it will — simply bring it back. No self-accusation, no elaborate reset. Just return. The man who does this ten times builds something the man who never drifts doesn't need to.`,
    },
    {
      pillar: `altar`,
      title: `Slow Anger as Intelligence`,
      verse: `Whoever is slow to anger has great understanding, but he who has a hasty temper exalts folly.`,
      ref: `Proverbs 14:29`,
      reflect: `A man who snaps at his child over something minor, or shuts down a conversation with his wife before it has actually gone anywhere, has not responded to the situation. He has responded to his first reading of it. That reading is almost always incomplete. Hasty anger is not strong. It is unprocessed — and the fallout it creates takes far longer to clean up than the interval of patience would have cost. Slow anger is not the absence of anger. It is anger that has passed through understanding before it moves. The man who is slow to anger still speaks plainly when something is wrong. He still addresses what needs addressing. But he arrives at his response with more accuracy, more authority, and less collateral damage than the man who moves immediately.`,
      recalibrate: `Think of the last time your anger landed harder than the moment warranted. What was your first reading of the situation? Was it complete? What did you learn afterward that you did not know when you responded? Slowness would have given you that information first.`,
      enter: `When something provokes you today, create a gap between the trigger and your response — even a small one. Use it to ask what is actually happening rather than confirming what you assumed. Your second reading is almost always more accurate than your first.`,
    },
    {
      pillar: `altar`,
      title: `Justice, Mercy, Humility`,
      verse: `He has told you, O man, what is good; and what does the Lord require of you but to do justice, and to love kindness, and to walk humbly with your God.`,
      ref: `Micah 6:8`,
      reflect: `The man who enforces standards without warmth produces a household that is technically ordered and emotionally cold. Children comply and cannot tell you why they feel distant. A wife manages the relationship rather than inhabiting it. The standard is upheld. The atmosphere is barren. Justice without mercy is law without life, and the people who live under it will follow it and quietly leave it as soon as they are able. The humility piece is the one most men underestimate. A man can pursue justice and mercy with considerable self-satisfaction — can be the fair, warm leader and still be governed by a need for credit that distorts everything downstream. Humility to walk with God rather than ahead of him is what keeps justice from becoming rigidity and mercy from becoming performance. It is the quietest of the three and the most structurally important.`,
      recalibrate: `Of the three — justice, kindness, humility — which one has been most practically absent in how you have led your household this week? Not the one you value most in principle. The one that has actually been thin in practice. That is the one to bring today.`,
      enter: `Lead with all three today, in that order: address what is wrong, do it with warmth, and hold the whole thing loosely enough that you are still correctable. That combination is rarer than any one of the three alone.`,
    },
    {
      pillar: `altar`,
      title: `The Weight of Responsibility`,
      verse: `Everyone to whom much was given, of him much will be required, and from him to whom they entrusted much, they will demand the more.`,
      ref: `Luke 12:48`,
      reflect: `There is a version of responsibility that quietly becomes a measurement of worth. A man starts to believe that how much he carries proves how much he matters — that the weight is the validation. He takes on more than is required. He stays later than he needs to. He makes himself indispensable in ways that feel like sacrifice but function as control. The need underneath is not to serve. It is to be necessary. He cannot see it clearly from inside it. From inside it looks like faithfulness. It feels like love for his family, dedication to his work, the kind of seriousness a responsible man should have. But his wife feels the difference between a man who carries weight because he loves her and a man who carries weight to prove something. His children feel it too. They are loved, technically. But they are also instruments of their father's need to feel essential, and they will eventually name that, or carry it unnamed into their own adulthood.`,
      recalibrate: `Is the weight you are carrying right now the actual assignment — or is some of it extra, taken on because releasing it would feel like losing something about yourself? The distinction is worth sitting with before the day presses you into carrying everything automatically.`,
      enter: `Do your work today as one who has been given something to tend. At the end of it, you are answerable for whether you tended it — not for whether the outcome confirmed your importance.`,
    },
    {
      pillar: `altar`,
      title: `Courage Without Noise`,
      verse: `Have I not commanded you? Be strong and courageous. Do not be frightened, and do not be dismayed, for the Lord your God is with you wherever you go.`,
      ref: `Joshua 1:9`,
      reflect: `The courage this verse is addressing is not the courage of a single decisive moment. It is the courage required for a long stretch of ordinary faithfulness when the work is slow, the feedback is absent, and the visible evidence that it is working is not there yet. Joshua is not being commanded to charge a hill. He is being told not to be afraid of what comes next, day after day, for years. Do not be frightened. Do not be dismayed. Both instructions assume that fear and discouragement will present themselves — the command is not to avoid the feeling but to refuse to be governed by it. The man who obeys this command does not feel nothing. He feels it and moves anyway, because the command to go does not wait for the feeling of readiness to arrive.`,
      recalibrate: `Where in your life right now does courage look like simply continuing — showing up again without fanfare, doing the work no one sees, holding a position that has not yet produced visible fruit? That is where this verse lands today.`,
      enter: `Move forward today in the one area where fear or discouragement has been setting the pace. Not loudly. Steadily. Courage in this context does not need an audience. It just needs to happen.`,
    },
    {
      pillar: `altar`,
      title: `The Steady Heart`,
      verse: `He is not afraid of bad news; his heart is firm, trusting in the Lord. His heart is steady; he will not be afraid.`,
      ref: `Psalm 112:6–7`,
      reflect: `When bad news arrives — and it will arrive today or tomorrow or the day after — the man whose stability depends on outcomes being favorable will absorb it differently than the man whose anchor is not tied to outcomes. The first man's peace is conditional. It exists while things are working and evaporates when they stop. That is not steadiness. That is a good run. The steady heart the verse describes is not numb or indifferent. This man is not unaffected by difficulty — he is not destabilized by it. The distinction matters. A man who feels the weight of bad news and does not collapse under it is not pretending it does not matter. He is anchored somewhere the news cannot reach.`,
      recalibrate: `When is the last time bad news changed your interior stability for more than an hour? That duration is informative. It reveals where the anchor actually is — whether it is in the circumstance or somewhere deeper that circumstances cannot move.`,

// ── PILLAR ORDER & POSTURE ───────────────────────────────────────
const PILLARS = ['altar','forge','covenant','heritage','fortress'];
const PILLAR_LABELS = { altar:'Altar', forge:'Forge', covenant:'Covenant', heritage:'Heritage', fortress:'Fortress' };

const POSTURE = [
  { pillar:'Altar',    question:'What will govern me today? Not pressure. Not fear. Not approval. Choose again what you serve.' },
  { pillar:'Forge',    question:'Where must I show strength today? Not loud strength — steady strength that does not collapse when the day becomes heavy.' },
  { pillar:'Covenant', question:'Who needs my steadiness today? Your family feels your presence long before they hear your words. Carry calm into the room.' },
  { pillar:'Heritage', question:'What small action today moves my family forward? Legacy is rarely built in grand moments. It is built in quiet consistency.' },
  { pillar:'Fortress', question:'What will I refuse to let inside today? Noise. Comparison. Unnecessary agitation. Guard the gate.' }
];

// ── DATE UTILS ──────────────────────────────────────────────────
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dayNumber(key) {
  // Days since epoch — used for pillar rotation and intra-pillar shuffle
  const [y,m,d] = key.split('-').map(Number);
  return Math.floor(new Date(y,m-1,d).getTime() / 86400000);
}
function dateKeyToDisplay(key) {
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
function dateKeyToShort(key) {
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

// ── VERSE SELECTION ─────────────────────────────────────────────
// Day 0 = Altar, Day 1 = Forge, Day 2 = Covenant, Day 3 = Heritage, Day 4 = Fortress, Day 5 = Altar...
// Within each pillar, entry is selected by a deterministic shuffle seeded by dayNumber
function getVerseForKey(key) {
  const dn = dayNumber(key);
  const pillarIdx = dn % 5;
  const pillar = PILLARS[pillarIdx];
  const pool = VERSES_BY_PILLAR[pillar];

  // Fisher-Yates-style deterministic index using day seed
  // We use a simple LCG hash of dn to pick within the pool
  let seed = dn;
  seed = ((seed * 1664525 + 1013904223) >>> 0);
  // Also mix in the pillar cycle count so even same-pillar days differ
  seed = ((seed ^ (dn >>> 3)) * 2246822519) >>> 0;
  const idx = seed % pool.length;

  return { ...pool[idx], pillarIdx };
}

// ── STORAGE ─────────────────────────────────────────────────────
function saveToday() {
  const key = todayKey();
  const stored = JSON.parse(localStorage.getItem('steadfast_history') || '{}');
  if (!stored[key]) { stored[key] = true; localStorage.setItem('steadfast_history', JSON.stringify(stored)); }
}
function getHistory() {
  const stored = JSON.parse(localStorage.getItem('steadfast_history') || '{}');
  const today = todayKey();
  return Object.keys(stored).filter(k => k !== today).sort((a,b) => b.localeCompare(a));
}

// ── RENDER HELPERS ───────────────────────────────────────────────
function pillarColor(p) { return `var(--${p})`; }

function renderCycleStrip(activePillar) {
  return `<div class="cycle-strip">${PILLARS.map(p =>
    `<div class="cycle-item ${p} ${p===activePillar?'active':''}">${PILLAR_LABELS[p]}</div>`
  ).join('')}</div>`;
}

function renderVerseBlock(v) {
  return `
    <div class="verse-day">
      <div class="pillar-tag ${v.pillar}"><span class="pillar-dot"></span>${PILLAR_LABELS[v.pillar]}</div>
      <div class="verse-title">${v.title}</div>
      <div class="verse-text">"${v.verse}"</div>
      <div class="verse-ref">${v.ref}</div>
    </div>
    <div class="section-label">Reflect</div>
    <div class="reflect-text">${v.reflect}</div>
    <div class="recalibrate-block">
      <div class="section-label">Recalibrate</div>
      <p>${v.recalibrate}</p>
    </div>
    <div class="divider"></div>
    <div class="enter-day-block">
      <div class="section-label">Enter the Day</div>
      <p>${v.enter}</p>
    </div>
  `;
}

function renderPosture() {
  return `
    <div class="divider" style="margin-top:38px"></div>
    <div class="section-label" style="margin-bottom:14px">Morning Posture</div>
    <div class="posture-grid">
      ${POSTURE.map(p=>`<div class="posture-item"><div class="posture-pillar">${p.pillar}</div><div class="posture-question">${p.question}</div></div>`).join('')}
    </div>
  `;
}

// ── INIT TODAY ───────────────────────────────────────────────────
function initToday() {
  const key = todayKey();
  saveToday();
  document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const v = getVerseForKey(key);
  document.getElementById('today-view').innerHTML = renderVerseBlock(v) + renderCycleStrip(v.pillar) + renderPosture();
}

// ── HISTORY ──────────────────────────────────────────────────────
function renderHistory() {
  const keys = getHistory();
  const hv = document.getElementById('history-view');
  if (keys.length === 0) {
    hv.innerHTML = `<div class="history-header"><div class="history-title">Archive</div></div><div class="history-empty">No past days yet. Return tomorrow.</div>`;
    return;
  }
  hv.innerHTML = `
    <div class="history-header">
      <div class="history-title">Archive</div>
      <div class="history-count">${keys.length} day${keys.length!==1?'s':''}</div>
    </div>
    <div class="history-list">
      ${keys.map(key => {
        const v = getVerseForKey(key);
        return `<div class="history-item" onclick="openDetail('${key}')">
          <div class="history-date">${dateKeyToShort(key)}</div>
          <div class="history-verse-col">
            <div class="history-verse">"${v.verse}"</div>
            <div class="history-meta">${v.title} &middot; ${v.ref}</div>
          </div>
          <div><span class="history-pillar ${v.pillar}">${PILLAR_LABELS[v.pillar]}</span></div>
        </div>`;
      }).join('')}
    </div>`;
}

// ── VIEWS ────────────────────────────────────────────────────────
function showView(view) {
  const tv = document.getElementById('today-view');
  const hv = document.getElementById('history-view');
  const bt = document.getElementById('btn-today');
  const bh = document.getElementById('btn-history');
  if (view === 'today') {
    tv.style.display='block'; hv.style.display='none';
    bt.classList.add('active'); bh.classList.remove('active');
  } else {
    tv.style.display='none'; hv.style.display='block';
    bt.classList.remove('active'); bh.classList.add('active');
    renderHistory();
  }
}

// ── DETAIL ───────────────────────────────────────────────────────
function openDetail(key) {
  const v = getVerseForKey(key);
  document.getElementById('detail-content').innerHTML =
    `<div class="detail-date-label">${dateKeyToDisplay(key)}</div>` + renderVerseBlock(v);
  const o = document.getElementById('detail-overlay');
  o.style.display='block'; o.scrollTop=0;
}
function closeDetail() { document.getElementById('detail-overlay').style.display='none'; }
document.getElementById('detail-overlay').addEventListener('click',function(e){ if(e.target===this) closeDetail(); });

// ── RUN ──────────────────────────────────────────────────────────
initToday();
</script>
