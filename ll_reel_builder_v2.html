<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>L&L Reel Builder v2</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --navy:#171D27; --bronze:#8A7450; --bronze-light:#C9A96E;
  --parchment:#d8cebb; --dark:#0e1218; --panel:#1c2333;
  --border:#2a3347; --text:#a8b4c8; --bright:#d0dae8;
  --green:#4a7c59; --red:#7c4a4a;
}
html,body { background:var(--dark); color:var(--text); font-family:system-ui,sans-serif; font-size:13px; }

/* ══ HEADER ══ */
.header { background:var(--panel); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:12px; }
.header-brand { font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:300; letter-spacing:0.24em; text-transform:uppercase; color:var(--bronze); }
.header-sub { font-family:system-ui; font-size:8px; letter-spacing:0.2em; text-transform:uppercase; color:#3a4560; margin-left:auto; }

/* ══ TABS ══ */
.tab-bar { display:flex; background:var(--panel); border-bottom:1px solid var(--border); }
.tab-btn { flex:1; padding:10px 8px; background:none; border:none; color:var(--text); font-family:system-ui; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; border-bottom:2px solid transparent; }
.tab-btn.active { color:var(--bronze); border-bottom-color:var(--bronze); }

/* ══ PANELS ══ */
.panel { display:none; padding:14px 16px; padding-bottom:80px; }
.panel.active { display:block; }

/* ══ SECTION ══ */
.section { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:14px; margin-bottom:12px; }
.section-title { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--bronze); margin-bottom:12px; }

/* ══ FIELDS ══ */
.field { margin-bottom:10px; }
.field label { display:block; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text); margin-bottom:5px; }
.field select, .field input, .field textarea {
  width:100%; background:var(--navy); border:1px solid var(--border); border-radius:4px;
  padding:9px 10px; color:var(--bright); font-family:system-ui; font-size:13px; outline:none; -webkit-appearance:none;
}
.field textarea { resize:none; line-height:1.5; font-family:'Cormorant Garamond',serif; font-size:14px; }
.field-row { display:flex; gap:10px; }
.field-row .field { flex:1; }

/* ══ FRAMES ══ */
.frame-item { background:var(--navy); border:1px solid var(--border); border-radius:5px; padding:10px 12px; margin-bottom:8px; }
.frame-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.frame-num { font-family:'Cormorant Garamond',serif; font-size:14px; color:var(--bronze); font-style:italic; min-width:18px; }
.frame-input { flex:1; background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--parchment); font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:300; padding:4px 0 5px; outline:none; letter-spacing:0.02em; }
.frame-input:focus { border-bottom-color:var(--bronze); }
.frame-input::placeholder { color:#2a3347; }
.frame-del { background:none; border:none; color:var(--red); cursor:pointer; font-size:16px; padding:2px 4px; opacity:0.6; }
.frame-del:active { opacity:1; }
.frame-controls { display:flex; align-items:center; gap:14px; }
.frame-controls label { font-size:10px; color:var(--text); display:flex; align-items:center; gap:5px; cursor:pointer; }
.frame-controls input[type=checkbox] { accent-color:var(--bronze); width:14px; height:14px; }
.frame-hold { background:var(--navy); border:1px solid var(--border); border-radius:3px; color:var(--text); font-size:11px; padding:3px 7px; width:64px; text-align:center; outline:none; }
.add-frame-btn { width:100%; background:none; border:1px dashed var(--border); border-radius:4px; padding:10px; color:var(--text); cursor:pointer; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin-top:4px; }
.add-frame-btn:active { border-color:var(--bronze); color:var(--bronze); }

/* ══ PREVIEW ══ */
.preview-wrap { background:#171D27; border:1px solid var(--border); border-radius:6px; aspect-ratio:9/16; max-height:50vw; overflow:hidden; position:relative; margin-bottom:12px; display:flex; align-items:center; justify-content:center; }
.preview-stage { text-align:center; padding:20px; }
.preview-line { font-family:'Cormorant Garamond',serif; font-size:4.5vw; font-weight:300; color:var(--parchment); letter-spacing:0.03em; line-height:1.3; margin-bottom:4px; }
.preview-line.bronze { color:var(--bronze); }
.preview-empty { font-size:10px; color:#2a3347; letter-spacing:0.1em; text-transform:uppercase; }
.preview-brand { position:absolute; bottom:12px; left:0; right:0; text-align:center; font-family:'Cormorant Garamond',serif; font-size:3vw; letter-spacing:0.25em; text-transform:uppercase; color:rgba(138,116,80,0.5); }
.play-btn { position:absolute; top:8px; right:8px; background:rgba(138,116,80,0.15); border:1px solid rgba(138,116,80,0.3); color:var(--bronze); font-size:10px; letter-spacing:0.1em; padding:4px 10px; border-radius:3px; cursor:pointer; font-family:system-ui; }

/* ══ BUTTONS ══ */
.btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.btn { padding:10px 14px; border-radius:4px; border:none; cursor:pointer; font-family:system-ui; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; font-weight:700; flex:1; }
.btn-primary { background:var(--bronze); color:#0e1218; }
.btn-secondary { background:var(--navy); color:var(--bronze); border:1px solid var(--bronze); }
.btn-ghost { background:var(--navy); color:var(--text); border:1px solid var(--border); }

/* ══ CAPTION / TAGS ══ */
.caption-display { font-family:'Cormorant Garamond',serif; font-size:13px; line-height:1.75; color:rgba(208,218,232,0.75); white-space:pre-line; margin-bottom:10px; }
.tag-section-label { font-size:8px; letter-spacing:0.22em; text-transform:uppercase; color:#3a3028; margin-bottom:7px; display:flex; justify-content:space-between; align-items:center; }
.tag-rotate-btn { font-size:8px; letter-spacing:0.12em; background:none; border:1px solid var(--border); color:#5a5038; padding:2px 7px; border-radius:2px; cursor:pointer; }
.tag-chips { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; }
.tag-chip { font-family:system-ui; font-size:10px; letter-spacing:0.04em; padding:4px 9px; border-radius:2px; border:1px solid transparent; }
.tag-chip.anchor  { background:#141008; border-color:#2A2010; color:var(--bronze-light); }
.tag-chip.pillar  { background:#0E1610; border-color:#1E2A18; color:#6A9A5A; }
.tag-chip.discover{ background:#0E1018; border-color:#1A2028; color:#5A7AAA; cursor:pointer; }
.send-btn { width:100%; padding:13px; background:var(--bronze); color:#0e1218; border:none; border-radius:4px; font-family:system-ui; font-size:11px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer; margin-top:6px; }
.send-status { font-family:system-ui; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:#4A8A4A; text-align:center; min-height:14px; padding-top:5px; }

/* ══ BANK ══ */
.bank-item { background:var(--navy); border:1px solid var(--border); border-radius:5px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
.bank-item:active { border-color:var(--bronze); }
.bank-item.used { opacity:0.4; }
.bank-item-title { font-size:12px; color:var(--bright); margin-bottom:3px; }
.bank-item-meta  { font-size:9px; color:var(--text); letter-spacing:0.08em; display:flex; gap:8px; align-items:center; }
.bank-tag { font-size:8px; letter-spacing:0.1em; text-transform:uppercase; padding:1px 5px; border-radius:2px; background:var(--border); color:var(--text); }
.bank-tag.ll { background:rgba(138,116,80,0.15); color:var(--bronze); }
.bank-tag.hd { background:rgba(74,124,168,0.15); color:#7ab4d8; }
.bank-del { margin-left:auto; background:none; border:none; color:var(--red); cursor:pointer; font-size:12px; opacity:0.6; padding:0 2px; }

/* ══ CADENCE ══ */
.cadence-row { display:flex; align-items:stretch; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
.cadence-row:last-child { border-bottom:none; }
.cadence-row.today { background:rgba(138,116,80,0.04); border-radius:4px; margin:0 -4px; padding:8px 4px; }
.cs-day { font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--text); min-width:28px; padding-top:1px; }
.cadence-row.today .cs-day { color:var(--bronze); font-weight:700; }
.cs-content { flex:1; }
.cs-style { font-size:11px; color:var(--bronze-light); margin-bottom:2px; }
.cs-desc { font-size:10px; color:var(--text); font-style:italic; margin-bottom:3px; }
.cs-card { font-size:9px; color:#3a4560; letter-spacing:0.06em; }
.cs-apply { background:none; border:1px solid var(--border); border-radius:3px; padding:4px 8px; color:var(--text); font-size:9px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; align-self:center; flex-shrink:0; }
.cs-apply:active { border-color:var(--bronze); color:var(--bronze); }
.today-pip { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--bronze); margin-left:5px; vertical-align:middle; }

/* ══ CALENDAR ══ */
.cal-item { background:var(--navy); border:1px solid var(--border); border-radius:5px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
.cal-item.posted    { border-color:var(--green); }
.cal-item.scheduled { border-color:rgba(138,116,80,0.4); }
.cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.cal-date { font-size:10px; color:var(--bright); font-weight:400; }
.cal-status { font-size:8px; letter-spacing:0.1em; text-transform:uppercase; padding:2px 6px; border-radius:2px; }
.cal-status.draft     { background:var(--border); color:var(--text); }
.cal-status.scheduled { background:rgba(138,116,80,0.15); color:var(--bronze); }
.cal-status.posted    { background:rgba(74,124,89,0.15); color:var(--green); }
.cal-title { font-size:12px; color:var(--bright); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-meta { display:flex; gap:6px; align-items:center; }
.cal-actions { display:flex; gap:6px; margin-left:auto; }
.cal-action-btn { background:none; border:none; cursor:pointer; font-size:11px; padding:0 2px; }

/* ══ NOTIF ══ */
.notif { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--bronze); color:#0e1218; padding:8px 20px; border-radius:4px; font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; transition:transform .25s; z-index:999; white-space:nowrap; }
.notif.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">L&L · Reel Builder</div>
  <div class="header-sub">v2</div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('build')">Build</button>
  <button class="tab-btn" onclick="switchTab('queue')">Queue</button>
  <button class="tab-btn" onclick="switchTab('caption')">Caption</button>
  <button class="tab-btn" onclick="switchTab('bank')">Bank</button>
  <button class="tab-btn" onclick="switchTab('cadence')">Cadence</button>
  <button class="tab-btn" onclick="switchTab('calendar')">Schedule</button>
</div>

<!-- ══ BUILD TAB ══ -->
<div class="panel active" id="tab-build">

  <!-- Preview -->
  <div class="preview-wrap">
    <button class="play-btn" onclick="playPreview()">▶ Play</button>
    <div class="preview-stage" id="preview-stage">
      <div class="preview-empty">Add frames below</div>
    </div>
    <div class="preview-brand" id="preview-brand">Legacy & Lineage</div>
  </div>

  <!-- Meta -->
  <div class="section">
    <div class="section-title">Reel Info</div>
    <div class="field-row">
      <div class="field">
        <label>Brand</label>
        <select id="brand" onchange="onBrandChange()">
          <option value="ll">L&L</option>
          <option value="hd">Heroic Dad</option>
        </select>
      </div>
      <div class="field">
        <label>Style</label>
        <select id="style" onchange="onStyleChange()">
          <option value="drift">Drift</option>
          <option value="doctrine">Doctrine</option>
          <option value="stabilizer">Stabilizer</option>
          <option value="cinematic">Cinematic</option>
          <option value="pillars">Five Pillars</option>
          <option value="le-altar">LE — Altar</option>
          <option value="le-forge">LE — Forge</option>
          <option value="le-covenant">LE — Covenant</option>
          <option value="le-heritage">LE — Heritage</option>
          <option value="le-fortress">LE — Fortress</option>
          <option value="le-drift">LE — Drift</option>
          <option value="hd-presence">HD — Presence</option>
          <option value="hd-connection">HD — Connection</option>
          <option value="hd-relief">HD — Relief</option>
          <option value="hd-recognition">HD — Recognition</option>
          <option value="custom">Custom</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Pillar</label>
        <select id="pillar">
          <option value="general">General</option>
          <option value="altar">Altar</option>
          <option value="forge">Forge</option>
          <option value="covenant">Covenant</option>
          <option value="heritage">Heritage</option>
          <option value="fortress">Fortress</option>
          <option value="drift">Drift</option>
          <option value="presence">Presence</option>
          <option value="connection">Connection</option>
          <option value="relief">Relief</option>
        </select>
      </div>
      <div class="field">
        <label>Platform</label>
        <select id="platform">
          <option value="both">Reels + TikTok</option>
          <option value="reels">Reels Only</option>
          <option value="tiktok">TikTok Only</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Title / Note</label>
      <input type="text" id="post-title" placeholder="e.g. drift_01 — week 1 monday">
    </div>
    <div class="field">
      <label>Schedule Date</label>
      <input type="date" id="post-date">
    </div>
  </div>

  <!-- Frames -->
  <div class="section">
    <div class="section-title">Frames</div>
    <div id="frames-list"></div>
    <button class="add-frame-btn" onclick="addFrame()">+ Add Frame</button>
  </div>

  <!-- Actions -->
  <div class="btn-row">
    <button class="btn btn-primary" onclick="buildAndDownload()">⬇ Build Reel HTML</button>
    <button class="btn btn-secondary" onclick="saveToBank()">Save</button>
  </div>
  <div class="btn-row" style="margin-top:6px;">
    <button class="btn btn-ghost" onclick="loadTemplate()">↻ Load Template</button>
    <button class="btn btn-ghost" onclick="schedulePost()">📅 Schedule</button>
    <button class="btn btn-ghost" onclick="clearBuilder()">Clear</button>
  </div>

</div>

<!-- ══ CAPTION TAB ══ -->
<div class="panel" id="tab-caption">
  <div class="section">
    <div class="section-title">Caption</div>
    <div class="field">
      <textarea id="caption-text" rows="6" placeholder="Caption for this reel..."></textarea>
    </div>
    <div class="tag-section-label">
      <span>5 Tags — Auto-rotated</span>
      <button class="tag-rotate-btn" onclick="rotateReelTags()">↻ Rotate</button>
    </div>
    <div class="tag-chips" id="reel-tag-chips"></div>
    <div style="font-family:system-ui;font-size:8px;color:#2A2218;letter-spacing:.1em;margin-bottom:10px;">
      <span style="color:#4A3A20;">●</span> Anchor &nbsp;<span style="color:#2A4020;">●</span> Pillar &nbsp;<span style="color:#1A2A4A;">●</span> Discovery
    </div>
    <div id="reel-hashtag-hidden" style="display:none;"></div>
    <button class="send-btn" onclick="sendReelCaption()">↑ Copy + Share</button>
    <div class="send-status" id="reel-send-status"></div>
  </div>
  <div class="section">
    <div class="section-title">Frame Script — For Reference</div>
    <div id="frame-script" style="font-family:'Cormorant Garamond',serif;font-size:13px;line-height:2;color:rgba(208,218,232,0.5);white-space:pre-line;"></div>
  </div>
</div>

<!-- ══ BANK TAB ══ -->
<div class="panel" id="tab-bank">
  <div class="section">
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Reel Bank</span>
      <div style="display:flex;gap:6px;">
        <select id="bank-filter" style="background:var(--navy);border:1px solid var(--border);border-radius:3px;padding:4px 8px;color:var(--text);font-size:10px;outline:none;" onchange="renderBank()">
          <option value="all">All</option>
          <option value="ll">L&L</option>
          <option value="hd">HD</option>
          <option value="unused">Unused</option>
        </select>
      </div>
    </div>
    <div id="bank-list"></div>
  </div>
</div>

<!-- ══ QUEUE TAB ══ -->
<div class="panel" id="tab-queue">
  <div class="section">
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span id="queue-title">Reel Queue</span>
      <span id="queue-meta" style="font-size:8px;color:#555;letter-spacing:0.1em;"></span>
    </div>
    <div class="btn-row" style="margin-bottom:10px;">
      <button class="btn btn-primary" onclick="document.getElementById('reel-json-input').click()" style="flex:2;">⬆ Import Week JSON</button>
      <input type="file" id="reel-json-input" accept=".json" onchange="importReelJSON(event)" style="display:none">
      <button class="btn btn-secondary" onclick="loadNextReelWeek()">↻ Next Week</button>
    </div>
    <div id="reel-archive-strip" style="display:none;margin-bottom:8px;">
      <div style="font-family:system-ui;font-size:8px;letter-spacing:0.2em;text-transform:uppercase;color:#3A3028;margin-bottom:5px;">Archive</div>
      <div id="reel-archive-list" style="display:flex;flex-direction:column;gap:3px;max-height:80px;overflow-y:auto;"></div>
    </div>
    <div id="reel-queue-preview" style="display:none;background:var(--navy);border:1px solid rgba(138,116,80,0.3);border-radius:4px;padding:10px 12px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span id="rqp-label" style="font-family:system-ui;font-size:8px;letter-spacing:0.2em;text-transform:uppercase;color:var(--bronze);"></span>
        <div style="display:flex;gap:5px;">
          <button class="btn btn-secondary" style="flex:none;padding:5px 9px;font-size:9px;" onclick="prevReelItem()">←</button>
          <button class="btn btn-secondary" style="flex:none;padding:5px 9px;font-size:9px;" onclick="nextReelItem()">→</button>
          <button class="btn btn-primary"   style="flex:none;padding:5px 9px;font-size:9px;" onclick="switchTab('build')">Edit</button>
        </div>
      </div>
      <div id="rqp-title" style="font-family:'Cormorant Garamond',serif;font-size:14px;color:rgba(208,218,232,0.8);margin-bottom:4px;"></div>
      <div id="rqp-frames" style="font-family:system-ui;font-size:9px;color:#3a4560;letter-spacing:0.06em;"></div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn btn-secondary" style="font-size:9px;padding:6px;" onclick="buildCurrentQueueReel()">⬇ Build This Reel</button>
        <button class="btn btn-secondary" style="font-size:9px;padding:6px;" onclick="switchTab('caption')">Caption + Tags</button>
      </div>
    </div>
    <div id="reel-queue-grid" style="display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;">
      <div style="font-family:Georgia,serif;font-size:11px;color:#3A3028;font-style:italic;padding:12px 0;text-align:center;">Import a Week JSON to load reel queue.</div>
    </div>
    <div style="margin-top:8px;text-align:right;">
      <button onclick="archiveReelWeek()" style="font-family:system-ui;font-size:8px;letter-spacing:0.12em;text-transform:uppercase;background:none;border:1px solid var(--border);border-radius:3px;color:var(--bronze);padding:4px 8px;cursor:pointer;">✓ Archive Week</button>
    </div>
  </div>
</div>

<!-- ══ CADENCE TAB ══ -->
<div class="panel" id="tab-cadence">
  <div class="section">
    <div class="section-title">7-Day Reel Cadence</div>
    <div id="cadence-list"></div>
  </div>
  <div class="section">
    <div class="section-title">HD Cadence</div>
    <div id="hd-cadence-list"></div>
  </div>
</div>

<!-- ══ CALENDAR TAB ══ -->
<div class="panel" id="tab-calendar">
  <div class="section">
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Schedule</span>
      <button onclick="addCalendarEntry()" style="background:none;border:1px solid var(--border);border-radius:3px;padding:3px 8px;color:var(--bronze);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;">+ Add</button>
    </div>
    <div id="calendar-list"></div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const STORE_KEY = 'll_reel_v2';
let state = { posts:[], calendar:[], frames:[], previewTimer:null };

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s) { state.posts = s.posts||[]; state.calendar = s.calendar||[]; }
  } catch(e) {}
}
function saveState() {

const LL_ANCHORS  = ['#legacyandlineage','#governedman'];
const HD_ANCHORS  = ['#heroicdad','#presentdad'];

const LL_PILLAR_MAP = {
  altar:'#biblicalmanhood', forge:'#christianmanhood', covenant:'#householdgovernance',
  heritage:'#fatherhood', fortress:'#householdleadership', drift:'#masculineleadership',
  general:'#governedman'
};
const HD_PILLAR_MAP = {
  presence:'#dadlife', connection:'#intentionalparenting', relief:'#fatherhood',
  recognition:'#dadsofdaughters', general:'#dadlife'
};

const LL_DISCOVERY = [
  '#christiandad','#intentionalliving','#menonpurpose','#faithandfamily',
  '#spiritualleadership','#householdfaith','#godlyman','#christianmen',
  '#menofgod','#fatherlegacy','#thefieldmanual','#formation',
  '#christianfatherhood','#marriagegoals','#householdleadership'
];
const HD_DISCOVERY = [
  '#beabetterdad','#consciousparenting','#christiandad','#familyleadership',
  '#emotionalintelligence','#fatherlife','#dadadvice','#raisingboys',
  '#raisinggirls','#familyfirst','#presentfather','#christianparenting',
  '#mentalhealthformen','#strongfamily','#intentionalliving'
];

const TAG_KEY = 'll_reel_tags';
function getTagState() { try { return JSON.parse(localStorage.getItem(TAG_KEY))||{idx:0}; } catch { return {idx:0}; } }
function saveTagState(s) { try { localStorage.setItem(TAG_KEY,JSON.stringify(s)); } catch {} }

let _currentReelTags = null;

function buildReelTags(brand, pillar, rotate) {
  const anchors = brand==='hd' ? HD_ANCHORS : LL_ANCHORS;
  const pillarMap = brand==='hd' ? HD_PILLAR_MAP : LL_PILLAR_MAP;
  const pool = brand==='hd' ? HD_DISCOVERY : LL_DISCOVERY;
  const pillarTag = pillarMap[pillar] || pillarMap.general;
  const state = getTagState();
  let idx = rotate ? (state.idx+2)%pool.length : state.idx;
  const d1=pool[idx%pool.length], d2=pool[(idx+1)%pool.length];
  if (rotate) { state.idx=(idx+2)%pool.length; saveTagState(state); }
  return { anchors, pillar:pillarTag, discovery:[d1,d2], all:[...anchors,pillarTag,d1,d2].join(' ') };
}

function renderReelTags() {
  const brand  = document.getElementById('brand').value;
  const pillar = document.getElementById('pillar').value;
  if (!_currentReelTags) _currentReelTags = buildReelTags(brand, pillar, false);
  const tags = _currentReelTags;
  const chips = document.getElementById('reel-tag-chips');
  chips.innerHTML = [
    ...tags.anchors.map(t=>`<span class="tag-chip anchor">${t}</span>`),
    `<span class="tag-chip pillar">${tags.pillar}</span>`,
    ...tags.discovery.map(t=>`<span class="tag-chip discover">${t}</span>`)
  ].join('');
  document.getElementById('reel-hashtag-hidden').textContent = tags.all;
}

function rotateReelTags() {
  const brand  = document.getElementById('brand').value;
  const pillar = document.getElementById('pillar').value;
  _currentReelTags = buildReelTags(brand, pillar, true);
  renderReelTags();
}

function refreshReelTags() {
  const brand  = document.getElementById('brand').value;
  const pillar = document.getElementById('pillar').value;
  _currentReelTags = buildReelTags(brand, pillar, false);
  renderReelTags();
}

function getFullReelCaption() {
  const cap  = document.getElementById('caption-text').value;
  const tags = _currentReelTags?.all || document.getElementById('reel-hashtag-hidden').textContent || '';
  return cap + '\n\n' + tags;
}

async function sendReelCaption() {
  const text   = getFullReelCaption();
  const status = document.getElementById('reel-send-status');
  try { await navigator.clipboard.writeText(text); } catch(e) { fallbackCopy(text); }
  status.textContent = '✓ Copied to clipboard';
  if (navigator.share) {
    try { await navigator.share({text}); status.textContent = '✓ Shared'; }
    catch(e) {}
  } else { status.textContent = '✓ Copied -- paste into app'; }
  setTimeout(()=>status.textContent='',4000);
}

function fallbackCopy(text) {
  const ta=document.createElement('textarea'); ta.value=text;
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px;';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}

function uid() { return Math.random().toString(36).slice(2,9); }

function addFrame(text='', bronze=false, hold=3200) {

  updatePreview();

function removeFrame(id) {
  state.frames = state.frames.filter(f=>f.id!==id);
  renderFrames(); updatePreview();
}

function updateFrame(id, key, value) {
  const f = state.frames.find(f=>f.id===id);

function updatePreview() {
  const stage = document.getElementById('preview-stage');
  const brand = document.getElementById('brand').value;
  const frames = state.frames.filter(f=>f.text.trim());
  document.getElementById('preview-brand').textContent = brand==='hd'?'Heroic Dad':'Legacy & Lineage';
  if (!frames.length) { stage.innerHTML='<div class="preview-empty">Add frames below</div>'; return; }
  stage.innerHTML = frames.map(f=>`<div class="preview-line${f.bronze?' bronze':''}">${esc(f.text)}</div>`).join('');
}

function playPreview() {
  if (state.previewTimer) { clearTimeout(state.previewTimer); state.previewTimer=null; }
  const frames = state.frames.filter(f=>f.text.trim());
  if (!frames.length) return;
  const stage = document.getElementById('preview-stage');
  let i = 0;
  function show() {
    if (i>=frames.length) { updatePreview(); return; }
    const f=frames[i];
    stage.innerHTML=`<div class="preview-line${f.bronze?' bronze':''}">${esc(f.text)}</div>`;
    state.previewTimer = setTimeout(()=>{i++;show();}, Math.min(f.hold*0.35, 1200));
  }
  show();
}

function collectPost() {
  return {
    id:uid(), brand:document.getElementById('brand').value,
    style:document.getElementById('style').value,
    pillar:document.getElementById('pillar').value,
    platform:document.getElementById('platform').value,
    title:document.getElementById('post-title').value||'Untitled',
    date:document.getElementById('post-date').value,
    caption:document.getElementById('caption-text').value,
    frames:JSON.parse(JSON.stringify(state.frames)),
    used:false, createdAt:new Date().toISOString()
  };
}

function saveToBank() {
  state.posts.push(collectPost());
  saveState(); renderBank(); notify('Saved to bank');
}

function schedulePost() {
  const post = collectPost();
  const existing = state.calendar.find(c=>c.date===post.date);
  if (existing) { Object.assign(existing,{title:post.title,style:post.style,brand:post.brand,status:'scheduled',post}); }
  else state.calendar.push({id:uid(),title:post.title,style:post.style,brand:post.brand,status:'scheduled',date:post.date,post});
  state.posts.push({...post,used:false});
  saveState(); renderCalendar(); renderBank(); notify('Scheduled');
}

function renderBank() {
  const filter = document.getElementById('bank-filter').value;
  const el = document.getElementById('bank-list');
  let posts = [...state.posts].reverse();
  if (filter==='ll') posts=posts.filter(p=>p.brand==='ll');
  if (filter==='hd') posts=posts.filter(p=>p.brand==='hd');
  if (filter==='unused') posts=posts.filter(p=>!p.used);
  if (!posts.length) { el.innerHTML='<div style="color:var(--text);font-size:11px;padding:8px 0;">No posts yet.</div>'; return; }
  el.innerHTML = posts.map(p=>`
    <div class="bank-item${p.used?' used':''}" onclick="loadFromBank('${p.id}')">
      <div class="bank-item-title">${esc(p.title)}</div>
      <div class="bank-item-meta">
        <span class="bank-tag ${p.brand}">${p.brand.toUpperCase()}</span>
        <span class="bank-tag">${p.style}</span>
        <span style="color:var(--text);font-size:9px;">${p.date||''}</span>
        <button class="bank-del" onclick="event.stopPropagation();deletePost('${p.id}')">✕</button>
      </div>
    </div>
  `).join('');
}

function loadFromBank(id) {
  const p = state.posts.find(p=>p.id===id);
  if (!p) return;
  document.getElementById('brand').value   = p.brand;
  document.getElementById('style').value   = p.style;
  document.getElementById('pillar').value  = p.pillar;
  document.getElementById('platform').value= p.platform;
  document.getElementById('post-title').value = p.title;
  document.getElementById('post-date').value  = p.date;
  document.getElementById('caption-text').value = p.caption||'';
  state.frames = p.frames.map(f=>({...f,id:uid()}));
  renderFrames(); updatePreview(); switchTab('build'); notify('Loaded');
}

function deletePost(id) {
  state.posts=state.posts.filter(p=>p.id!==id);
  saveState(); renderBank();
}

  if (!sorted.length) { el.innerHTML='<div style="color:var(--text);font-size:11px;">No scheduled posts.</div>'; return; }
  el.innerHTML = sorted.map(item=>`
    <div class="cal-item ${item.status||'draft'}" onclick="loadCalItem('${item.id}')">
      <div class="cal-header">
        <div class="cal-date">${fmtDate(item.date)}</div>
        <div class="cal-status ${item.status||'draft'}">${item.status||'draft'}</div>
      </div>
      <div class="cal-title">${esc(item.title||'Untitled')}</div>
      <div class="cal-meta">
        <span class="bank-tag ${item.brand}">${(item.brand||'ll').toUpperCase()}</span>
        <span class="bank-tag">${item.style||''}</span>
        <div class="cal-actions">
          <button class="cal-action-btn" style="color:var(--green);" onclick="event.stopPropagation();markPosted('${item.id}')">✓</button>
          <button class="cal-action-btn" style="color:var(--red);" onclick="event.stopPropagation();deleteCalItem('${item.id}')">✕</button>
        </div>
      </div>
    </div>
  `).join('');
}

function addCalendarEntry() {
  state.calendar.push({id:uid(),title:'New Reel',style:'custom',brand:'ll',status:'draft',date:new Date().toISOString().split('T')[0]});
  saveState(); renderCalendar();
}

function markPosted(id) {
  const item=state.calendar.find(c=>c.id===id);
  if(item){item.status='posted';saveState();renderCalendar();notify('Marked posted');}
}

function deleteCalItem(id) {
  state.calendar=state.calendar.filter(c=>c.id!==id);
  saveState();renderCalendar();
}

function loadCalItem(id) {
  const item=state.calendar.find(c=>c.id===id);
  if(!item) return;
  document.getElementById('brand').value=item.brand||'ll';
  document.getElementById('style').value=item.style||'custom';
  document.getElementById('post-title').value=item.title||'';
  document.getElementById('post-date').value=item.date||'';
  if(item.post&&item.post.frames){
    state.frames=item.post.frames.map(f=>({...f,id:uid()}));
    renderFrames(); updatePreview();
  } else loadTemplate();
  switchTab('build'); notify('Loaded');
}

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function loadTemplate() {
  const style = document.getElementById('style').value;
  const tmpl  = TEMPLATES[style] || TEMPLATES.custom;
  state.frames = tmpl.map(f=>({...f,id:uid()}));
  renderFrames(); updatePreview();
}

function onStyleChange() { loadTemplate(); }
function onBrandChange() { updatePreview(); refreshReelTags(); }

function clearBuilder() {
  state.frames=[];
  document.getElementById('post-title').value='';
  document.getElementById('caption-text').value='';
  addFrame(); addFrame(); addFrame();
}

function fmtDate(s) {
  if(!s) return '';
  const d=new Date(s+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short'});
}

function notify(msg) {
  const el=document.getElementById('notif');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2400);
}

function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  const tabs=['build','queue','caption','bank','cadence','calendar'];
  const idx=tabs.indexOf(tab);
  document.querySelectorAll('.tab-btn')[idx]?.classList.add('active');
  if(tab==='caption'){updateFrameScript();refreshReelTags();}
  if(tab==='queue'){renderReelQueueGrid();renderReelArchiveStrip();}
  if(tab==='bank')renderBank();
  if(tab==='cadence')renderCadence();
  if(tab==='calendar')renderCalendar();
}

// ══════════════════════════════════════════
// REEL QUEUE SYSTEM
// ══════════════════════════════════════════
const REEL_QUEUE_KEY   = 'll_reel_queue';
const REEL_ARCHIVE_KEY = 'll_reel_archive';
const REEL_JSON_KEY    = 'll_reel_json_store';
let reelQueue = [];

function getRealArchive() { try{return JSON.parse(localStorage.getItem(REEL_ARCHIVE_KEY))||[];}catch{return[];} }
function saveReelArchive(a) { try{localStorage.setItem(REEL_ARCHIVE_KEY,JSON.stringify(a));}catch{} }
function getReelJsonStore() { try{return JSON.parse(localStorage.getItem(REEL_JSON_KEY))||{};}catch{return{};} }
function saveReelJsonStore(s) { try{localStorage.setItem(REEL_JSON_KEY,JSON.stringify(s));}catch{} }

function importReelJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.reels || !Array.isArray(data.reels)) { notify('No reels array in JSON'); return; }
      // Merge any inline templates
      if (data.templates) Object.assign(TEMPLATES, data.templates);
      // Build queue in memory
      reelQueue = data.reels.map((item, i) => ({
        id: i,
        day:      item.day      || '',
        slot:     item.slot     || '12PM',
        style:    item.style    || 'custom',
        brand:    item.brand    || 'll',
        pillar:   item.pillar   || 'general',
        title:    item.title    || '',
        caption:  item.caption  || '',
        frames:   item.frames   ? item.frames.map(f=>({...f,id:uid()})) : null,
        weekLabel: data.weekLabel || '',
        done: false, built: false
      }));
      // Store for next-week recall
      try {
        const lbl = data.weekLabel || `ReelWeek_${Date.now()}`;
        const store = getReelJsonStore(); store[lbl] = e.target.result;
        saveReelJsonStore(store);
      } catch(err) {}
      renderReelQueueGrid();
      renderReelArchiveStrip();
      notify(`✓ ${reelQueue.length} reels loaded`);
      switchTab('queue');
      setTimeout(()=>loadReelQueueItem(0), 50);
    } catch(err) { notify('JSON error: ' + err.message); }
    event.target.value = '';
  };
  reader.readAsText(file, 'utf-8');
}

function loadNextReelWeek() {
  const store = getReelJsonStore();
  const used  = new Set(getRealArchive().map(a=>a.label));
  const next  = Object.keys(store).find(l=>!used.has(l));
  if (!next) { notify('No unused reel weeks — import a JSON'); return; }
  try {
    const data = JSON.parse(store[next]);
    if (data.templates) Object.assign(TEMPLATES, data.templates);
    reelQueue = data.reels.map((item,i)=>({
      id:i, day:item.day||'', slot:item.slot||'12PM', style:item.style||'custom',
      brand:item.brand||'ll', pillar:item.pillar||'general', title:item.title||'',
      caption:item.caption||'', frames:item.frames?item.frames.map(f=>({...f,id:uid()})):null,
      weekLabel:data.weekLabel||'', done:false, built:false
    }));
    renderReelQueueGrid(); renderReelArchiveStrip();
    notify(`✓ ${next} loaded`);
    switchTab('queue');
    setTimeout(()=>loadReelQueueItem(0), 50);
  } catch(err) { notify('Failed to load stored week'); }
}

function loadReelQueueItem(idx) {
  if (idx < 0 || idx >= reelQueue.length) return;
  const item = reelQueue[idx];

  // Highlight row
  document.querySelectorAll('.rq-item').forEach(el=>el.classList.remove('active'));
  const row = document.getElementById(`rqi-${idx}`);
  if (row) row.classList.add('active');

  // Load into builder
  document.getElementById('brand').value  = item.brand  || 'll';
  document.getElementById('style').value  = item.style  || 'custom';
  document.getElementById('pillar').value = item.pillar || 'general';
  document.getElementById('post-title').value = item.title || '';

  if (item.caption) document.getElementById('caption-text').value = item.caption;

  // Load frames — use item frames if present, else load template
  if (item.frames && item.frames.length) {
    state.frames = item.frames.map(f=>({...f,id:uid()}));
  } else {
    const tmpl = TEMPLATES[item.style] || TEMPLATES.custom;
    state.frames = tmpl.map(f=>({...f,id:uid()}));
  }
  renderFrames(); updatePreview();

  // Refresh tags
  _currentReelTags = buildReelTags(item.brand||'ll', item.pillar||'general', false);
  renderReelTags();

  window._activeReelIdx = idx;

  // Update preview strip
  const strip = document.getElementById('reel-queue-preview');
  strip.style.display = '';
  document.getElementById('rqp-label').textContent = `${item.day} ${item.slot} — ${item.style} (${idx+1}/${reelQueue.length})`;
  document.getElementById('rqp-title').textContent = item.title || item.style;
  const framePreview = (item.frames||TEMPLATES[item.style]||[]).slice(0,3).map(f=>f.text||'').filter(Boolean).join(' / ');
  document.getElementById('rqp-frames').textContent = framePreview ? framePreview.substring(0,80) : 'Template frames loaded';
}

function renderReelQueueGrid() {
  const grid  = document.getElementById('reel-queue-grid');
  const title = document.getElementById('queue-title');
  const meta  = document.getElementById('queue-meta');
  if (!reelQueue.length) {
    grid.innerHTML = '<div style="font-family:Georgia,serif;font-size:11px;color:#3A3028;font-style:italic;padding:12px 0;text-align:center;">Import a Week JSON to load reel queue.</div>';
    title.textContent = 'Reel Queue'; meta.textContent = ''; return;
  }
  const done  = reelQueue.filter(q=>q.done).length;
  const built = reelQueue.filter(q=>q.built).length;
  const wl    = reelQueue[0]?.weekLabel ? ` — ${reelQueue[0].weekLabel}` : '';
  title.textContent = `${reelQueue.length}-Reel Queue${wl}`;
  meta.textContent  = `${done}/${reelQueue.length} done · ${built} built`;
  grid.innerHTML = reelQueue.map((item,i) => {
    const badges = [];
    if (item.built) badges.push('<span style="font-family:system-ui;font-size:7px;letter-spacing:0.1em;text-transform:uppercase;padding:2px 5px;border-radius:2px;background:#1A3A2A;color:#4A9A6A;">HTML</span>');
    else if (item.done) badges.push('<span style="font-family:system-ui;font-size:7px;letter-spacing:0.1em;text-transform:uppercase;padding:2px 5px;border-radius:2px;background:#1A2A1A;color:#4A8A4A;">Done</span>');
    return `<div class="rq-item" id="rqi-${i}" onclick="loadReelQueueItem(${i})" style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#0E0C08;border:1px solid #1A1510;border-radius:3px;cursor:pointer;margin-bottom:4px;${item.done?'opacity:0.4;':''}">
      <span style="font-family:system-ui;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;color:#555;min-width:28px;">${item.day}</span>
      <span style="font-family:system-ui;font-size:7px;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A3A;min-width:32px;">${item.slot}</span>
      <span style="font-family:system-ui;font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:var(--bronze);min-width:80px;">${item.style}</span>
      <span style="font-family:Georgia,serif;font-size:10px;color:#6A5840;font-style:italic;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.title||item.style}</span>
      ${badges.join('')}
    </div>`;
  }).join('');
  // Add active style
  const style = document.createElement('style');
  style.textContent = '.rq-item.active{border-color:var(--bronze)!important;background:#141008!important;}';
  document.head.appendChild(style);
}

function renderReelArchiveStrip() {
  const a = getRealArchive();
  const strip = document.getElementById('reel-archive-strip');
  const list  = document.getElementById('reel-archive-list');
  if (!a.length) { strip.style.display='none'; return; }
  strip.style.display = '';
  list.innerHTML = [...a].reverse().map(e=>{
    const d = new Date(e.archivedAt).toLocaleDateString([],{month:'short',day:'numeric'});
    return `<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;background:#0E0C08;border:1px solid #1E1810;border-radius:2px;font-family:system-ui;">
      <span style="font-size:8px;letter-spacing:.12em;color:var(--bronze);min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.label}</span>
      <span style="font-size:7px;color:#3A3028;flex:1;">${e.count} reels · ${e.built} built</span>
      <span style="font-size:7px;color:#2A2218;">${d}</span>
    </div>`;
  }).join('');
}

function archiveReelWeek() {
  if (!reelQueue.length) return;
  const label   = reelQueue[0]?.weekLabel || `ReelWeek_${Date.now()}`;
  const archive = getRealArchive();
  if (archive.find(a=>a.label===label)) { notify(`"${label}" already archived`); return; }
  archive.push({ label, archivedAt:new Date().toISOString(), count:reelQueue.length, built:reelQueue.filter(q=>q.built).length });
  saveReelArchive(archive);
  reelQueue = [];
  renderReelQueueGrid(); renderReelArchiveStrip();
  document.getElementById('reel-queue-preview').style.display = 'none';
  notify(`"${label}" archived`);
}

function buildCurrentQueueReel() {
  const idx = window._activeReelIdx;
  if (idx===undefined || !reelQueue[idx]) { notify('No reel selected'); return; }
  buildAndDownload();
  reelQueue[idx].built = true;
  reelQueue[idx].done  = true;
  renderReelQueueGrid();
  // Auto-advance to next
  if (idx < reelQueue.length-1) setTimeout(()=>loadReelQueueItem(idx+1), 400);
}

function prevReelItem() { const i=window._activeReelIdx||0; if(i>0)loadReelQueueItem(i-1); }
function nextReelItem() { const i=window._activeReelIdx||0; if(i<reelQueue.length-1)loadReelQueueItem(i+1); }

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
loadState();
document.getElementById('post-date').value = new Date().toISOString().split('T')[0];
loadTemplate();
renderReelTags();
</script>
