<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIE Exam Prep — Question Bank</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f1e35;--navy2:#162640;--navy3:#1e3254;
  --gold:#c9a84c;--gold2:#e8c96a;--cream:#f5f0e8;
  --ink:#1a2840;--muted:#8899bb;
  --green:#2ecc71;--red:#e74c3c;
  --radius:10px;
}
body{background:var(--navy);color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;}

/* ── HEADER ── */
header{background:var(--navy2);border-bottom:2px solid var(--gold);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo{font-family:'DM Serif Display',serif;font-size:1.35rem;color:var(--gold);letter-spacing:.02em;}
.logo span{color:var(--cream);}
.scoreboard{display:flex;gap:18px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.score-cell{text-align:center;}
.score-num{font-family:'DM Mono',monospace;font-size:1.3rem;font-weight:500;color:var(--gold2);}
.score-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}

/* ── PROGRESS BAR ── */
.prog-bar-wrap{background:var(--navy2);padding:6px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--navy3);}
.prog-bar{flex:1;height:6px;background:var(--navy3);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width .4s ease;}
.prog-pct{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);min-width:56px;text-align:right;}
.hist-dots{display:flex;gap:4px;align-items:center;}
.h-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.h-dot.w{background:var(--red);}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;min-height:0;}

/* ── SIDEBAR ── */
.sidebar{width:220px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--navy3);padding:20px 0;display:flex;flex-direction:column;gap:4px;}
.sidebar-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:0 18px 8px;}
.topic-btn{display:flex;flex-direction:column;padding:10px 18px;cursor:pointer;border:none;background:none;color:var(--cream);font-family:'DM Sans',sans-serif;font-size:.85rem;text-align:left;border-left:3px solid transparent;transition:all .15s;}
.topic-btn:hover{background:var(--navy3);color:var(--gold2);}
.topic-btn.active{border-left-color:var(--gold);background:var(--navy3);color:var(--gold);}
.topic-stat{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);margin-top:2px;}
.topic-btn.active .topic-stat{color:var(--gold);}
.sidebar-div{height:1px;background:var(--navy3);margin:10px 18px;}

/* ── MAIN ── */
.main{flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:20px;min-width:0;}

/* ── CONTROLS ── */
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.chip{background:var(--navy3);border:1px solid var(--navy3);border-radius:20px;padding:4px 12px;font-size:.75rem;color:var(--muted);font-family:'DM Mono',monospace;}
.chip.topic-chip{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08);}
select{background:var(--navy3);border:1px solid var(--navy3);border-radius:var(--radius);color:var(--cream);font-family:'DM Sans',sans-serif;font-size:.85rem;padding:6px 10px;cursor:pointer;outline:none;}
select:focus{border-color:var(--gold);}
.btn-primary{background:var(--gold);color:var(--navy);font-family:'DM Sans',sans-serif;font-weight:600;font-size:.9rem;padding:9px 22px;border:none;border-radius:var(--radius);cursor:pointer;transition:background .15s;}
.btn-primary:hover{background:var(--gold2);}
.btn-next{background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:.9rem;padding:9px 22px;border-radius:var(--radius);cursor:pointer;transition:all .15s;display:none;}
.btn-next:hover{background:rgba(201,168,76,.12);}

/* ── STATE CARD (welcome/empty) ── */
.state-card{background:var(--navy2);border:1px solid var(--navy3);border-radius:var(--radius);padding:48px 36px;text-align:center;max-width:520px;margin:0 auto;}
.state-card .icon{font-size:2.8rem;margin-bottom:16px;}
.state-card h2{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--cream);margin-bottom:10px;}
.state-card p{color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:24px;}
.state-card .btn-primary{margin-top:0;}

/* ── QUESTION CARD ── */
.q-card{background:var(--navy2);border:1px solid var(--navy3);border-radius:var(--radius);overflow:hidden;}
.q-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--navy3);background:rgba(255,255,255,.02);}
.q-num{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);}
.q-tag{font-size:.72rem;background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.25);border-radius:20px;padding:3px 10px;font-family:'DM Mono',monospace;}
.q-body{padding:24px 20px;display:flex;flex-direction:column;gap:18px;overflow:hidden;}
.q-text{font-family:'DM Serif Display',serif;font-size:1.1rem;line-height:1.55;color:var(--cream);}
.options{display:flex;flex-direction:column;gap:10px;width:100%;}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--navy3);border-radius:var(--radius);cursor:pointer;transition:all .15s;width:100%;overflow:hidden;box-sizing:border-box;}
.opt:hover:not(.locked){border-color:var(--gold);background:rgba(201,168,76,.06);}
.opt.locked{cursor:default;}
.opt.correct{border-color:var(--green);background:rgba(46,204,113,.08);}
.opt.wrong{border-color:var(--red);background:rgba(231,76,60,.08);}
.opt-letter{font-family:'DM Mono',monospace;font-size:.8rem;font-weight:500;color:var(--gold);background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);border-radius:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.opt.correct .opt-letter{color:var(--green);background:rgba(46,204,113,.15);border-color:rgba(46,204,113,.3);}
.opt.wrong .opt-letter{color:var(--red);background:rgba(231,76,60,.15);border-color:rgba(231,76,60,.3);}
.opt-text{flex:1;min-width:0;word-wrap:break-word;overflow-wrap:break-word;font-size:.9rem;line-height:1.45;color:var(--cream);}
.explanation{display:none;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:var(--radius);padding:14px 16px;font-size:.875rem;line-height:1.6;color:var(--cream);}
.explanation.show{display:block;}
.explanation strong{color:var(--gold);}
.q-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--navy3);}
.result-badge{font-size:.8rem;font-weight:600;font-family:'DM Mono',monospace;padding:4px 10px;border-radius:20px;}
.badge-correct{color:var(--green);background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.25);}
.badge-wrong{color:var(--red);background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.25);}
.foot-hint{font-size:.75rem;color:var(--muted);}

@media(max-width:700px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;padding:10px;border-right:none;border-bottom:1px solid var(--navy3);}
  .topic-btn{border-left:none;border-bottom:3px solid transparent;padding:8px 12px;}
  .topic-btn.active{border-bottom-color:var(--gold);border-left-color:transparent;}
  .main{padding:16px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">SIE <span>Exam Prep</span></div>
  <div class="scoreboard">
    <div class="score-cell"><div class="score-num" id="s-correct">0</div><div class="score-label">Correct</div></div>
    <div class="score-cell"><div class="score-num" id="s-total">0</div><div class="score-label">Asked</div></div>
    <div class="score-cell"><div class="score-num" id="s-pct">—</div><div class="score-label">Score</div></div>
  </div>
</header>

<div class="prog-bar-wrap">
  <div class="hist-dots" id="hist-dots"></div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="prog-pct" id="prog-pct">—</div>
</div>

<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-label">Section</div>
    <button class="topic-btn active" data-topic="capital">Capital Markets<div class="topic-stat" id="ts-capital">0 / 0 correct</div></button>
    <button class="topic-btn" data-topic="products">Products &amp; Risks<div class="topic-stat" id="ts-products">0 / 0 correct</div></button>
    <button class="topic-btn" data-topic="trading">Trading &amp; Accounts<div class="topic-stat" id="ts-trading">0 / 0 correct</div></button>
    <button class="topic-btn" data-topic="regulatory">Regulatory<div class="topic-stat" id="ts-regulatory">0 / 0 correct</div></button>
    <div class="sidebar-div"></div>
    <button class="topic-btn" data-topic="all">Mix — All Topics<div class="topic-stat" id="ts-all">0 / 0 correct</div></button>
  </nav>

  <main class="main">
    <div class="controls">
      <span class="chip topic-chip" id="topic-chip">Capital Markets</span>
      <select id="diff" onchange="onDiffChange()">
        <option value="all">All Difficulties</option>
        <option value="easy">Foundational</option>
        <option value="medium">Intermediate</option>
        <option value="hard">Advanced</option>
      </select>
      <span class="chip" id="pool-chip">— in pool</span>
      <button class="btn-primary" id="btn-gen" onclick="nextQuestion()">Generate Question</button>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div id="q-area">
      <div class="state-card">
        <div class="icon">📋</div>
        <h2>Ready when you are</h2>
        <p>Select a section, choose your difficulty, then hit <strong>Generate Question</strong> to begin drilling.</p>
        <button class="btn-primary" onclick="nextQuestion()">▶ Start Drilling</button>
      </div>
    </div>
  </main>
</div>

<script>
const BANK={
capital:[
{d:"easy",sub:"Market Structure",q:"Which market is where new securities are first sold to the public?",opts:{A:"Secondary market",B:"Primary market",C:"Third market",D:"OTC bulletin board"},ans:"B",exp:"The primary market is where issuers sell newly created securities directly to investors, raising capital. All subsequent trading among investors happens in the secondary market."},
{d:"easy",sub:"Market Structure",q:"An investor purchases 100 shares of IBM on the NYSE from another investor. This occurs in which market?",opts:{A:"Primary market",B:"Fourth market",C:"Secondary market",D:"Initial offering market"},ans:"C",exp:"The secondary market is where previously issued securities are bought and sold among investors. The NYSE and Nasdaq are secondary markets; no new capital is raised by the company."},
{d:"easy",sub:"Market Participants",q:"A broker-dealer acting as a 'dealer' means it is:",opts:{A:"Executing orders for a commission on behalf of customers",B:"Trading for its own account as a principal",C:"Managing customer discretionary accounts",D:"Underwriting new securities offerings"},ans:"B",exp:"When acting as a dealer (principal), the firm buys and sells securities from its own inventory, earning a profit on the markup or markdown rather than a commission."},
{d:"easy",sub:"Market Participants",q:"Which best describes an underwriter in a securities offering?",opts:{A:"A firm that manages customer accounts",B:"A firm that buys securities from the issuer and resells them to the public",C:"A regulator that approves new securities",D:"An investor who purchases in the primary market"},ans:"B",exp:"An underwriter (investment bank) purchases new securities from the issuer and distributes them to the public. In a firm-commitment underwriting, the underwriter takes on the full risk of the offering."},
{d:"easy",sub:"Market Participants",q:"What is a market maker?",opts:{A:"A regulator who sets market prices",B:"A dealer that continuously quotes bid and ask prices and stands ready to buy or sell a security",C:"An investor who purchases large blocks of stock",D:"A government official who sets interest rates"},ans:"B",exp:"Market makers provide liquidity by continuously quoting bid (buy) and ask (sell) prices for securities and standing ready to trade at those prices from their own inventory."},
{d:"easy",sub:"Market Structure",q:"The bid-ask spread represents:",opts:{A:"The range of prices over a trading day",B:"The dealer's compensation for providing liquidity",C:"The commission charged by a broker",D:"The annual return on a security"},ans:"B",exp:"The bid-ask spread is the difference between the price a dealer will pay (bid) and the price they will sell (ask). It represents the dealer's compensation for providing liquidity and taking on inventory risk."},
{d:"easy",sub:"Economic Indicators",q:"GDP measures which of the following?",opts:{A:"Total value of a nation's stock market",B:"Total market value of all final goods and services produced in a country in a given period",C:"The inflation-adjusted return on government bonds",D:"The unemployment rate relative to population"},ans:"B",exp:"GDP measures the total monetary value of all final goods and services produced within a country's borders during a specific period. It is the primary measure of an economy's size and health."},
{d:"easy",sub:"Economic Indicators",q:"The Consumer Price Index (CPI) primarily measures:",opts:{A:"Changes in the prices paid by producers for raw materials",B:"Changes in the prices paid by urban consumers for a basket of goods and services",C:"The total output of the manufacturing sector",D:"Changes in corporate earnings over time"},ans:"B",exp:"CPI tracks the average change in prices paid by urban consumers for a fixed basket of goods and services and is the most widely used measure of consumer inflation."},
{d:"easy",sub:"Economic Indicators",q:"Which is a lagging economic indicator?",opts:{A:"Stock prices",B:"Building permits",C:"Unemployment rate",D:"New manufacturing orders"},ans:"C",exp:"The unemployment rate is a lagging indicator that confirms economic trends after they occur. Businesses lay off workers after a recession begins and hire after recovery is underway. Stock prices and building permits are leading indicators."},
{d:"easy",sub:"Federal Reserve",q:"The Federal Reserve's primary tool for monetary policy is:",opts:{A:"Setting income tax rates",B:"Open market operations—buying and selling government securities",C:"Issuing new currency",D:"Setting the prime rate directly"},ans:"B",exp:"Open market operations (OMO) is the Fed's primary and most flexible monetary policy tool. Buying securities injects money into the banking system; selling removes it."},
{d:"easy",sub:"Federal Reserve",q:"The discount rate is best described as:",opts:{A:"The rate banks charge their most creditworthy customers",B:"The interest rate the Federal Reserve charges member banks for short-term loans",C:"The rate on 90-day Treasury bills",D:"The target rate for overnight bank lending"},ans:"B",exp:"The discount rate is the interest rate the Fed charges banks that borrow directly from the Fed's discount window. It is typically set above the federal funds rate to encourage banks to borrow from each other first."},
{d:"easy",sub:"Federal Reserve",q:"When the Fed lowers the federal funds rate target, this is:",opts:{A:"Contractionary monetary policy",B:"Expansionary monetary policy",C:"Fiscal policy",D:"Neutral monetary policy"},ans:"B",exp:"Lowering the federal funds rate is expansionary monetary policy. Lower rates encourage borrowing, spending, and investment, stimulating economic growth. Raising rates is contractionary, intended to slow growth and reduce inflation."},
{d:"easy",sub:"Money Markets",q:"Which of the following is a money market instrument?",opts:{A:"30-year Treasury bond",B:"Corporate common stock",C:"90-day Treasury bill",D:"Municipal revenue bond"},ans:"C",exp:"Money market instruments are short-term (one year or less) debt instruments. T-bills with maturities up to 52 weeks are classic money market instruments. Treasury bonds, stocks, and long-term bonds are capital market instruments."},
{d:"easy",sub:"Money Markets",q:"Commercial paper is best described as:",opts:{A:"A secured bond issued by a corporation",B:"An unsecured short-term promissory note issued by highly rated corporations",C:"A government-backed short-term obligation",D:"A type of municipal money market instrument"},ans:"B",exp:"Commercial paper is an unsecured short-term promissory note (typically 1-270 days) issued by corporations with high credit ratings to fund short-term liabilities. It is sold at a discount to face value."},
{d:"easy",sub:"International",q:"When the U.S. dollar weakens relative to other currencies, what typically happens to U.S. exports?",opts:{A:"They become more expensive for foreign buyers",B:"They become cheaper for foreign buyers, potentially increasing demand",C:"They are unaffected by the currency change",D:"Demand falls because Americans have less purchasing power"},ans:"B",exp:"A weaker dollar means foreign buyers spend less of their own currency to buy U.S. goods. This makes U.S. exports more price-competitive abroad, which can increase export demand."},
{d:"medium",sub:"Market Structure",q:"In a 'firm commitment' underwriting, the underwriter:",opts:{A:"Sells as many shares as possible and returns unsold shares to the issuer",B:"Guarantees the sale of the entire issue by purchasing all shares from the issuer",C:"Acts only as an agent and charges a flat fee",D:"Sells shares only to institutional investors"},ans:"B",exp:"In a firm commitment underwriting, the underwriter purchases the entire offering from the issuer at a negotiated price and assumes full risk for distributing the shares. If shares remain unsold, the underwriter bears the loss."},
{d:"medium",sub:"Market Structure",q:"A 'best efforts' underwriting means the underwriter will:",opts:{A:"Guarantee the sale of all shares in the offering",B:"Purchase unsold shares at a discount",C:"Sell as many shares as possible but not guarantee the full amount",D:"Only underwrite investment-grade securities"},ans:"C",exp:"In a best efforts arrangement, the underwriter acts as an agent and sells as many shares as possible but does not commit to buying unsold shares. The issuer bears the risk of an incomplete offering."},
{d:"medium",sub:"Market Structure",q:"The 'fourth market' refers to trading of:",opts:{A:"Foreign securities in U.S. markets",B:"Securities directly between institutional investors without using a broker-dealer",C:"Exchange-listed securities on OTC markets",D:"Government bonds between the Fed and banks"},ans:"B",exp:"The fourth market is direct trading of securities between large institutional investors, bypassing broker-dealers entirely. This allows institutions to avoid brokerage commissions on large block trades."},
{d:"medium",sub:"Monetary Policy",q:"Quantitative easing (QE) primarily involves the Federal Reserve:",opts:{A:"Raising the discount rate to attract foreign capital",B:"Purchasing longer-term securities to inject reserves and lower long-term interest rates",C:"Reducing the money supply by selling Treasury bonds",D:"Mandating banks increase their lending to businesses"},ans:"B",exp:"QE involves the Fed purchasing longer-term securities (Treasuries, MBS) when short-term rates are near zero. Buying these assets increases bank reserves and puts downward pressure on long-term rates, encouraging lending and investment."},
{d:"medium",sub:"Monetary Policy",q:"If the Federal Reserve sells Treasury securities, the effect on the money supply is:",opts:{A:"The money supply expands because banks have more securities",B:"The money supply contracts because banks pay the Fed, reducing their reserves",C:"The money supply is unchanged",D:"The money supply expands because the Treasury receives more cash"},ans:"B",exp:"When the Fed sells securities, banks pay with reserves held at the Fed, reducing bank reserves and limiting their ability to create loans. This contracts the money supply and is a contractionary policy."},
{d:"medium",sub:"Yield Curve",q:"An inverted yield curve occurs when:",opts:{A:"Short-term rates are higher than long-term rates",B:"Long-term rates are higher than short-term rates",C:"All maturities have the same yield",D:"The yield curve shifts upward uniformly"},ans:"A",exp:"An inverted yield curve occurs when short-term rates exceed long-term rates. It is historically a reliable recession predictor, as it signals expectations of future rate cuts and economic slowdown."},
{d:"medium",sub:"Money Markets",q:"A repurchase agreement (repo) involves:",opts:{A:"A company buying back its own stock",B:"An investor selling securities with an agreement to repurchase them at a specified price on a later date",C:"A broker repurchasing securities from a defaulted account",D:"The Federal Reserve repurchasing mortgage-backed securities"},ans:"B",exp:"In a repo, the seller agrees to repurchase the securities at a set price and date. The buyer effectively makes a short-term loan. Repos are widely used in money markets and by the Fed in open market operations."},
{d:"medium",sub:"International",q:"American Depositary Receipts (ADRs) allow U.S. investors to:",opts:{A:"Buy shares in U.S. companies listed on foreign exchanges",B:"Invest in foreign companies by purchasing U.S.-listed certificates representing foreign shares",C:"Convert foreign currency into U.S. dollars at favorable rates",D:"Purchase U.S. Treasury bonds denominated in foreign currencies"},ans:"B",exp:"ADRs are U.S.-listed certificates issued by a U.S. bank representing ownership of shares in a foreign company. They trade in U.S. dollars on U.S. exchanges, allowing U.S. investors to gain foreign exposure without dealing with foreign exchanges or currencies."},
{d:"medium",sub:"Economic Indicators",q:"Which is a coincident economic indicator?",opts:{A:"Stock market prices",B:"Money supply (M2)",C:"Personal income levels",D:"Average prime rate charged by banks"},ans:"C",exp:"Coincident indicators move at the same time as the economy. Personal income, industrial production, and non-farm payroll employment are coincident indicators. Stock prices are leading; the prime rate is lagging."},
{d:"hard",sub:"Market Structure",q:"In a Dutch auction for Treasury securities, how is the price determined?",opts:{A:"All successful bidders pay their own bid price",B:"All successful bidders pay the stop-out rate (highest yield) that clears the entire offering",C:"The Treasury sets a fixed price before the auction",D:"The highest bidder wins all the securities"},ans:"B",exp:"In a Treasury Dutch auction, bidders submit competitive bids specifying a yield and quantity. The stop-out rate (highest yield at which all securities are sold) becomes the yield for all successful bidders. This is a uniform-price auction."},
{d:"hard",sub:"Monetary Policy",q:"The FOMC meets approximately how many times per year?",opts:{A:"2",B:"4",C:"8",D:"12"},ans:"C",exp:"The FOMC meets eight times per year (roughly every six weeks) to assess economic conditions and set the target federal funds rate. Emergency unscheduled meetings can also occur."},
{d:"hard",sub:"Federal Reserve",q:"Which correctly describes the relationship between the federal funds rate and the discount rate?",opts:{A:"The federal funds rate is always higher than the discount rate",B:"The discount rate is typically set above the federal funds rate to discourage routine borrowing from the Fed",C:"Both rates are set at identical levels by the FOMC",D:"The discount rate applies to overnight lending; the federal funds rate applies to longer-term loans"},ans:"B",exp:"The discount rate is set above the federal funds rate to discourage banks from routinely using the discount window as cheap funding. The federal funds rate is for overnight interbank lending; the discount window is a backup for banks with temporary liquidity needs."},
{d:"hard",sub:"Yield Curve",q:"A normal yield curve slopes upward because:",opts:{A:"Short-term bonds have more credit risk",B:"Investors require higher compensation for longer maturities due to greater uncertainty and inflation risk",C:"The government sets higher rates for shorter maturities",D:"Liquidity is greater for long-term securities"},ans:"B",exp:"Longer-term bonds carry greater uncertainty about future inflation and interest rates. Investors demand a term premium to compensate for tying up capital longer, producing the typical upward slope."},
{d:"hard",sub:"International",q:"Purchasing Power Parity (PPP) theory suggests that in the long run:",opts:{A:"Interest rates equalize across countries",B:"Exchange rates adjust so identical goods cost the same in different countries in a common currency",C:"Trade deficits are self-correcting through inflation",D:"Capital flows freely toward the highest interest rate countries"},ans:"B",exp:"PPP holds that in the long run, exchange rates adjust to equalize the price of identical goods across countries when measured in the same currency. The Big Mac Index is a popular informal measure of PPP."},
{d:"easy",sub:"Market Structure",q:"Which of the following best describes the Over-the-Counter (OTC) market?",opts:{A:"A physical trading floor with specialists managing order flow",B:"A decentralized network where securities trade through dealer networks rather than a centralized exchange",C:"A market exclusively for government bond trading",D:"A market where only institutional investors may participate"},ans:"B",exp:"The OTC market is a decentralized, dealer-based market where transactions occur directly between parties via computer networks and phone rather than on a centralized exchange. Nasdaq is the largest OTC equity market."},
{d:"easy",sub:"Economic Indicators",q:"Which of the following is considered a leading economic indicator?",opts:{A:"Average duration of unemployment",B:"Consumer Price Index",C:"Building permits for new private housing",D:"Bank prime lending rate"},ans:"C",exp:"Building permits are a leading indicator because construction decisions are made before actual economic activity begins. Leading indicators (stock prices, manufacturing orders, building permits) predict future economic changes."},
{d:"easy",sub:"Money Supply",q:"M2 money supply includes M1 plus:",opts:{A:"Long-term certificates of deposit and mutual fund shares",B:"Savings deposits, small time deposits, and money market fund balances",C:"Corporate bonds and large negotiable CDs",D:"Federal Reserve notes only"},ans:"B",exp:"M2 = M1 (currency + demand deposits) plus savings deposits, small time deposits (under $100,000), and retail money market mutual fund balances. M2 is a broader measure of money supply than M1."},
{d:"easy",sub:"Capital Markets",q:"A 'tombstone' advertisement in securities is:",opts:{A:"An obituary announcement that a company is closing",B:"A formal notice published after a securities offering is complete, listing the issuer and underwriters",C:"A warning advertisement about risky investments",D:"An SEC notice of enforcement action"},ans:"B",exp:"A tombstone is a formal announcement published in financial media after an offering closes. It identifies the issuer, the security, the offering size, and the underwriting syndicate members. It is not a solicitation; the offering is already complete."},
{d:"medium",sub:"Market Structure",q:"A 'shelf registration' (Rule 415) allows an issuer to:",opts:{A:"Register securities and sell them immediately in small tranches over up to three years",B:"Register securities without providing any prospectus to investors",C:"Bypass the SEC registration requirement entirely",D:"Register securities exclusively for private placements"},ans:"A",exp:"Shelf registration (Rule 415) allows a company to register a large block of securities and then sell them in smaller tranches over time (up to 3 years) as market conditions favor. This gives issuers flexibility to access capital markets quickly without a new registration each time."},
{d:"medium",sub:"Economic Indicators",q:"The 'output gap' refers to:",opts:{A:"The difference between a country's exports and imports",B:"The difference between actual GDP and potential GDP",C:"The gap between inflation and interest rates",D:"The difference between public and private sector employment"},ans:"B",exp:"The output gap measures the difference between what an economy is actually producing (actual GDP) and what it could produce at full capacity (potential GDP). A negative output gap (recession) means slack in the economy; a positive gap may indicate inflationary pressure."},
{d:"medium",sub:"Federal Reserve",q:"The Federal Reserve's 'dual mandate' is to pursue:",opts:{A:"Price stability and maximum economic growth",B:"Maximum employment and stable prices",C:"Low interest rates and strong dollar",D:"Balanced federal budget and trade surplus"},ans:"B",exp:"The Federal Reserve Act gives the Fed a dual mandate: to promote maximum employment and stable prices (low, stable inflation). These goals sometimes conflict, requiring the Fed to balance both objectives in setting monetary policy."},
{d:"medium",sub:"Yield Curve",q:"When the yield curve is flat, investors typically:",opts:{A:"Expect significant long-term inflation",B:"Have little preference between short-term and long-term bonds in terms of yield compensation",C:"Prefer very long-term bonds exclusively",D:"Avoid bond markets entirely"},ans:"B",exp:"A flat yield curve offers similar yields across all maturities, eliminating the usual compensation for holding longer-term bonds. Investors may prefer shorter-term bonds to avoid duration risk for the same yield."},
{d:"medium",sub:"Market Participants",q:"The 'book-running manager' in an IPO syndicate is:",opts:{A:"The company's chief financial officer",B:"The lead underwriter responsible for managing the order book and allocating shares",C:"The SEC official reviewing the registration statement",D:"The transfer agent maintaining ownership records"},ans:"B",exp:"The book-running manager (or bookrunner) is the lead investment bank in an IPO. It manages the order book (tracking investor demand), sets the offering price, and determines how shares are allocated among investors and other syndicate members."},
{d:"hard",sub:"Market Structure",q:"The 'free-riding' violation in a hot IPO context occurs when:",opts:{A:"An investor sells shares immediately after purchasing them at the IPO price",B:"A broker-dealer fails to make a bona fide public offering and instead withholds hot IPO shares for its own benefit",C:"Retail investors receive allocations before institutional investors",D:"An issuer does not distribute the prospectus before closing the offering"},ans:"B",exp:"Free-riding in the IPO context (under FINRA rules) occurs when a broker-dealer withholds shares of a hot IPO from bona fide public customers and instead allocates them to insiders, employees, or the firm's own accounts to benefit from the anticipated aftermarket price increase."},
{d:"hard",sub:"Economic Indicators",q:"If the Federal Reserve is concerned about 'stagflation,' it faces a dilemma because:",opts:{A:"Fighting inflation by raising rates may worsen unemployment, while fighting unemployment by cutting rates may worsen inflation",B:"Stagflation only occurs in countries with fixed exchange rates",C:"The Fed cannot raise and lower rates simultaneously",D:"Stagflation is actually beneficial for most economic participants"},ans:"A",exp:"Stagflation (high inflation + high unemployment simultaneously, plus slow growth) creates a policy dilemma: the Fed's contractionary tools (raising rates) can reduce inflation but worsen unemployment, while expansionary tools (cutting rates) can reduce unemployment but worsen inflation. Standard monetary policy cannot easily solve both problems simultaneously."},
{d:"hard",sub:"Market Participants",q:"A 'primary dealer' in the U.S. government securities market is:",opts:{A:"Any broker-dealer registered with FINRA",B:"A financial institution authorized to deal directly with the Federal Reserve in open market operations",C:"An investment bank that only underwrites Treasury auctions",D:"A commercial bank that accepts deposits and makes loans"},ans:"B",exp:"Primary dealers are financial institutions designated by the New York Fed to trade directly with it in open market operations and to bid in Treasury auctions. They are required to make markets in Treasuries and to participate meaningfully in auctions. There are about 24 primary dealers."},

,
{"d":"medium","sub":"Market Structure","q":"Which of the following best describes a 'dark pool'?","opts":{"A":"An illegal trading venue operated offshore","B":"A private trading system where large orders are matched anonymously away from public exchanges","C":"A market for distressed securities","D":"A Federal Reserve lending facility"},"ans":"B","exp":"Dark pools are private alternative trading systems (ATSs) that allow institutional investors to trade large blocks without revealing orders to the public market before execution, reducing market impact. They are legal and regulated by the SEC."},
{"d":"medium","sub":"Market Structure","q":"The 'third market' refers to:","opts":{"A":"OTC trading of exchange-listed securities by non-member firms","B":"The primary issuance market for government bonds","C":"Direct institution-to-institution trades without a broker-dealer","D":"Futures trading in commodity markets"},"ans":"A","exp":"The third market is OTC trading of exchange-listed securities (like NYSE stocks) by non-member broker-dealers. It developed to allow large institutional trades outside exchange hours and away from exchange floors."},
{"d":"medium","sub":"Market Structure","q":"A 'Dutch auction' IPO sets the offering price by:","opts":{"A":"Negotiation between the issuer and lead underwriter only","B":"Collecting investor bids of price and quantity; the lowest price that sells all shares becomes the offering price","C":"Having the underwriter buy all shares regardless of demand","D":"SEC administrative determination"},"ans":"B","exp":"In a Dutch auction IPO, investors submit bids specifying price and quantity. The clearing price—the lowest price at which all shares can be sold—becomes the offering price for all investors. Google's 2004 IPO used this method."},
{"d":"medium","sub":"Economic Indicators","q":"The 'velocity of money' measures:","opts":{"A":"The speed at which banks process transactions","B":"How many times a unit of currency circulates through the economy in a given period","C":"The pace of GDP growth relative to inflation","D":"How quickly the Fed adjusts interest rates"},"ans":"B","exp":"Velocity of money (V = GDP/M) measures how frequently a dollar is spent. Low velocity during recessions reflects hoarding or saving; high velocity reflects active spending and lending."},
{"d":"medium","sub":"Yield Curve","q":"A normal (upward-sloping) yield curve exists because:","opts":{"A":"Short-term rates are always higher than long-term rates","B":"Investors demand higher yields for longer maturities to compensate for inflation risk and uncertainty","C":"The government pays more on short-term debt","D":"Corporations prefer issuing long-term bonds"},"ans":"B","exp":"A normal yield curve reflects liquidity preference theory: investors require a term premium for longer maturities to compensate for greater inflation risk, interest rate risk, and tying up capital for longer periods."},
{"d":"medium","sub":"Federal Reserve","q":"'Quantitative easing' (QE) refers to:","opts":{"A":"The Fed raising reserve requirements","B":"The Fed purchasing large quantities of longer-term securities to inject liquidity and push down long-term rates","C":"Congress increasing fiscal spending","D":"Banks lending excess reserves to each other"},"ans":"B","exp":"QE is a non-traditional monetary policy tool used when short-term rates are near zero. The Fed buys long-term Treasuries and mortgage-backed securities, injecting reserves and lowering long-term interest rates."},
{"d":"medium","sub":"International","q":"A 'currency peg' means a country:","opts":{"A":"Lets its currency float freely","B":"Fixes its currency's value to another currency or basket at a set exchange rate","C":"The IMF sets the country's exchange rate","D":"The country devalues its currency to boost exports"},"ans":"B","exp":"A currency peg (fixed exchange rate) means a central bank maintains its currency at a set rate against another currency by buying or selling foreign reserves. China has historically managed a soft peg to the dollar."},
{"d":"hard","sub":"Market Participants","q":"Under Regulation SHO, the 'locate' requirement means a broker-dealer must:","opts":{"A":"Identify the physical location of shares before any trade","B":"Have reasonable grounds to believe shares can be borrowed before accepting a short sale order","C":"Locate and purchase shares for delivery within one day","D":"Report all short positions to FINRA daily"},"ans":"B","exp":"Reg SHO's locate requirement mandates that before accepting or executing a short sale, the broker-dealer must locate (but not necessarily borrow) shares that can be delivered by settlement, preventing naked short selling."},
{"d":"hard","sub":"Market Structure","q":"In a 'best efforts' underwriting, unsold shares are:","opts":{"A":"Purchased by the lead underwriter","B":"Returned to the issuer; the underwriter has no obligation to sell everything","C":"Automatically placed with institutional investors","D":"Cancelled and re-offered at a lower price"},"ans":"B","exp":"In a best efforts underwriting, the underwriter acts as agent only and commits to making its best effort to sell the securities. Any unsold portion is returned to the issuer. The underwriter bears no financial risk for unsold shares."},
{"d":"hard","sub":"Federal Reserve","q":"Since March 2020, the Federal Reserve's reserve requirement for most institutions is:","opts":{"A":"10% of deposits","B":"5% of deposits","C":"Zero—reserve requirements have been eliminated","D":"Set individually by each Federal Reserve Bank"},"ans":"C","exp":"The Fed eliminated reserve requirements for all depository institutions in March 2020. The Fed now primarily uses interest on reserve balances (IORB) and open market operations as its primary monetary policy tools."},
{"d":"medium","sub":"Economic Indicators","q":"The 'output gap' refers to:","opts":{"A":"The difference between exports and imports","B":"The difference between actual GDP and potential GDP","C":"The gap between inflation and interest rates","D":"The difference between public and private sector employment"},"ans":"B","exp":"The output gap measures the difference between what an economy actually produces (actual GDP) and what it could produce at full capacity (potential GDP). A negative gap signals slack and recession risk; a positive gap signals inflationary pressure."},
{"d":"medium","sub":"Federal Reserve","q":"The Federal Reserve's 'dual mandate' directs it to pursue:","opts":{"A":"Price stability and maximum economic growth","B":"Maximum employment and stable prices","C":"Low interest rates and a strong dollar","D":"Balanced federal budget and trade surplus"},"ans":"B","exp":"The Federal Reserve Act gives the Fed two statutory objectives: promoting maximum employment and maintaining stable prices (low, stable inflation). These goals sometimes conflict, requiring the Fed to balance both in setting monetary policy."},
{"d":"medium","sub":"Yield Curve","q":"When the yield curve inverts, it typically signals:","opts":{"A":"Strong economic expansion ahead","B":"Potential recession, as short-term rates exceed long-term rates","C":"The Fed is cutting rates aggressively","D":"High inflation expectations"},"ans":"B","exp":"An inverted yield curve (short-term rates higher than long-term rates) has historically preceded recessions. It reflects expectations that the economy will slow and the Fed will eventually cut rates, making long-term bonds more attractive than short-term instruments."},
{"d":"easy","sub":"Market Structure","q":"Which of the following is a characteristic of OTC markets compared to exchange trading?","opts":{"A":"OTC markets have a centralized physical trading floor","B":"OTC markets are dealer markets where prices are negotiated between parties rather than set by a central auction","C":"OTC markets have more standardized reporting requirements than exchanges","D":"OTC markets only trade government securities"},"ans":"B","exp":"OTC (over-the-counter) markets are dealer markets where broker-dealers negotiate prices directly with buyers and sellers from their own inventory. There is no centralized exchange floor. Many bonds, currencies, and some stocks trade OTC."},
{"d":"easy","sub":"Market Participants","q":"A 'transfer agent' in the securities industry is responsible for:","opts":{"A":"Executing trades on behalf of customers","B":"Maintaining shareholder records and processing dividend payments, stock transfers, and corporate actions","C":"Clearing and settling securities trades","D":"Underwriting new securities offerings"},"ans":"B","exp":"A transfer agent is appointed by the issuer to maintain records of shareholders, cancel old certificates and issue new ones when shares are transferred, and distribute dividends, proxies, and annual reports. Examples include Computershare and EQ (formerly Equiniti)."},
{"d":"easy","sub":"Economic Indicators","q":"A leading economic indicator is one that:","opts":{"A":"Confirms a trend after it has occurred","B":"Moves before the economy as a whole, predicting future economic activity","C":"Moves simultaneously with the economy","D":"Only measures government sector activity"},"ans":"B","exp":"Leading indicators move before the economy, helping forecast future trends. Examples: stock prices, building permits, consumer confidence, new manufacturing orders, and the yield curve. They provide advance warning of economic turning points."},
{"d":"easy","sub":"Economic Indicators","q":"Which of the following is a coincident economic indicator?","opts":{"A":"Stock market index","B":"Building permits","C":"Industrial production","D":"Average duration of unemployment"},"ans":"C","exp":"Coincident indicators move in lockstep with the overall economy. Industrial production, personal income, and manufacturing/trade sales are coincident indicators. They confirm the current state of the economy rather than predicting future trends."},
{"d":"easy","sub":"Federal Reserve","q":"When the Fed sells government securities in open market operations, the effect is:","opts":{"A":"Injecting reserves into the banking system and lowering rates","B":"Removing reserves from the banking system and putting upward pressure on interest rates","C":"Directly raising the prime rate","D":"Increasing the money supply"},"ans":"B","exp":"When the Fed sells securities, buyers pay with bank reserves, removing money from the banking system. This reduces the money supply and puts upward pressure on short-term interest rates—a contractionary action."},
{"d":"easy","sub":"Capital Markets","q":"Which of the following is a characteristic of equity securities vs. debt securities?","opts":{"A":"Equity holders receive fixed interest payments; debt holders receive dividends","B":"Equity holders have ownership and residual claims; debt holders are creditors with priority claims","C":"Debt holders can vote at annual meetings; equity holders cannot","D":"Equity securities always have higher credit ratings than debt"},"ans":"B","exp":"Equity securities represent ownership and give holders residual claims (on earnings after expenses and debt). Debt holders are creditors with priority claims on assets and income, but no ownership rights. In bankruptcy, creditors are paid before equity holders."},
{"d":"easy","sub":"Money Markets","q":"Banker's acceptances (BAs) are:","opts":{"A":"Short-term obligations issued by the Federal Reserve","B":"Short-term drafts accepted and guaranteed by a bank, commonly used in international trade","C":"Long-term bonds issued by money center banks","D":"Deposits between U.S. and foreign banks"},"ans":"B","exp":"A banker's acceptance is a short-term credit instrument (usually 30-180 days) issued by a company and guaranteed (accepted) by a commercial bank. The bank's guarantee makes BAs a money market instrument used heavily in international trade to reduce credit risk."},
{"d":"easy","sub":"Money Markets","q":"Eurodollars are:","opts":{"A":"The currency of the European Union","B":"U.S. dollar-denominated deposits held in banks outside the United States","C":"U.S. Treasury bonds held by European central banks","D":"Euro-denominated bonds issued by U.S. companies"},"ans":"B","exp":"Eurodollars are U.S. dollar-denominated deposits held in foreign banks or foreign branches of U.S. banks, outside of U.S. regulatory jurisdiction. They are not subject to reserve requirements, making them attractive to institutional borrowers and lenders."},
{"d":"medium","sub":"Capital Markets","q":"The 'efficient market hypothesis' (EMH) in its semi-strong form states that:","opts":{"A":"Security prices reflect only past price information","B":"Security prices fully reflect all publicly available information","C":"Security prices reflect all public and private (insider) information","D":"No investor can consistently outperform the market"},"ans":"B","exp":"The semi-strong form of EMH holds that prices reflect all publicly available information (financial statements, news, economic data). In this form, fundamental analysis cannot generate consistent excess returns. Only the strong form (which includes private information) would make insider trading equally futile."},
{"d":"medium","sub":"Market Structure","q":"The 'NBBO' (National Best Bid and Offer) system:","opts":{"A":"Is a government-set price ceiling on all traded securities","B":"Requires brokers to execute customer orders at the best available bid or offer across all exchanges","C":"Sets the minimum price at which securities can be sold","D":"Is a FINRA-administered system for setting opening prices"},"ans":"B","exp":"Regulation NMS mandates that broker-dealers must execute retail customer orders at the NBBO—the best bid and offer consolidated across all registered exchanges and trading venues at the time of execution. This protects customers from receiving worse prices than available in the national market."},
{"d":"medium","sub":"Economic Indicators","q":"The 'Phillips Curve' illustrates the relationship between:","opts":{"A":"Interest rates and bond prices","B":"Unemployment and inflation—historically showing a trade-off between the two","C":"GDP growth and stock market returns","D":"Money supply growth and exchange rates"},"ans":"B","exp":"The Phillips Curve shows a historical inverse relationship between unemployment and inflation: low unemployment tends to produce wage inflation, while high unemployment is associated with low inflation. This trade-off influenced monetary policy thinking, though the relationship has been less stable since the 1970s."},
{"d":"medium","sub":"Federal Reserve","q":"The federal funds rate is:","opts":{"A":"The rate the Fed charges banks that borrow at the discount window","B":"The overnight rate at which commercial banks lend to each other to meet reserve requirements","C":"The interest rate on 3-month Treasury bills","D":"The rate charged by banks to their most creditworthy corporate clients"},"ans":"B","exp":"The federal funds rate is the overnight rate at which depository institutions lend reserves to each other. The Fed influences (but does not directly set) this rate through open market operations. It is a benchmark for many other short-term interest rates."},
{"d":"medium","sub":"International","q":"The International Monetary Fund (IMF) primarily:","opts":{"A":"Provides long-term development loans to poor countries","B":"Provides financial assistance and promotes international monetary cooperation and exchange rate stability","C":"Enforces international securities laws","D":"Sets global accounting standards"},"ans":"B","exp":"The IMF promotes international monetary cooperation, exchange rate stability, and balanced trade. It provides financial assistance to countries facing balance-of-payments difficulties and offers policy advice. The World Bank (not the IMF) focuses on long-term development lending."},
{"d":"medium","sub":"Capital Markets","q":"A 'secondary offering' differs from an IPO in that:","opts":{"A":"A secondary offering is sold directly by the company to individual investors","B":"A secondary offering involves the sale of existing shares (by insiders or early investors), not newly issued shares by the company","C":"Secondary offerings are not required to file with the SEC","D":"Secondary offerings always occur on exchanges; IPOs occur OTC"},"ans":"B","exp":"A secondary offering (follow-on offering) can involve the company selling additional new shares or existing shareholders selling their holdings. In a 'pure secondary,' only existing holders sell—no new capital goes to the company. An IPO is the company's first sale of shares to the public."},
{"d":"medium","sub":"Market Participants","q":"A 'custodian' in the securities industry:","opts":{"A":"Regulates broker-dealer compliance with FINRA rules","B":"Holds and safeguards securities on behalf of investors, handling settlement and corporate actions","C":"Executes trades on behalf of institutional clients","D":"Underwrites and distributes new securities offerings"},"ans":"B","exp":"A custodian (e.g., a large bank or trust company) holds securities on behalf of institutional or individual investors, facilitating settlement, collecting dividends and interest, processing corporate actions, and providing record-keeping services."},
{"d":"medium","sub":"Yield Curve","q":"The 'pure expectations theory' of the yield curve holds that:","opts":{"A":"Long-term rates include a liquidity premium above expected short-term rates","B":"Long-term rates reflect only the market's expectations of future short-term interest rates","C":"Central banks fully control all points on the yield curve","D":"The yield curve always slopes upward in a healthy economy"},"ans":"B","exp":"Pure expectations theory holds that the entire yield curve is determined by expectations of future short-term rates—long-term rates are essentially geometric averages of expected future short-term rates. It implies that an upward curve expects rates to rise, and an inverted curve expects rates to fall."},
{"d":"hard","sub":"Capital Markets","q":"Convexity in bond pricing means that:","opts":{"A":"Duration overestimates price increases and underestimates price decreases for large rate changes","B":"Bond prices change more than estimated by duration alone for large interest rate moves—price increases are greater and price decreases are smaller than duration implies","C":"All bonds have the same price sensitivity to interest rate changes","D":"Zero-coupon bonds have lower convexity than coupon-paying bonds"},"ans":"B","exp":"Convexity measures the curvature in the price-yield relationship. Duration is a linear approximation; convexity corrects for the curvature. For standard (positively convex) bonds, actual price increases for rate declines exceed duration estimates, while actual price decreases for rate increases are less than duration estimates—a favorable asymmetry for bondholders."},
{"d":"hard","sub":"Market Structure","q":"Regulation NMS (National Market System) Rule 611 (the 'Order Protection Rule') requires:","opts":{"A":"All orders to be executed within 1 second","B":"Trading centers to establish procedures to prevent trade-throughs—executing orders at prices inferior to protected quotes in other venues","C":"All broker-dealers to route orders to the exchange with the highest volume","D":"Institutional orders to be executed in dark pools before exchanges"},"ans":"B","exp":"Rule 611 (the Order Protection Rule) prohibits trade-throughs—executing a trade at a price inferior to a protected quote displayed by another trading center. It requires broker-dealers to route orders to the venue with the best price, ensuring customers receive the NBBO."},
{"d":"hard","sub":"Economic Indicators","q":"The 'Taylor Rule' is used by central banks to:","opts":{"A":"Calculate reserve requirements based on bank size","B":"Set a target for the federal funds rate based on inflation and the output gap","C":"Determine the appropriate money supply growth rate","D":"Establish benchmark rates for mortgage lending"},"ans":"B","exp":"The Taylor Rule is a formula suggesting central banks should set the federal funds rate based on: the neutral rate + 0.5 × (inflation gap from target) + 0.5 × (output gap). It provides a systematic, rule-based approach to monetary policy that many economists use to evaluate Fed decisions."},
{"d":"easy","sub":"Market Structure","q":"The 'fourth market' refers to:","opts":{"A":"OTC trading of non-exchange-listed stocks","B":"Direct trading of securities between institutional investors without using broker-dealers","C":"International securities markets","D":"After-hours trading by retail investors"},"ans":"B","exp":"The fourth market is direct institution-to-institution trading without the use of broker-dealers. Electronic crossing networks (ECNs) facilitate this type of trading. It developed to reduce transaction costs for large institutional trades."},
{"d":"easy","sub":"Market Participants","q":"The Options Clearing Corporation (OCC) serves as:","opts":{"A":"The regulator of all options markets in the U.S.","B":"The central counterparty and guarantor for all listed options trades in the U.S.","C":"The exchange where most options are traded","D":"An SRO that licenses options traders"},"ans":"B","exp":"The OCC is the world's largest equity derivatives clearing organization. It acts as guarantor for listed options contracts, ensuring that obligations of both buyers and sellers are honored. It interposes itself as buyer to every seller and seller to every buyer, eliminating counterparty risk."},
{"d":"medium","sub":"Market Participants","q":"A 'clearing broker' vs. an 'introducing broker':","opts":{"A":"Clearing brokers only deal with retail clients; introducing brokers handle institutional clients","B":"Clearing brokers handle trade settlement, margin, and custody; introducing brokers execute orders and have customer relationships but outsource clearing","C":"Introducing brokers are regulated by the SEC; clearing brokers by FINRA only","D":"There is no meaningful regulatory distinction between the two"},"ans":"B","exp":"Introducing brokers maintain customer relationships and take orders but contract with a clearing broker for settlement, custody, margin, and record-keeping. Clearing brokers are responsible for the operational mechanics of completing trades. This arrangement allows smaller firms to offer brokerage services without the infrastructure of a clearing operation."},
{"d":"medium","sub":"Capital Markets","q":"The 'underwriting spread' in a securities offering is:","opts":{"A":"The difference between the bid and ask prices in the secondary market","B":"The difference between the price the underwriter pays to the issuer and the price at which shares are offered to the public","C":"The underwriter's commission charged to investors","D":"The cost of printing and distributing the prospectus"},"ans":"B","exp":"The underwriting spread (or gross spread) is the difference between the public offering price and the price the underwriter pays the issuer. It typically includes the manager's fee, underwriter's fee, and selling concession, and is the underwriter's compensation for assuming distribution risk."},
{"d":"easy","sub":"Federal Reserve","q":"The Federal Reserve System consists of:","opts":{"A":"The Fed Chairman and 12 regional branch offices","B":"The Board of Governors in Washington D.C., 12 regional Federal Reserve Banks, and the Federal Open Market Committee (FOMC)","C":"The Treasury Department and the 50 state banking regulators","D":"The SEC, FDIC, and OCC acting jointly"},"ans":"B","exp":"The Federal Reserve System has three parts: (1) the Board of Governors (7 members appointed by the President), (2) 12 regional Federal Reserve Banks, and (3) the FOMC (which sets monetary policy). The FOMC consists of the 7 governors plus 5 of the 12 regional bank presidents on a rotating basis."},
{"d":"easy","sub":"Money Markets","q":"Repurchase agreements (repos) are:","opts":{"A":"Long-term contracts for the sale of government securities","B":"Short-term collateralized borrowing where securities are sold with an agreement to repurchase them at a higher price","C":"Agreements by the Fed to buy back outstanding currency","D":"Contracts between two banks to exchange interest rate payments"},"ans":"B","exp":"A repo is a short-term secured loan: the borrower sells securities and agrees to repurchase them at a higher price (reflecting interest) at a specified future date—often overnight. Repos are heavily used by the Fed in open market operations and by financial institutions for short-term funding."},
{"d":"medium","sub":"Market Structure","q":"An alternative trading system (ATS) is:","opts":{"A":"A foreign exchange market for currency trading","B":"An electronic trading platform that matches buyers and sellers but is not registered as a national securities exchange","C":"The NYSE's after-hours trading system","D":"A FINRA-operated platform for OTC bond trading"},"ans":"B","exp":"ATSs (regulated under Regulation ATS) are electronic trading systems that match orders but do not register as national exchanges. They include ECNs (electronic communications networks) and dark pools. Large ATSs must comply with enhanced transparency and fair access requirements."},
{"d":"hard","sub":"Market Participants","q":"A 'prime broker' primarily provides services to:","opts":{"A":"Retail investors with high-net-worth accounts","B":"Hedge funds and large institutional investors—including securities lending, leverage, custody, and trade execution","C":"Corporate issuers conducting IPOs","D":"Central banks managing foreign exchange reserves"},"ans":"B","exp":"Prime brokerage is a bundle of services offered by major broker-dealers to institutional clients (especially hedge funds): securities lending for short selling, leverage, trade execution and clearing across multiple brokers, custody, and reporting. Goldman Sachs, Morgan Stanley, and JPMorgan are major prime brokers."},
{"d":"medium","sub":"International","q":"A 'Brady bond' is:","opts":{"A":"A bond issued by the Federal Reserve for international settlements","B":"A dollar-denominated bond issued by developing countries, often created to restructure defaulted sovereign debt","C":"A foreign bond issued in the U.S. market","D":"A bond that pays interest tied to LIBOR plus a spread"},"ans":"B","exp":"Brady bonds (named for Treasury Secretary James Brady) are dollar-denominated bonds issued by Latin American and other developing nations in exchange for defaulted commercial bank loans during the 1980s debt crisis. They helped restructure sovereign debt and reintegrate countries into capital markets."},
{"d":"easy","sub":"Economic Indicators","q":"When the Federal Reserve raises interest rates, what is the typical expected effect on bond prices?","opts":{"A":"Bond prices rise because higher rates make bonds more attractive","B":"Bond prices fall because existing bonds with lower coupon rates become less attractive relative to new bonds","C":"Bond prices are unaffected by interest rate changes","D":"Only short-term bond prices fall; long-term bond prices rise"},"ans":"B","exp":"Interest rates and bond prices have an inverse relationship. When rates rise, newly issued bonds offer higher coupons, making existing lower-coupon bonds less attractive. Investors demand a lower price for existing bonds to equalize yields with current market rates."},
{"d":"easy","sub":"Market Structure","q":"What is the role of a 'specialist' or 'designated market maker' (DMM) on the NYSE?","opts":{"A":"To approve all new listings on the exchange","B":"To maintain fair and orderly markets in assigned securities by quoting bids and offers and facilitating trading","C":"To audit listed companies' financial statements","D":"To set opening prices based on government guidelines"},"ans":"B","exp":"DMMs (formerly specialists) are assigned to specific NYSE-listed stocks and are obligated to maintain fair and orderly markets. They provide liquidity by quoting bids and offers, manage the opening auction, and may buy or sell for their own account to offset temporary supply-demand imbalances."},
{"d":"easy","sub":"Money Markets","q":"The 'federal funds rate' vs. the 'discount rate':","opts":{"A":"Both are set directly by Congress","B":"The federal funds rate is a market rate for interbank lending; the discount rate is set by the Fed for bank borrowing at the Fed window","C":"The discount rate is always lower than the federal funds rate","D":"They are the same rate with different names"},"ans":"B","exp":"The federal funds rate is determined by market supply and demand for overnight bank reserves (the Fed targets it through OMOs). The discount rate is directly set by the Fed for direct loans to banks at the discount window, and is typically set above the fed funds rate to encourage interbank lending first."},
{"d":"medium","sub":"Capital Markets","q":"In a 'green shoe' (overallotment) option in an IPO, the underwriter may:","opts":{"A":"Sell more shares than in the original offering and then buy back shares in the aftermarket to cover","B":"Reduce the offering size if investor demand is weak","C":"Issue additional shares after the lock-up period ends","D":"Purchase competitor's shares to stabilize the offering"},"ans":"A","exp":"A green shoe option allows underwriters to sell up to 15% more shares than the original offering. If the aftermarket price rises, they exercise the option and buy newly issued shares. If the price falls, they buy shares in the open market (stabilization) instead, supporting the price. Named after the Green Shoe Company's 1963 IPO."},
{"d":"medium","sub":"Economic Indicators","q":"The 'current account' of a country's balance of payments includes:","opts":{"A":"Only foreign direct investment flows","B":"Trade in goods, services, income, and current transfers between countries","C":"Only the trade balance in physical goods","D":"Foreign exchange reserves held by the central bank"},"ans":"B","exp":"The current account tracks: (1) trade in goods (merchandise trade balance), (2) trade in services, (3) primary income (investment income, wages), and (4) current transfers (foreign aid, remittances). A current account deficit means a country spends more abroad than it earns from abroad."},
{"d":"medium","sub":"Federal Reserve","q":"The 'interest on reserve balances' (IORB) rate:","opts":{"A":"Is the rate banks pay to hold excess reserves at the Fed","B":"Is the rate the Fed pays banks on reserves held at the Fed, creating an effective floor under the fed funds rate","C":"Applies only to required reserves, not excess reserves","D":"Is set by the Treasury Department, not the Federal Reserve"},"ans":"B","exp":"IORB is the rate the Fed pays banks on their reserve balances. Since banks won't lend reserves for less than the IORB rate, it creates an effective floor under the federal funds rate. Raising IORB raises the floor on short-term interest rates. It replaced the split required/excess reserve rates in July 2021."},
{"d":"hard","sub":"Market Structure","q":"The Volcker Rule restricts:","opts":{"A":"Banks from accepting deposits and making loans simultaneously","B":"Banks from engaging in proprietary trading and from owning hedge funds or private equity funds","C":"Investment banks from underwriting IPOs for clients they also advise","D":"Broker-dealers from acting as both broker and dealer in the same transaction"},"ans":"B","exp":"The Volcker Rule (part of Dodd-Frank) generally prohibits banks (insured depository institutions and their affiliates) from engaging in short-term proprietary trading and from acquiring or retaining ownership interests in hedge funds or private equity funds. It aims to prevent banks from using federally insured deposits to take speculative risks."},
{"d":"hard","sub":"Market Participants","q":"A 'Qualified Institutional Buyer' (QIB) under Rule 144A is:","opts":{"A":"Any institutional investor with a compliance department","B":"An institution owning and investing on a discretionary basis at least $100 million in securities","C":"A registered investment adviser with at least 50 clients","D":"An institution that has passed FINRA's suitability assessment"},"ans":"B","exp":"Rule 144A QIBs are institutions (insurance companies, investment companies, pension plans, banks, broker-dealers) that own and invest on a discretionary basis at least $100 million in securities. Rule 144A allows issuers to resell restricted securities to QIBs without full SEC registration, creating a liquid private market."},
{"d":"easy","sub":"International","q":"The term 'foreign exchange risk' refers to:","opts":{"A":"The risk of investing in politically unstable countries","B":"The risk that changes in currency exchange rates will affect the value of international investments","C":"The risk that a foreign government will default on its bonds","D":"The additional trading costs of buying securities on foreign exchanges"},"ans":"B","exp":"Foreign exchange (currency) risk is the possibility that changes in exchange rates will affect the returns on international investments. If a U.S. investor holds foreign securities and the foreign currency weakens vs. the dollar, returns will be reduced even if the local market return is positive."},
{"d":"medium","sub":"Capital Markets","q":"A 'rights offering' typically offers existing shareholders new shares at:","opts":{"A":"A premium above the current market price","B":"A discount below the current market price","C":"The current market price with no adjustment","D":"The original IPO price"},"ans":"B","exp":"In a rights offering, shareholders are offered the right to buy new shares at a subscription price set below the current market price—a built-in discount to incentivize participation. This allows shareholders to maintain their proportional ownership and prevents dilution."},
{"d":"medium","sub":"Market Participants","q":"The MSRB (Municipal Securities Rulemaking Board) regulates:","opts":{"A":"The SEC's enforcement of insider trading rules","B":"Broker-dealers and banks that underwrite, trade, and sell municipal securities","C":"Municipal governments' debt issuance directly","D":"State insurance regulators' oversight of municipal bond insurance"},"ans":"B","exp":"The MSRB writes rules governing the activities of broker-dealers (and bank dealers) in the municipal securities market—covering underwriting, trading, sales practices, disclosure, and professional qualifications (Series 52, 53). The MSRB does not regulate municipal issuers directly."},
{"d":"easy","sub":"Economic Indicators","q":"A 'recession' is technically defined as:","opts":{"A":"Any period where the unemployment rate exceeds 6%","B":"Two consecutive quarters of negative GDP growth","C":"A 20% or more decline in the stock market","D":"A period of rising inflation above 5%"},"ans":"B","exp":"While the National Bureau of Economic Research (NBER) uses a broader definition, the common technical definition of a recession is two consecutive quarters of negative GDP growth. The NBER considers depth, duration, and breadth across economic indicators when officially dating recessions."},
{"d":"medium","sub":"Market Structure","q":"SEC Regulation NMS was designed to:","opts":{"A":"Create the national mutual fund market","B":"Modernize and strengthen the national market system for equity securities, ensuring customers receive the best available prices","C":"Regulate the OTC derivatives market","D":"Establish trading rules for Treasury securities"},"ans":"B","exp":"Regulation NMS (National Market System, 2005) updated the framework for U.S. equity markets. Key rules: Order Protection Rule (prevents trade-throughs), Access Rule (fair access to quotes), Sub-Penny Rule (limits tick sizes), and Market Data Rules (ensuring fair distribution of market data)."},
{"d":"hard","sub":"Capital Markets","q":"The 'efficient frontier' in portfolio theory represents:","opts":{"A":"The maximum return achievable in any market condition","B":"The set of portfolios offering the maximum expected return for each level of risk, or minimum risk for each level of return","C":"The boundary between domestic and international investment allocations","D":"The regulatory limit on portfolio concentration"},"ans":"B","exp":"The efficient frontier (from Markowitz's Modern Portfolio Theory) is the set of optimal portfolios that offer the highest expected return for a given level of risk (or lowest risk for a given return). Portfolios below the frontier are suboptimal. Diversification moves portfolios toward the frontier."},
{"d":"easy","sub":"Capital Markets","q":"The 'bid price' in a securities quote is:","opts":{"A":"The price a dealer will sell a security","B":"The price a dealer will buy a security (highest price a buyer will pay)","C":"The most recent price at which a trade occurred","D":"The average of recent transaction prices"},"ans":"B","exp":"The bid price is the highest price a buyer (typically a dealer) is willing to pay for a security at a given moment. The ask (offer) is the lowest price a seller will accept. The bid is always lower than the ask; the difference is the spread."},
{"d":"medium","sub":"International","q":"Purchasing power parity (PPP) theory states that:","opts":{"A":"All countries should have equal interest rates","B":"Exchange rates between currencies should adjust so that identical goods cost the same in all countries when prices are expressed in a common currency","C":"Countries with higher inflation should have stronger currencies","D":"The IMF should set exchange rates to equalize purchasing power"},"ans":"B","exp":"PPP holds that in the long run, exchange rates should equalize the purchasing power of different currencies—a basket of goods should cost the same when converted to a common currency. Countries with higher inflation should see their currency depreciate to maintain PPP."},
{"d":"easy","sub":"Market Structure","q":"The 'ask' (offer) price in a securities quote is:","opts":{"A":"The price a dealer will pay for a security","B":"The lowest price a seller will accept for a security","C":"The most recent trade price","D":"The opening price of the trading day"},"ans":"B","exp":"The ask (offer) is the price at which a dealer (or seller) is willing to sell a security. Investors buying from a dealer pay the ask price. The bid-ask spread represents the dealer's compensation for providing liquidity."},
{"d":"easy","sub":"Market Participants","q":"Investment banks primarily differ from commercial banks in that investment banks:","opts":{"A":"Accept customer deposits and make personal loans","B":"Underwrite and distribute securities, advise on M&A, and engage in trading, rather than taking deposits","C":"Are regulated by state banking authorities rather than the SEC","D":"Only serve individual retail customers, not corporations"},"ans":"B","exp":"Investment banks (like Goldman Sachs, Morgan Stanley, JPMorgan) underwrite new securities, advise on mergers and acquisitions, provide trading and market-making services, and manage assets. Commercial banks (regulated by the Fed/OCC/FDIC) take deposits and make loans. The Glass-Steagall Act separated them 1933-1999."},
{"d":"medium","sub":"Capital Markets","q":"The 'lockup period' in an IPO prevents:","opts":{"A":"The company from issuing additional shares for one year","B":"Company insiders and early investors from selling their shares immediately after the IPO, typically for 90-180 days","C":"The underwriter from being paid its spread for 6 months","D":"Retail investors from buying IPO shares until after institutions are served"},"ans":"B","exp":"Lock-up agreements (typically 90-180 days) restrict company insiders, officers, directors, and pre-IPO investors from selling their shares after an IPO. This prevents a large immediate supply of shares that could depress the stock price. After lockup expiration, the market watches for insider selling activity."},
{"d":"easy","sub":"Economic Indicators","q":"Inflation is best measured by:","opts":{"A":"GDP growth rate","B":"Consumer Price Index (CPI) and Producer Price Index (PPI)","C":"The stock market return","D":"The unemployment rate"},"ans":"B","exp":"CPI measures the change in prices for a fixed basket of goods and services purchased by urban consumers—the most widely followed inflation gauge. PPI measures prices received by domestic producers for their output (upstream inflation). Both are published monthly by the Bureau of Labor Statistics."},
{"d":"medium","sub":"Market Structure","q":"The 'opening auction' on the NYSE:","opts":{"A":"Allows only institutional investors to trade before retail hours","B":"Uses an auction process to determine the opening price for each stock based on all accumulated buy and sell orders before the open","C":"Is conducted entirely by the SEC with no broker involvement","D":"Sets opening prices based on the previous day's closing prices plus or minus 2%"},"ans":"B","exp":"The NYSE opening auction (9:30 AM ET) collects orders submitted before the open and uses them to determine the opening price at which buy and sell interest is most balanced. DMMs facilitate this process. The auction prevents disorderly openings after news events and overnight price gaps."},
{"d":"hard","sub":"Capital Markets","q":"'Systematic risk' (also called market risk) in portfolio theory is:","opts":{"A":"Risk that can be eliminated through diversification","B":"Risk inherent to the entire market—it cannot be eliminated through diversification","C":"The risk of any single company failing","D":"The risk specific to a particular industry"},"ans":"B","exp":"Systematic risk (market risk, non-diversifiable risk) affects the entire market: interest rate changes, recessions, political events, inflation. It cannot be diversified away because all assets are somewhat correlated with the overall market. Unsystematic (specific/diversifiable) risk is company- or industry-specific and can be diversified away."},
{"d":"medium","sub":"International","q":"A 'balance of payments' deficit on the current account means:","opts":{"A":"The country is spending more abroad than it earns from abroad","B":"The government is running a budget deficit","C":"The country's foreign exchange reserves are negative","D":"The central bank must devalue the currency immediately"},"ans":"A","exp":"A current account deficit means a country is importing more goods, services, and income than it is exporting—it is a net borrower from the rest of the world. It must be financed by a corresponding capital account surplus (foreigners investing in the country) or by drawing down foreign exchange reserves."},
{"d":"easy","sub":"Money Markets","q":"The 'prime rate' is:","opts":{"A":"The rate set directly by the Federal Reserve for all lending","B":"The interest rate commercial banks charge their most creditworthy corporate customers—typically benchmarked at 3% above the federal funds rate","C":"The rate the government pays on 90-day Treasury bills","D":"The overnight rate for all consumer lending"},"ans":"B","exp":"The prime rate is the benchmark interest rate banks charge their best (most creditworthy) corporate customers. It is not set by the Fed but historically tracks 3% above the federal funds rate. Many consumer loan rates (HELOCs, credit cards) are tied to the prime rate."},
{"d":"medium","sub":"Federal Reserve","q":"The FOMC (Federal Open Market Committee) typically meets:","opts":{"A":"Monthly","B":"Eight times per year (approximately every 6-7 weeks)","C":"Quarterly","D":"Only when there is an economic emergency"},"ans":"B","exp":"The FOMC meets 8 times per year (approximately every 6-7 weeks) to set monetary policy, including the target range for the federal funds rate. Meetings result in a policy statement; every other meeting includes updated economic projections (the 'dot plot'). Emergency meetings can occur between scheduled meetings."},
{"d":"hard","sub":"Market Structure","q":"Circuit breakers on U.S. stock markets halt trading when:","opts":{"A":"The S&P 500 declines by 5% in one session","B":"The S&P 500 falls 7%, 13%, or 20% from the prior day's close, triggering 15-minute halts (or market close at 20%)","C":"Any 50 S&P 500 stocks fall by 10% in one day","D":"The Dow Jones Industrial Average falls more than 500 points"},"ans":"B","exp":"Market-wide circuit breakers (Rule 80B) trigger when the S&P 500 falls: Level 1 (7%): 15-min halt if before 3:25 PM; Level 2 (13%): 15-min halt if before 3:25 PM; Level 3 (20%): market closes for the day. These replaced the Dow-based triggers after the 1987 crash."},
{"d":"easy","sub":"Federal Reserve","q":"When the Fed buys government securities in open market operations:","opts":{"A":"It removes reserves from the banking system","B":"It injects reserves into the banking system, increasing the money supply and putting downward pressure on rates","C":"It raises the discount rate","D":"It increases reserve requirements for banks"},"ans":"B","exp":"When the Fed buys securities from banks, it pays with newly created reserves (electronic money), injecting liquidity into the banking system. This increases the money supply and puts downward pressure on short-term interest rates—an expansionary monetary policy action."},
{"d":"medium","sub":"Market Participants","q":"A 'clearing corporation' (such as DTCC) serves to:","opts":{"A":"Set the prices at which securities are traded","B":"Act as central counterparty, netting transactions and guaranteeing settlement between broker-dealers","C":"Regulate broker-dealer compliance with securities laws","D":"Issue and register new securities on behalf of corporations"},"ans":"B","exp":"The DTCC (Depository Trust & Clearing Corporation) is the central clearinghouse for U.S. securities. It nets buy and sell transactions, reducing the number of securities and cash that actually need to move. By acting as central counterparty, it guarantees settlement even if one party defaults, significantly reducing counterparty risk."},
{"d":"easy","sub":"Capital Markets","q":"A 'private placement' differs from a public offering in that:","opts":{"A":"Private placements always offer higher returns","B":"Private placements are sold to a limited number of qualified buyers without full SEC registration requirements","C":"Private placements are regulated more stringently than public offerings","D":"Private placements must be listed on a stock exchange within 2 years"},"ans":"B","exp":"Private placements (sold under Reg D or other exemptions) are sold to a limited number of sophisticated/accredited investors without the full SEC registration process (no public prospectus). They are faster and cheaper for issuers but result in 'restricted securities' that have resale limitations."},
