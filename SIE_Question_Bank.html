{"d":"easy","sub":"Securities Acts","q":"'Material' information in securities law is information that:","opts":{"A":"Has been published in at least 3 major newspapers","B":"A reasonable investor would consider important in making an investment decision","C":"The SEC has specifically classified as significant","D":"Results in a price change of more than 5% when disclosed"},"ans":"B","exp":"The legal standard for materiality (from the Supreme Court's TSC Industries case): information is material if there is a substantial likelihood that a reasonable investor would consider it important in deciding whether to buy, sell, or hold a security. Both positive and negative information can be material."},
{"d":"medium","sub":"AML","q":"Beneficial ownership rules require firms to collect ownership information about:","opts":{"A":"Only individuals with over $1 million in their accounts","B":"Legal entity customers—identifying the natural persons who own or control 25%+ and one person with significant control","C":"All customers regardless of account type or entity status","D":"Only foreign corporations and partnerships"},"ans":"B","exp":"FinCEN's beneficial ownership rule (part of the Customer Due Diligence Rule) requires covered financial institutions to identify and verify: (1) individuals who own 25%+ of a legal entity customer (up to 4 persons), and (2) one person with significant management control (the 'control prong'). This prevents legal entities from hiding true ownership."},
{"d":"hard","sub":"Securities Acts","q":"The 'Howey Test' is used to determine:","opts":{"A":"Whether a bond offering requires SEC registration","B":"Whether an investment arrangement constitutes a 'security' under the Securities Act","C":"Whether an adviser must register with the SEC or state","D":"Whether insider trading has occurred"},"ans":"B","exp":"From SEC v. Howey (1946), the Howey Test defines an investment contract (security) as: (1) investment of money, (2) in a common enterprise, (3) with an expectation of profits, (4) derived from the efforts of others. Courts apply this test to determine whether novel investment arrangements (crypto, LLCs, citrus groves) are securities requiring registration."},
{"d":"medium","sub":"FINRA","q":"A 'private securities transaction' under FINRA rules:","opts":{"A":"Refers to any transaction not reported to the consolidated tape","B":"Is a transaction outside the scope of the registered rep's employment that must be disclosed to and approved by the member firm","C":"Is a trade executed in a dark pool","D":"Refers to Reg D transactions sold by the member firm"},"ans":"B","exp":"FINRA Rule 3280 (private securities transactions / selling away) requires registered persons to notify their firm in writing before participating in any private securities transaction outside their regular scope of employment. The firm must then decide whether to approve, reject, or supervise the transaction. Failure to disclose is a serious violation."},
{"d":"easy","sub":"SIPC","q":"Which of the following is NOT covered by SIPC?","opts":{"A":"Common stocks held at a failed broker-dealer","B":"Commodities futures contracts, fixed annuities, or investment losses due to market decline","C":"Cash balances up to $250,000","D":"Municipal bonds held in a failed broker-dealer's account"},"ans":"B","exp":"SIPC does not cover: commodities futures, currency, investment contracts, fixed annuities, or any loss in market value. It covers securities (stocks, bonds, mutual fund shares) and cash held at a failed broker-dealer, up to limits. It protects against broker-dealer failure, not against the risk of investing."},
{"d":"medium","sub":"Registration","q":"A 'no-action letter' from the SEC:","opts":{"A":"Is a formal enforcement action requiring a company to stop an activity","B":"Is a letter indicating that SEC staff will not recommend enforcement action if a described course of conduct is followed","C":"Exempts a company from all future registration requirements","D":"Confirms that a securities offering is fully registered and approved"},"ans":"B","exp":"A no-action letter is issued by SEC staff (not the Commission itself) in response to a request, indicating that staff will not recommend enforcement action if the requesting party proceeds as described. They are commonly sought for new business practices, exemption from registration, or proxy issues. They do not carry the force of law but provide practical guidance."},
{"d":"hard","sub":"AML","q":"The 'Travel Rule' (Bank Secrecy Act) requires:","opts":{"A":"Reporting all international wire transfers over $3,000 to FinCEN","B":"Financial institutions to pass along certain identifying information (name, address, account number) for funds transfers of $3,000 or more","C":"Physical currency transfers exceeding $10,000 to be accompanied by a government escort","D":"Documentation of all wire transfers in excess of $5,000"},"ans":"B","exp":"The BSA Travel Rule requires financial institutions to pass on ('travel with') certain identifying information about the sender and receiver for funds transfers of $3,000 or more: name, address, account number, and institution ID. This creates a paper trail as funds move between institutions, aiding in anti-money laundering investigations."},
{"d":"medium","sub":"Securities Acts","q":"The 'shelf registration' (Rule 415) under the Securities Act allows:","opts":{"A":"Companies to register securities and sell them from a 'shelf' over up to 3 years in multiple tranches","B":"Companies to avoid registration entirely for 3 years","C":"Broker-dealers to maintain securities inventory for immediate customer sales","D":"Investment companies to register their annual portfolio additions without a new prospectus"},"ans":"A","exp":"Rule 415 shelf registration allows eligible companies (primarily large well-known seasoned issuers, or WKSIs) to register a large block of securities and then sell them in smaller tranches over up to 3 years as market conditions favor. It dramatically reduces the time and cost of accessing capital markets repeatedly."},
{"d":"easy","sub":"AML","q":"A firm's AML (anti-money laundering) compliance program must include all of the following EXCEPT:","opts":{"A":"Internal policies and procedures","B":"An AML compliance officer","C":"Independent testing of the program","D":"A FINRA-approved external auditor conducting testing"},"ans":"D","exp":"FINRA Rule 3310 requires BSA/AML programs to include: (1) policies and procedures, (2) a designated AML compliance officer, (3) ongoing training, (4) independent testing—but the testing can be done internally by qualified personnel, not necessarily an external auditor. FINRA does not require or approve specific external auditors."},
{"d":"medium","sub":"Registration","q":"Rule 144A allows resale of restricted securities to:","opts":{"A":"Any institutional investor with over $1 million in assets","B":"Qualified institutional buyers (QIBs)—institutions with at least $100 million in securities under management","C":"All accredited investors without holding period requirements","D":"Retail investors who have held the security for one year"},"ans":"B","exp":"Rule 144A creates a private secondary market for restricted securities among QIBs (institutions managing $100M+ in securities). Resale between QIBs under Rule 144A has no holding period requirement and no volume limitations—creating a liquid private placement market for institutional investors."},
{"d":"medium","sub":"Suitability","q":"An investment recommendation is 'suitable' under FINRA rules only if the registered rep has:","opts":{"A":"Disclosed the potential risks in writing","B":"A reasonable basis to believe the recommendation is appropriate for the specific customer based on their investment profile","C":"Obtained prior approval from a supervisory principal","D":"Confirmed the recommendation with at least two independent sources"},"ans":"B","exp":"Suitability requires a reasonable basis to believe (not certainty) that the recommendation is appropriate for this specific customer given all elements of their investment profile: financial situation, tax status, investment objectives, time horizon, liquidity needs, risk tolerance, and other investments. It is a fact-specific, customer-specific analysis."},
{"d":"easy","sub":"Securities Acts","q":"The Sarbanes-Oxley Act requires CEOs and CFOs of public companies to:","opts":{"A":"Personally audit the company's financial statements","B":"Certify in writing the accuracy of annual and quarterly financial reports, with criminal penalties for knowing false certifications","C":"Hold company stock for a minimum of 5 years","D":"Report all compensation to the SEC quarterly"},"ans":"B","exp":"SOX Sections 302 and 906 require CEOs and CFOs to personally certify that SEC financial reports fairly present the company's financial condition and comply with applicable rules. Knowing false certifications can result in criminal penalties: up to 10 years (Section 302) or 20 years (Section 906) in prison and fines up to $5 million."},
{"d":"medium","sub":"FINRA","q":"FINRA BrokerCheck provides public access to:","opts":{"A":"All private customer complaint details filed with FINRA","B":"Registration status, examination history, employment history, and disclosed disciplinary events for brokers and firms","C":"Real-time trading data for all FINRA member firms","D":"Internal firm audit reports and compliance reviews"},"ans":"B","exp":"BrokerCheck (brokercheck.finra.org) allows the public to research registered brokers and broker-dealers. It displays: current and prior registrations, examination qualifications, employment history for the past 10 years, and disclosed events (customer disputes, regulatory actions, criminal matters, financial disclosures). Private complaint details and certain older records are not shown."},
{"d":"hard","sub":"Securities Acts","q":"The 'Jumpstart Our Business Startups (JOBS) Act' created which of the following?","opts":{"A":"The SEC and FINRA as regulatory bodies","B":"Regulation Crowdfunding (Reg CF), expanded Regulation A+, and the emerging growth company (EGC) IPO on-ramp","C":"The investment adviser registration requirement","D":"SIPC and broker-dealer insurance requirements"},"ans":"B","exp":"The JOBS Act (2012) created: (1) Regulation CF—equity crowdfunding from the general public; (2) Expanded Regulation A+ (Tier 2 up to $75M); (3) the EGC on-ramp for IPOs with reduced disclosure burdens for 5 years; (4) Rule 506(c) allowing general solicitation in Reg D offerings to accredited investors. It was designed to facilitate smaller company capital formation."},
{"d":"medium","sub":"AML","q":"Under FINRA rules, an AML training program must:","opts":{"A":"Be conducted annually by an outside vendor","B":"Be provided to all employees who are involved in the covered institution's business, updated as needed","C":"Be limited to registered representatives only","D":"Result in a certification exam passed with 80% or better"},"ans":"B","exp":"FINRA Rule 3310 requires ongoing AML training for all appropriate personnel involved in the firm's business (not just registered reps). The training must cover how to identify red flags, how to escalate suspicious activity, and how to comply with BSA requirements. There is no mandated annual exam or minimum score."},
{"d":"hard","sub":"Securities Acts","q":"Which of the following is NOT a 'covered security' under NSMIA (National Securities Markets Improvement Act of 1996)?","opts":{"A":"Exchange-listed stocks","B":"Securities issued by registered investment companies","C":"Securities in Reg D Rule 506 offerings","D":"Securities in intrastate offerings under Rule 147"},"ans":"D","exp":"NSMIA preempted most state registration requirements for 'covered securities'—including exchange-listed stocks, investment company securities, and Rule 506 Reg D offerings (sold to accredited investors). Intrastate offerings under Rule 147 are NOT covered securities; they remain subject to state (blue sky) registration in the relevant state."},
{"d":"easy","sub":"FINRA","q":"Form U5 is filed when:","opts":{"A":"A new registered representative joins a FINRA member firm","B":"A registered representative terminates employment or registration with a member firm","C":"A firm applies for FINRA membership","D":"A registered rep passes a new qualification examination"},"ans":"B","exp":"Form U5 (Uniform Termination Notice) is filed by the member firm when a registered person leaves (voluntarily or involuntarily). It must be filed within 30 days of termination. It becomes part of the individual's CRD record and is accessible via BrokerCheck. Firms must answer truthfully—filing a false U5 is a violation."},
{"d":"medium","sub":"AML","q":"Which of the following is a 'red flag' that should prompt a suspicious activity report (SAR)?","opts":{"A":"A customer who deposits $9,000 in cash three days in a row","B":"A customer who asks questions about a company's investment products","C":"A customer who changes their address","D":"A customer who makes a large purchase of Treasury bonds"},"ans":"A","exp":"A customer depositing $9,000 in cash on consecutive days is a textbook structuring/smurfing red flag—the amounts are below the $10,000 CTR trigger, suggesting deliberate avoidance of reporting. This pattern should prompt a SAR filing regardless of the amounts involved. Structuring is itself illegal even if the funds are from legitimate sources."},
{"d":"medium","sub":"Registration","q":"When an investment adviser deregisters with the SEC due to having assets below $90 million:","opts":{"A":"They must immediately cease all advisory activities","B":"They must register with the state regulator(s) in the state(s) where they have a place of business","C":"They must convert to a broker-dealer registration","D":"They must merge with a larger SEC-registered adviser"},"ans":"B","exp":"SEC-registered advisers with AUM under $90 million (the threshold requiring withdrawal to state) must register with state regulators. Advisers with $90-110 million in AUM may register with either SEC or states. Those with $110M+ must register with the SEC. Transitioning advisers have a grace period and cannot let registration lapse during the transition."},
{"d":"hard","sub":"Securities Acts","q":"The 'Dodd-Frank' Volcker Rule includes an exemption for:","opts":{"A":"All trading by investment banks","B":"Market-making activities, hedging, underwriting, and trading in government securities","C":"Trading in all fixed-income securities","D":"Trading by subsidiary entities that are not bank affiliates"},"ans":"B","exp":"The Volcker Rule has several key exemptions from its proprietary trading prohibition: (1) market-making (maintaining inventory to serve customers), (2) underwriting, (3) risk-mitigating hedging, (4) trading in U.S. government and agency securities, (5) trading on behalf of customers. These exemptions preserve essential banking functions while restricting speculative trading with bank deposits."},
{"d":"medium","sub":"FINRA","q":"Under FINRA's Communications Rules (Rule 2210), 'retail communications' are:","opts":{"A":"Communications sent to 25 or fewer retail investors","B":"Communications distributed or made available to more than 25 retail investors within any 30-day period","C":"Only television and radio advertisements","D":"Communications with clients who have been customers for less than 1 year"},"ans":"B","exp":"Rule 2210 classifies member communications into three categories: (1) Retail communications (>25 retail investors in 30 days): must be reviewed and approved by a registered principal before use; (2) Correspondence (≤25 retail investors): reviewed by principals under a sampling system; (3) Institutional communications: may be exempt from pre-use review if procedures are in place."},
{"d":"easy","sub":"Blue Sky Laws","q":"The National Securities Markets Improvement Act (NSMIA) of 1996 preempted:","opts":{"A":"All state securities laws permanently","B":"State registration requirements for 'covered securities' such as exchange-listed stocks and certain exempt offerings","C":"Federal registration requirements for small companies","D":"FINRA rules regarding broker-dealer supervision"},"ans":"B","exp":"NSMIA preempted state-level registration requirements for 'covered securities'—exchange-listed stocks, Nasdaq securities, investment company securities, and offerings under Reg D Rule 506. States retain anti-fraud authority and can still require notice filings and fees for covered securities. Non-covered offerings (Rule 504, intrastate) remain subject to state registration."},
{"d":"medium","sub":"Suitability","q":"Reg BI's 'care obligation' requires broker-dealers to:","opts":{"A":"Obtain written consent from every retail customer before making any recommendation","B":"Exercise reasonable diligence, care, and skill to understand the potential risks and rewards of a recommended strategy and that it is in the customer's best interest","C":"Ensure all recommendations are reviewed by a compliance officer before delivery","D":"Recommend only the lowest-cost available product in every category"},"ans":"B","exp":"The care obligation under Reg BI requires broker-dealers to exercise reasonable diligence, care, and skill when making recommendations: (1) understand the potential risks, rewards, and costs; (2) have a reasonable basis for concluding it is in the retail customer's best interest at the time of the recommendation; (3) consider reasonably available alternatives. It is not a requirement to always recommend the lowest-cost option."},
{"d":"easy","sub":"FINRA","q":"The '5% markup policy' is a guideline that covers:","opts":{"A":"The maximum advisory fee an investment adviser can charge","B":"Mark-ups, mark-downs, and commissions charged by broker-dealers in securities transactions","C":"The maximum sales load for mutual funds under FINRA rules","D":"The profit margin broker-dealers can earn on IPOs"},"ans":"B","exp":"FINRA's 5% policy is a guideline (not a hard rule) for mark-ups, mark-downs, and commissions in securities transactions. It provides a benchmark—exceeding 5% requires justification based on factors like the security's price, type, and the firm's costs. Commissions significantly above 5% may constitute excessive compensation."},
{"d":"medium","sub":"Securities Acts","q":"The 'Uniform Securities Act' (USA) serves as a model for:","opts":{"A":"Federal securities regulation under the SEC","B":"State-level (blue sky) securities laws—many states base their laws on some version of the USA","C":"FINRA's conduct rules for broker-dealers","D":"International securities regulation among G20 nations"},"ans":"B","exp":"The Uniform Securities Act (originally 1956, revised 2002) is a model statute developed for states to adopt for their own securities regulation (blue sky laws). It covers registration of securities, broker-dealers, and investment advisers at the state level. Many states have adopted versions of the USA, though requirements vary by state."},
{"d":"easy","sub":"FINRA","q":"FINRA administers which of the following qualification examinations?","opts":{"A":"CFA, CFP, and ChFC professional designations","B":"SIE, Series 6, Series 7, Series 63, Series 65, Series 66, and other securities industry exams","C":"Bar exam for securities lawyers","D":"CPA exam for financial statement auditors"},"ans":"B","exp":"FINRA administers securities industry qualification examinations, including the SIE (Securities Industry Essentials), Series 6 (Investment Company Products), Series 7 (General Securities), Series 24 (Principal), Series 63 (state agent), Series 65 (state investment adviser), and Series 66 (combined 63/65). These are required for registration as associated persons of broker-dealers."},
{"d":"easy","sub":"Blue Sky Laws","q":"Blue sky laws are:","opts":{"A":"SEC regulations governing offshore securities transactions","B":"State-level securities laws requiring registration of securities offerings and broker-dealers within each state","C":"Federal laws that preempt all state securities regulation","D":"FINRA rules protecting investors from speculative investments"},"ans":"B","exp":"Blue sky laws are state securities regulations (named for a judge's concern about schemes backed by 'nothing but blue sky'). Each state requires registration of securities offerings and broker-dealers operating within its borders, unless a federal exemption applies. NSMIA (1996) preempted state registration for 'covered securities' but states retain anti-fraud enforcement authority."},
{"d":"medium","sub":"AML","q":"The USA PATRIOT Act strengthened AML requirements primarily by:","opts":{"A":"Increasing the CTR threshold to $25,000","B":"Requiring financial institutions to implement Customer Identification Programs (CIP) to verify customer identity","C":"Creating the Financial Crimes Enforcement Network (FinCEN)","D":"Limiting the financial institutions covered by BSA to commercial banks only"},"ans":"B","exp":"The PATRIOT Act (2001) significantly expanded BSA/AML requirements. Its key provision: financial institutions must implement Customer Identification Programs (CIP) requiring verification of name, date of birth, address, and ID number (SSN for U.S. persons) for all new account holders. It also enhanced due diligence requirements for correspondent accounts and politically exposed persons (PEPs)."},
{"d":"medium","sub":"Regulatory Framework","q":"Regulation S-P requires broker-dealers and investment advisers to:","opts":{"A":"Report all trades in real-time to the SEC","B":"Maintain written policies protecting customer financial information and provide annual privacy notices","C":"Segregate customer funds from firm assets","D":"File quarterly financial statements with FINRA"},"ans":"B","exp":"Regulation S-P (Privacy of Consumer Financial Information) requires broker-dealers, investment advisers, and other financial institutions to: adopt policies protecting nonpublic customer financial information, provide initial and annual privacy notices to customers, and allow customers to opt out of information sharing with unaffiliated third parties."},
{"d":"medium","sub":"AML","q":"Under the PATRIOT Act's Customer Identification Program (CIP), a broker-dealer must collect which of the following for new individual accounts?","opts":{"A":"Social Security number, annual income, and net worth","B":"Name, date of birth, address, and an identification number (SSN for U.S. persons)","C":"Employment history, credit score, and investment experience","D":"References from two existing customers and a government-issued ID"},"ans":"B","exp":"CIP requires the minimum four data points: (1) Name, (2) Date of birth (for individuals), (3) Address, (4) Identification number—SSN for U.S. persons, or passport number/alien ID for non-U.S. persons. The firm must also verify this identity through documentary (ID documents) or non-documentary methods."}
],
};

const ALL_Q=[];
Object.entries(BANK).forEach(([topic,qs])=>{qs.forEach(q=>ALL_Q.push({...q,topic}));});

const state={topic:'capital',diff:'all',correct:0,total:0,answered:false,history:[],topicStats:{capital:{c:0,t:0},products:{c:0,t:0},trading:{c:0,t:0},regulatory:{c:0,t:0},all:{c:0,t:0}},usedSet:new Set(),currentQ:null};
const LABELS={capital:'Capital Markets',products:'Products & Risks',trading:'Trading & Accounts',regulatory:'Regulatory',all:'All Topics'};

document.querySelectorAll('.topic-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.topic-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.topic=btn.dataset.topic;
    state.answered=false;
    document.getElementById('topic-chip').textContent=LABELS[state.topic];
    updatePoolChip();
    showWelcome();
    document.getElementById('btn-gen').style.display='inline-block';
    document.getElementById('btn-next').style.display='none';
  });
});

function onDiffChange(){state.diff=document.getElementById('diff').value;updatePoolChip();}

function getPool(){
  let qs=state.topic==='all'?ALL_Q:ALL_Q.filter(q=>q.topic===state.topic);
  if(state.diff!=='all')qs=qs.filter(q=>q.d===state.diff);
  return qs;
}

function updatePoolChip(){document.getElementById('pool-chip').textContent=getPool().length+' in pool';}

function nextQuestion(){
  state.answered=false;
  document.getElementById('btn-gen').style.display='none';
  document.getElementById('btn-next').style.display='none';
  const pool=getPool();
  if(!pool.length){
    document.getElementById('q-area').innerHTML='<div class="state-card"><div class="icon">⚠️</div><h2>No questions available</h2><p>Try changing the difficulty or topic.</p></div>';
    document.getElementById('btn-gen').style.display='inline-block';
    return;
  }
  const key=q=>q.q.slice(0,32)+state.diff;
  let avail=pool.filter(q=>!state.usedSet.has(key(q)));
  if(!avail.length){state.usedSet.clear();avail=pool;}
  const q=avail[Math.floor(Math.random()*avail.length)];
  state.usedSet.add(key(q));
  state.currentQ=q;
  renderQ(q);
}

function renderQ(q){
  const letters=['A','B','C','D'];
  const qn=state.total+1;
  const dLabel={easy:'Foundational',medium:'Intermediate',hard:'Advanced'}[q.d];
  document.getElementById('q-area').innerHTML=`
    <div class="q-card">
      <div class="q-head"><span class="q-num">Question #${qn}</span><span class="q-tag">${q.sub} · ${dLabel}</span></div>
      <div class="q-body">
        <div class="q-text">${q.q}</div>
        <div class="options">${letters.map(l=>`
          <div class="opt" id="opt-${l}" onclick="pick('${l}')">
            <div class="opt-letter">${l}</div>
            <div class="opt-text">${q.opts[l]}</div>
          </div>`).join('')}
        </div>
        <div class="explanation" id="expl"><strong>Explanation:</strong> ${q.exp}</div>
      </div>
      <div class="q-foot"><div id="badge"></div><span class="foot-hint" id="foot-hint">Select an answer to continue</span></div>
    </div>`;
}

function pick(chosen){
  if(state.answered)return;
  state.answered=true;
  const q=state.currentQ;
  const correct=q.ans;
  const isRight=chosen===correct;
  state.total++;
  if(isRight)state.correct++;
  state.topicStats[state.topic].t++;
  if(isRight)state.topicStats[state.topic].c++;
  if(state.topic==='all'){state.topicStats[q.topic].t++;if(isRight)state.topicStats[q.topic].c++;}
  ['A','B','C','D'].forEach(l=>{
    const el=document.getElementById('opt-'+l);
    if(!el)return;
    el.classList.add('locked');
    if(l===correct)el.classList.add('correct');
    else if(l===chosen&&!isRight)el.classList.add('wrong');
  });
  document.getElementById('expl').classList.add('show');
  document.getElementById('badge').innerHTML=isRight
    ?'<span class="result-badge badge-correct">✓ Correct</span>'
    :`<span class="result-badge badge-wrong">✗ Incorrect · Answer: ${correct}</span>`;
  document.getElementById('foot-hint').textContent='';
  state.history.push(isRight);
  updateStats();
  document.getElementById('btn-next').style.display='inline-block';
}

function updateStats(){
  document.getElementById('s-correct').textContent=state.correct;
  document.getElementById('s-total').textContent=state.total;
  const pct=state.total>0?Math.round((state.correct/state.total)*100):null;
  document.getElementById('s-pct').textContent=pct!==null?pct+'%':'—';
  document.getElementById('prog-fill').style.width=(pct||0)+'%';
  document.getElementById('prog-pct').textContent=pct!==null?pct+'% acc.':'—';
  const recent=state.history.slice(-16);
  document.getElementById('hist-dots').innerHTML=recent.map(h=>`<div class="h-dot${h?'':' w'}"></div>`).join('');
  ['capital','products','trading','regulatory','all'].forEach(k=>{
    const el=document.getElementById('ts-'+k);
    if(!el)return;
    const s=state.topicStats[k];
    el.textContent=s.t>0?`${s.c} / ${s.t} correct`:'0 / 0 correct';
  });
}

function showWelcome(){
  document.getElementById('q-area').innerHTML=`
    <div class="state-card"><div class="icon">📋</div><h2>Ready when you are</h2>
    <p>Hit <strong>Generate Question</strong> to drill <em>${LABELS[state.topic]}</em>.</p>
    <button class="btn-primary" onclick="nextQuestion()">▶ Start Drilling</button></div>`;
}

updatePoolChip();
</script>
