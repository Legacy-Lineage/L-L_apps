{"d":"medium","sub":"Market Structure","q":"The 'price discovery' function of markets refers to:","opts":{"A":"The SEC setting fair prices for all securities","B":"The process by which buyers and sellers interact to determine the market price of a security through supply and demand","C":"The calculation of a bond's theoretical value using discounted cash flows","D":"The use of technical analysis to predict future prices"},"ans":"B","exp":"Price discovery is the process through which the interaction of buyers and sellers in a market determines the equilibrium price of a security. Liquid, transparent markets (like major stock exchanges) are said to have good price discovery. Dark pools and illiquid markets have less efficient price discovery."},
{"d":"medium","sub":"Economic Indicators","q":"If the yield curve inverts and short-term rates exceed long-term rates, this typically signals the market expects:","opts":{"A":"Rising inflation and higher long-term rates ahead","B":"The Fed to cut rates in the future as the economy slows or enters recession","C":"Strong GDP growth for the next several years","D":"The government to reduce its borrowing in the near future"},"ans":"B","exp":"An inverted yield curve generally reflects the market's expectation that short-term rates (which the Fed controls) will fall in the future as the economy slows or enters recession, prompting the Fed to cut rates. Investors accept lower long-term yields because they expect short-term rates to fall—making current long-term rates attractive even at low levels."},
{"d":"hard","sub":"Market Participants","q":"A 'custodian' vs. a 'broker-dealer' key difference is:","opts":{"A":"Custodians can execute trades; broker-dealers cannot hold securities","B":"Custodians hold and safeguard assets; broker-dealers execute trades (though many large institutions do both)","C":"Custodians are regulated by FINRA; broker-dealers by the SEC only","D":"There is no regulatory distinction between the two functions"},"ans":"B","exp":"Custodians primarily safeguard assets—holding securities, processing corporate actions, and maintaining records. Broker-dealers primarily execute trades. In practice, many large financial institutions perform both functions. Separately, independent custodians (like Schwab, Fidelity) often service RIA clients to maintain the adviser's separation from client assets."},
{"d":"easy","sub":"Money Markets","q":"Treasury bills differ from Treasury notes in that:","opts":{"A":"T-bills pay semiannual coupon interest; T-notes do not","B":"T-bills have maturities of one year or less and are sold at a discount; T-notes have 2-10 year maturities and pay semiannual coupons","C":"T-bills are backed by the full faith and credit of the U.S.; T-notes are not","D":"T-notes are issued by the Federal Reserve; T-bills by the Treasury"},"ans":"B","exp":"Treasury bills (T-bills): maturities up to 52 weeks, issued at a discount (no coupon—return is the difference between purchase price and par at maturity). Treasury notes: 2, 3, 5, 7, or 10 year maturities, pay semiannual coupon interest. Both are direct obligations of the U.S. government."},
{"d":"medium","sub":"Capital Markets","q":"A 'rights offering' subscription right that is not exercised by its expiration:","opts":{"A":"Automatically converts to common shares","B":"Expires worthless—the right loses all value after the expiration date","C":"Converts to warrants with a 5-year exercise period","D":"Is automatically exercised by the broker-dealer on the shareholder's behalf"},"ans":"B","exp":"Rights have a short expiration (typically 2-6 weeks). If not exercised or sold before expiration, they expire worthless. Shareholders who don't want to exercise their rights can sell them in the secondary market (rights are tradable until expiration) to receive their economic value."},
{"d":"medium","sub":"International","q":"When U.S. interest rates rise relative to foreign rates, the effect on the U.S. dollar is typically:","opts":{"A":"The dollar weakens as investors prefer foreign bonds","B":"The dollar strengthens as foreign investors buy U.S. dollar assets to take advantage of higher yields","C":"No effect—exchange rates are determined only by trade flows","D":"The dollar weakens because higher rates indicate inflation concerns"},"ans":"B","exp":"Rising U.S. interest rates attract foreign capital seeking higher yields. Foreign investors must buy U.S. dollars to purchase U.S. bonds or deposits, increasing demand for dollars and appreciating the currency. This is one channel through which monetary policy affects exchange rates and trade competitiveness."},
{"d":"hard","sub":"Capital Markets","q":"The 'no-action letter' process at the SEC is relevant to practitioners because:","opts":{"A":"It provides binding legal precedent equivalent to court rulings","B":"It gives practical guidance on how SEC staff will treat novel transactions or activities, even though it lacks the force of law","C":"It is required before any securities offering can proceed","D":"It exempts transactions from all state securities laws permanently"},"ans":"B","exp":"No-action letters provide practical (if non-binding) guidance from SEC staff on whether they would recommend enforcement for a described activity. They help practitioners navigate ambiguous areas of law and are frequently cited in legal analysis. They express staff views, not the Commission's official legal position."},
{"d":"easy","sub":"Market Structure","q":"In a securities market, 'liquidity' refers to:","opts":{"A":"The cash reserves held by broker-dealers","B":"The ability to buy or sell an asset quickly at a price close to its fair value","C":"The credit available to investors through margin accounts","D":"The total dollar volume of trades in a given day"},"ans":"B","exp":"Liquidity describes how easily an asset can be bought or sold without significantly affecting its price. Highly liquid assets (large-cap stocks, Treasuries) have tight spreads and high volume. Illiquid assets (small-cap stocks, real estate, private investments) may require large price concessions to sell quickly."},
{"d":"medium","sub":"Federal Reserve","q":"'Monetary policy' differs from 'fiscal policy' in that:","opts":{"A":"Monetary policy is set by Congress; fiscal policy by the Federal Reserve","B":"Monetary policy involves managing the money supply and interest rates (Federal Reserve); fiscal policy involves government taxing and spending (Congress/Administration)","C":"Fiscal policy controls inflation only; monetary policy controls unemployment only","D":"They are effectively the same thing under the dual mandate"},"ans":"B","exp":"Monetary policy (Fed) uses tools like open market operations, discount rate, and IORB to manage money supply and interest rates, targeting employment and price stability. Fiscal policy (Congress/Administration) uses government spending and taxation. Both influence the economy but through different mechanisms and with different lags."},
{"d":"easy","sub":"Capital Markets","q":"'Accrued interest' is relevant when buying bonds because:","opts":{"A":"It is a penalty for purchasing bonds on the secondary market","B":"The buyer compensates the seller for interest earned since the last coupon payment","C":"It represents dividends that have not yet been paid","D":"It is the interest owed to the broker-dealer for margin"},"ans":"B","exp":"When buying a bond between coupon dates, the buyer pays the market price PLUS accrued interest—the interest that has built up since the last coupon payment. The buyer then receives the full next coupon, which repays the accrued interest paid. This ensures fair compensation for the seller who held the bond and earned that interest."},
{"d":"medium","sub":"Market Structure","q":"The 'consolidated tape' in securities markets refers to:","opts":{"A":"A physical tape machine that prints stock prices","B":"A real-time data feed showing all trades in listed securities across all U.S. exchanges and ATSs","C":"The SEC's database of all registered securities","D":"A FINRA system for tracking broker-dealer violations"},"ans":"B","exp":"The consolidated tape (now electronic) collects and disseminates last-sale information (price and volume) for all trades in listed securities from all exchanges and ATSs. Investors see the full national picture of where trades are occurring, not just data from a single exchange. Tape A covers NYSE-listed stocks; Tape B covers NYSE American-listed; Tape C covers Nasdaq-listed."},
{"d":"medium","sub":"Capital Markets","q":"The 'primary market' vs 'secondary market' distinction matters because:","opts":{"A":"Only professional investors may participate in primary markets","B":"In the primary market, proceeds go to the issuer (raising capital); in the secondary market, proceeds go to the selling investor","C":"Tax treatment differs for all primary vs secondary market transactions","D":"Secondary market securities are always lower quality than primary market offerings"},"ans":"B","exp":"This distinction is fundamental: primary market transactions raise capital for issuers (companies or governments sell new securities). Secondary market transactions transfer ownership between investors with no proceeds going to the issuer. When you buy Apple stock on the NYSE, Apple gets no money—the selling investor does."},
{"d":"hard","sub":"Federal Reserve","q":"The 'neutral rate' of interest refers to:","opts":{"A":"The rate at which all banks charge each other","B":"The hypothetical interest rate that neither stimulates nor restrains economic growth—a benchmark for monetary policy","C":"The rate set by international agreement between central banks","D":"The average of all developed country central bank rates"},"ans":"B","exp":"The neutral (or natural) rate of interest is the theoretical rate consistent with the economy at full employment and stable inflation—neither expansionary nor contractionary. When the Fed sets rates below neutral, policy is stimulative; above neutral, it is restrictive. The neutral rate is unobservable and must be estimated, making it a subject of constant debate."},
{"d":"easy","sub":"Market Participants","q":"The role of an 'introducing broker' is to:","opts":{"A":"Act as the clearing firm for all trades","B":"Maintain client relationships and execute orders while outsourcing clearing and settlement to a clearing firm","C":"Introduce new companies to the stock exchange for listing","D":"Regulate other broker-dealers on behalf of FINRA"},"ans":"B","exp":"Introducing brokers (or correspondent firms) maintain customer accounts, solicit business, and execute trades, but contract with a clearing broker-dealer to handle settlement, custody, margin lending, and record-keeping. This allows smaller firms to offer full brokerage services without the infrastructure of a clearing operation."},
{"d":"medium","sub":"Market Structure","q":"A 'market order' compared to a 'limit order':","opts":{"A":"A market order guarantees a specific price; a limit order guarantees execution","B":"A market order guarantees execution but not price; a limit order guarantees price but not execution","C":"There is no practical difference in liquid markets","D":"Market orders are only available to institutional investors"},"ans":"B","exp":"Key trade-off: market orders guarantee execution at the best available price (no price guarantee). Limit orders guarantee the price (or better) but may not be executed if the market never reaches the limit price. In illiquid markets, the distinction becomes critical—market orders can execute far from the expected price."},
{"d":"hard","sub":"Economic Indicators","q":"The 'balance of payments' identity states that:","opts":{"A":"Exports must equal imports in every fiscal year","B":"Current account + Capital account + Financial account = 0 (approximately)","C":"The government budget must balance the trade deficit","D":"The central bank must finance any current account deficit directly"},"ans":"B","exp":"The balance of payments identity: Current Account + Capital Account + Financial Account + Errors and Omissions = 0. A current account deficit must be financed by a corresponding capital/financial account surplus (foreign investment in the deficit country) or by drawing down official reserves. The sum of all accounts must balance."},
{"d":"easy","sub":"Capital Markets","q":"In a securities offering, the 'underwriting syndicate' refers to:","opts":{"A":"The group of institutional investors who buy all shares in an IPO","B":"A group of investment banks that join together to distribute a large securities offering, sharing risk and selling responsibilities","C":"The SEC committee that reviews and approves new offerings","D":"The team of lawyers who write the registration statement"},"ans":"B","exp":"An underwriting syndicate is a temporary group of investment banks formed to distribute a large securities offering that a single bank might not be able to sell alone. The managing underwriter leads the syndicate; other members commit to selling a specified portion. This spreads both the distribution risk and the financial exposure among multiple banks."}
],
products:[
{d:"easy",sub:"Equity",q:"Common stockholders have which right?",opts:{A:"Guaranteed quarterly dividends",B:"Preference over creditors in liquidation",C:"Voting rights on major corporate decisions",D:"Priority over preferred stockholders in dividend payments"},ans:"C",exp:"Common stockholders typically have the right to vote on major corporate decisions, including electing the board of directors. They are last in line for dividends and liquidation proceeds."},
{d:"easy",sub:"Equity",q:"Which type of preferred stock accumulates unpaid dividends that must be paid before common stockholders receive any dividends?",opts:{A:"Participating preferred",B:"Callable preferred",C:"Convertible preferred",D:"Cumulative preferred"},ans:"D",exp:"Cumulative preferred stock requires that any unpaid dividends from prior periods (dividends in arrears) must be paid to preferred stockholders before common stockholders receive any dividends."},
{d:"easy",sub:"Equity",q:"A 2-for-1 stock split on 100 shares at $80 results in:",opts:{A:"100 shares worth $160 each",B:"200 shares worth $40 each",C:"50 shares worth $160 each",D:"200 shares worth $80 each"},ans:"B",exp:"In a 2-for-1 stock split, the number of shares doubles and the price per share is halved. 100 shares at $80 becomes 200 shares at $40. Total market value is unchanged at $8,000."},
{d:"easy",sub:"Equity",q:"When a company repurchases its own shares on the open market, those shares become:",opts:{A:"Authorized shares",B:"Outstanding shares",C:"Treasury shares",D:"Restricted shares"},ans:"C",exp:"When a company buys back its own shares, they become treasury shares. They are no longer outstanding (not entitled to dividends or voting rights) but remain authorized. The company may reissue or retire them."},
{d:"easy",sub:"Equity",q:"The ex-dividend date is:",opts:{A:"The date the dividend is paid",B:"The date the board declares a dividend",C:"The first date on which a buyer of the stock will NOT receive the upcoming dividend",D:"The record date for dividend eligibility"},ans:"C",exp:"On and after the ex-dividend date, buyers do not receive the upcoming dividend. To receive it, investors must buy before the ex-date. The stock price typically drops by approximately the dividend amount on the ex-date."},
{d:"easy",sub:"Debt Securities",q:"A bond's coupon rate is:",opts:{A:"The yield earned if held to maturity",B:"The annual interest payment as a percentage of the bond's face value",C:"The current market yield based on the bond's current price",D:"The rate of return after adjusting for inflation"},ans:"B",exp:"The coupon rate is the stated annual interest rate on a bond, expressed as a percentage of its face (par) value. A $1,000 bond with a 5% coupon pays $50 per year (typically $25 every six months)."},
{d:"easy",sub:"Debt Securities",q:"When a bond trades at a discount, its:",opts:{A:"Coupon rate exceeds its yield to maturity",B:"Market price is below its face value",C:"Credit rating has been upgraded",D:"Maturity has been extended"},ans:"B",exp:"A bond trades at a discount when its market price is below par ($1,000). This happens when interest rates have risen above the coupon rate, making the bond's fixed payments less attractive than newly issued bonds."},
{d:"easy",sub:"Debt Securities",q:"Treasury STRIPS are:",opts:{A:"Zero-coupon securities created by separating interest and principal payments of Treasury bonds",B:"Short-term Treasury bills issued at a discount",C:"Inflation-protected Treasury securities",D:"Treasury securities issued in foreign currencies"},ans:"A",exp:"STRIPS (Separate Trading of Registered Interest and Principal of Securities) are created by separating a Treasury bond's coupon payments and principal into individual zero-coupon securities, each with its own maturity date."},
{d:"easy",sub:"Debt Securities",q:"A general obligation (GO) bond is backed by:",opts:{A:"Revenue from a specific project",B:"The full faith, credit, and taxing power of the issuing government",C:"Federal government guarantees",D:"The assets of a public authority"},ans:"B",exp:"GO bonds are backed by the issuer's unlimited or limited taxing power and are generally considered safer than revenue bonds, which are backed only by revenue from a specific project."},
{d:"easy",sub:"Debt Securities",q:"Corporate bond interest payments are taxed:",opts:{A:"Exempt from all federal and state taxes",B:"Fully at the federal, state, and local level as ordinary income",C:"Exempt from state and local taxes only",D:"As capital gains"},ans:"B",exp:"Corporate bond interest is fully taxable at the federal, state, and local level as ordinary income, unlike Treasury bonds (exempt from state/local) and most municipal bonds (exempt from federal tax)."},
{d:"easy",sub:"Options",q:"A put option gives the holder the right to:",opts:{A:"Buy the underlying security at the strike price",B:"Sell the underlying security at the strike price",C:"Receive dividends from the underlying stock",D:"Convert the option into common shares"},ans:"B",exp:"A put option gives the buyer the right but not the obligation to sell the underlying security at the specified strike price before expiration. Put buyers profit when the underlying price falls below the strike."},
{d:"easy",sub:"Options",q:"The premium of an option is:",opts:{A:"The difference between strike price and market price",B:"The price paid by the buyer to acquire the option contract",C:"The annual return on the option",D:"The fee charged by the options exchange"},ans:"B",exp:"The option premium is the price the buyer pays (and seller receives) for the rights conveyed by the option. It is determined by the underlying price, strike price, time to expiration, and implied volatility."},
{d:"easy",sub:"Options",q:"A covered call involves:",opts:{A:"Buying a call to hedge a short position",B:"Selling a call against shares already owned",C:"Selling a call without owning the underlying shares",D:"Purchasing a put to protect a long stock position"},ans:"B",exp:"A covered call involves owning the underlying shares and selling a call option against that position. The investor collects the premium but caps upside gain. 'Covered' means the short call is backed by owned shares."},
{d:"easy",sub:"Options",q:"For a long call, the breakeven price at expiration is:",opts:{A:"Strike price minus the premium",B:"Strike price plus the premium",C:"Current stock price plus the premium",D:"Current stock price minus the premium"},ans:"B",exp:"A long call buyer breaks even when the stock price equals the strike price plus the premium paid. At that price, the gain from exercising exactly offsets the premium cost. Above it, the call is profitable."},
{d:"easy",sub:"Investment Companies",q:"Which type of investment company continuously issues and redeems shares at NAV?",opts:{A:"Closed-end fund",B:"Open-end fund (mutual fund)",C:"Exchange-traded fund",D:"Unit investment trust"},ans:"B",exp:"Open-end mutual funds continuously issue new shares to buyers and redeem shares from sellers at NAV, calculated at the end of each trading day."},
{d:"easy",sub:"Investment Companies",q:"The expense ratio of a mutual fund represents:",opts:{A:"The sales charge paid when purchasing shares",B:"Annual operating costs as a percentage of average net assets",C:"The redemption fee charged when selling shares",D:"The fund's total return minus inflation"},ans:"B",exp:"The expense ratio covers the fund's annual operating costs (management fees, administrative fees, etc.) as a percentage of average net assets. It directly reduces the fund's return to investors."},
{d:"easy",sub:"Investment Companies",q:"A 'no-load' mutual fund means:",opts:{A:"It has no annual management fees",B:"It charges no sales commissions when buying or selling shares",C:"It only invests in debt securities",D:"It has no minimum investment"},ans:"B",exp:"A no-load fund charges no sales commission (load) when shares are purchased or redeemed. However, no-load funds still have annual operating expenses (expense ratio)."},
{d:"easy",sub:"Annuities",q:"In a fixed annuity, the insurance company assumes:",opts:{A:"Mortality risk only",B:"Investment risk, guaranteeing a specific rate of return",C:"Inflation risk for the policyholder",D:"Liquidity risk on behalf of the annuitant"},ans:"B",exp:"In a fixed annuity, the insurance company guarantees a fixed rate of return and assumes the investment risk. The policyholder receives a predictable income stream regardless of how underlying investments perform."},
{d:"easy",sub:"Real Estate",q:"REITs must distribute at least what percentage of taxable income to shareholders?",opts:{A:"50%",B:"75%",C:"90%",D:"100%"},ans:"C",exp:"To qualify for pass-through tax treatment (avoiding corporate income tax), REITs must distribute at least 90% of their taxable income to shareholders as dividends annually."},
{d:"easy",sub:"Derivatives",q:"A futures contract differs from an options contract in that futures contracts:",opts:{A:"Can only be traded on regulated exchanges",B:"Obligate both buyer and seller to complete the transaction",C:"Give the buyer a right but not an obligation",D:"Are only available for agricultural commodities"},ans:"B",exp:"Futures are binding on both parties; both buyer and seller are obligated to complete the transaction. Options give the buyer a right without obligation (the seller is obligated only if the buyer exercises)."},
{d:"medium",sub:"Equity",q:"A rights offering allows existing shareholders to:",opts:{A:"Sell their shares back at a premium",B:"Purchase additional shares at a discount to market price before the public can",C:"Convert shares into bonds",D:"Receive dividends as additional shares"},ans:"B",exp:"A rights offering gives existing shareholders the preemptive right to purchase additional shares at a discount to market price before new shares are offered publicly, allowing them to maintain proportional ownership."},
{d:"medium",sub:"Equity",q:"Convertible preferred stock that is 'in the money' means:",opts:{A:"The preferred dividend exceeds the common dividend",B:"The conversion value of the common stock received exceeds the preferred stock's cost",C:"The issuer may call the preferred at any time",D:"The preferred stock's yield exceeds the market interest rate"},ans:"B",exp:"Convertible preferred is 'in the money' when the value of common stock received upon conversion exceeds the cost of the preferred. Investors generally convert in this scenario, unless yield considerations favor holding preferred."},
{d:"medium",sub:"Debt Securities",q:"A bond's yield to maturity (YTM) accounts for:",opts:{A:"Only the annual coupon payments",B:"Coupon payments, price difference from par, and time remaining to maturity",C:"Only the capital gain or loss if held to maturity",D:"The after-tax return on the bond"},ans:"B",exp:"YTM is the total return anticipated on a bond if held to maturity, accounting for the current market price, coupon payments, par value, and time to maturity. It is the most comprehensive measure of a bond's return."},
{d:"medium",sub:"Debt Securities",q:"Which bond would have the LONGEST duration?",opts:{A:"A 30-year zero-coupon bond",B:"A 30-year 8% coupon bond",C:"A 10-year zero-coupon bond",D:"A 10-year 8% coupon bond"},ans:"A",exp:"Duration measures interest rate sensitivity. Zero-coupon bonds have higher duration than coupon bonds of the same maturity. Longer maturities also mean higher duration. A 30-year zero-coupon bond has the highest duration of these choices."},
{d:"medium",sub:"Debt Securities",q:"An investor buys a 6% coupon bond when market rates are 4%. The bond is most likely trading:",opts:{A:"At a discount to par",B:"At par",C:"At a premium to par",D:"At its call price"},ans:"C",exp:"When market rates (4%) are below the coupon rate (6%), the bond's above-market coupon payments are more valuable, so investors bid up the price above par. The bond trades at a premium."},
{d:"medium",sub:"Debt Securities",q:"TIPS provide inflation protection by:",opts:{A:"Adjusting the coupon rate when inflation rises",B:"Adjusting the principal value based on changes in the CPI",C:"Paying a fixed premium above regular Treasury rates",D:"Guaranteeing a fixed real return regardless of deflation"},ans:"B",exp:"TIPS adjust the principal up with inflation (CPI increases) and down with deflation. The coupon rate is fixed, but applied to the adjusted principal, so actual dollar interest changes with inflation. At maturity, investors receive the greater of original or adjusted principal."},
{d:"medium",sub:"Options",q:"An investor buys 1 XYZ Oct 50 put at $4 when XYZ is at $48. Maximum profit is:",opts:{A:"$4",B:"$400",C:"$4,600",D:"$5,000"},ans:"C",exp:"Maximum profit for a long put = (strike - premium) x 100 = ($50 - $4) x 100 = $4,600. This occurs if the stock goes to zero. Breakeven is $46; max loss is $400 (the premium paid)."},
{d:"medium",sub:"Options",q:"A short straddle involves:",opts:{A:"Buying a call and a put at the same strike and expiration",B:"Selling a call and a put at the same strike and expiration",C:"Buying a call and put at different strikes",D:"Selling a call and buying a put at the same strike"},ans:"B",exp:"A short straddle involves selling both a call and put at the same strike and expiration. The seller collects both premiums but faces theoretically unlimited upside risk (short call) and substantial downside risk (short put). It profits when the stock stays near the strike."},
{d:"medium",sub:"Investment Companies",q:"A closed-end fund differs from an open-end fund in that closed-end funds:",opts:{A:"Cannot invest in foreign securities",B:"Issue a fixed number of shares that trade on exchanges at prices that may differ from NAV",C:"Must redeem shares at NAV within 7 days",D:"Are not regulated by the Investment Company Act"},ans:"B",exp:"Closed-end funds issue a fixed number of shares through an IPO and then trade on exchanges like stocks. Their market price is determined by supply and demand and may trade at a premium or discount to NAV."},
{d:"medium",sub:"Municipal Securities",q:"The tax equivalent yield of a municipal bond shows:",opts:{A:"The after-tax yield of a corporate bond",B:"The yield a taxable bond must offer to equal the after-tax return of the tax-exempt municipal bond",C:"The real inflation-adjusted return on a muni",D:"How to compare munis across different states"},ans:"B",exp:"Tax equivalent yield = Muni yield / (1 - tax rate). It shows what a taxable bond would need to yield to match a muni's after-tax return. Higher-bracket investors benefit more from munis."},
{d:"medium",sub:"Annuities",q:"For withdrawals from a non-qualified annuity, the IRS uses which treatment?",opts:{A:"FIFO: principal comes out first, then earnings",B:"LIFO: earnings come out first and are taxed as ordinary income",C:"All withdrawals are taxed as capital gains",D:"Withdrawals are tax-free after age 59.5"},ans:"B",exp:"For non-qualified annuities (funded with after-tax money), the IRS uses LIFO treatment: withdrawals come from earnings first (taxable as ordinary income) until all earnings are withdrawn, then from principal (tax-free return of basis). A 10% penalty applies to earnings before age 59.5."},
{d:"hard",sub:"Equity",q:"Under the preemptive right, existing shareholders have the right to maintain proportional ownership. What would MOST directly trigger a preemptive right?",opts:{A:"A stock dividend distributed to existing shareholders",B:"A secondary offering of existing shares by major shareholders",C:"A primary offering of newly authorized shares",D:"A stock split approved by the board"},ans:"C",exp:"Preemptive rights apply when a company issues new (primary) shares, which would dilute existing shareholders' ownership. Stock dividends and splits change share counts without diluting ownership; secondary offerings involve existing shares, not new issuances."},
{d:"hard",sub:"Debt Securities",q:"Which correctly describes 'convexity' in bond pricing?",opts:{A:"The linear relationship between bond price and yield",B:"The measure accounting for the curvature in the price-yield relationship, improving duration's estimate for large yield movements",C:"The tendency of bonds to converge to par at maturity",D:"The relationship between coupon rate and yield to maturity"},ans:"B",exp:"Duration provides a linear approximation of price changes for small yield moves. Convexity captures the curvature of the actual price-yield relationship, improving price change estimates for larger yield movements. Positive convexity means the bond gains more than duration predicts when yields fall."},
{d:"hard",sub:"Options",q:"An investor writes 1 XYZ Jan 60 call (naked) at $3. XYZ rises to $80. What is the net loss per share?",opts:{A:"$3",B:"$17",C:"$20",D:"$23"},ans:"B",exp:"The naked call seller must deliver shares at $60 when XYZ is at $80: a $20/share loss. But the $3 premium collected offsets this, so net loss = $20 - $3 = $17 per share ($1,700 per contract)."},
{d:"hard",sub:"Options",q:"The 'delta' of an option measures:",opts:{A:"The change in option price for a 1% change in implied volatility",B:"The rate of time decay per day",C:"The change in option price for a $1 change in the underlying stock price",D:"The probability that the option expires in the money at expiration"},ans:"C",exp:"Delta measures the sensitivity of an option's price to a $1 change in the underlying. A call with delta 0.60 increases approximately $0.60 for every $1 increase in the stock. Delta also approximates the probability of expiring in the money."},
{d:"hard",sub:"Debt Securities",q:"A callable bond offers a higher yield than an equivalent non-callable bond because:",opts:{A:"Callable bonds have lower credit quality",B:"Investors require compensation for reinvestment risk and the risk of having the bond called away in a favorable rate environment",C:"The issuer must pay a premium for the right to issue the bond",D:"Callable bonds have longer maturities"},ans:"B",exp:"The call option benefits the issuer and disadvantages investors (who lose a high-coupon bond when rates fall, forced to reinvest at lower rates). Investors demand higher yield (call premium) to compensate for surrendering this option to the issuer."},
{d:"easy",sub:"Equity",q:"What is a 'blue chip' stock?",opts:{A:"Stocks of newly public companies with high growth potential",B:"Shares of small-cap companies in emerging sectors",C:"Shares of large, well-established companies with a long history of stable earnings and dividends",D:"Government bonds converted into equity instruments"},ans:"C",exp:"Blue chip stocks are shares of large, financially sound, well-established companies with a long track record of stable earnings, dividends, and reliable performance through economic cycles (e.g., IBM, Coca-Cola, Johnson & Johnson)."},
{d:"easy",sub:"Equity",q:"A 'cyclical' stock typically:",opts:{A:"Performs well regardless of economic conditions",B:"Moves in the opposite direction of the overall economy",C:"Performs well when the economy is expanding and poorly during recessions",D:"Pays dividends that increase each year automatically"},ans:"C",exp:"Cyclical stocks are tied closely to the economic cycle—they tend to perform well when GDP is growing (consumer spending increases) and poorly during recessions. Examples include auto manufacturers, airlines, luxury goods, and homebuilders."},
{d:"easy",sub:"Debt Securities",q:"Which of the following correctly ranks bond types from highest to lowest priority in liquidation?",opts:{A:"Debentures, mortgage bonds, subordinated debentures",B:"Mortgage bonds, debentures, subordinated debentures",C:"Subordinated debentures, debentures, mortgage bonds",D:"All bonds have equal priority in liquidation"},ans:"B",exp:"In liquidation, secured creditors (like mortgage bondholders) have priority over unsecured creditors (debentures), who have priority over subordinated debenture holders. Common stockholders are paid last, with preferred stockholders before them."},
{d:"easy",sub:"Debt Securities",q:"A bond's 'current yield' is calculated as:",opts:{A:"Annual coupon payment divided by the bond's face value",B:"Annual coupon payment divided by the bond's current market price",C:"Yield to maturity adjusted for taxes",D:"The bond's coupon rate minus the inflation rate"},ans:"B",exp:"Current yield = Annual coupon / Current market price. It measures the income return on the current price but does not account for the difference between purchase price and par value at maturity (which YTM captures). Current yield > coupon rate when bond trades at a discount; < coupon rate at a premium."},
{d:"easy",sub:"Mutual Funds",q:"A mutual fund's 'total return' includes:",opts:{A:"Only dividends paid by the fund",B:"Only capital gains distributions",C:"Dividends, capital gains distributions, and changes in NAV",D:"NAV changes only, net of expenses"},ans:"C",exp:"Total return captures all components of investment return: income (dividends), capital gains distributions, and appreciation (or depreciation) in NAV. It is the most comprehensive measure of fund performance."},
{d:"medium",sub:"Equity",q:"What is a 'defensive' stock?",opts:{A:"A stock issued by a defense contractor",B:"A stock that tends to maintain its value or perform relatively well during economic downturns",C:"A stock with no volatility regardless of market conditions",D:"A stock that hedges inflation automatically"},ans:"B",exp:"Defensive stocks are in industries where demand remains relatively stable regardless of economic conditions—such as utilities, consumer staples (food, beverages, household products), and healthcare. They tend to be more resilient during recessions but may underperform in bull markets."},
{d:"medium",sub:"Debt Securities",q:"Which of the following is a characteristic of a 'floating rate' note?",opts:{A:"The coupon rate is fixed for the life of the bond",B:"The coupon rate adjusts periodically based on a reference rate such as SOFR or the prime rate",C:"The bond's principal value adjusts with inflation",D:"The bond is convertible into equity at the investor's option"},ans:"B",exp:"Floating rate notes have coupon rates that reset periodically (monthly, quarterly, semi-annually) based on a benchmark rate (e.g., SOFR, Treasury bill rate) plus a spread. They offer protection against rising interest rates, since the coupon increases when rates rise."},
{d:"medium",sub:"Options",q:"An investor who believes a stock will remain flat or rise slightly would best benefit from which options strategy?",opts:{A:"Buying a long straddle",B:"Buying a long put",C:"Writing (selling) a covered call",D:"Buying a long call"},ans:"C",exp:"Writing a covered call generates income (premium) and is most profitable when the stock stays flat or rises modestly. If the stock remains below the strike, the investor keeps both the stock and the premium. If it rises above the strike, the stock may be called away but at a profitable price."},
{d:"medium",sub:"Investment Companies",q:"A 'load' on a mutual fund is a:",opts:{A:"Fee charged by the fund to redeem shares before a minimum holding period",B:"Sales charge paid either at purchase (front-end) or redemption (back-end)",C:"Penalty for exceeding the fund's minimum investment",D:"Charge for reinvesting dividends automatically"},ans:"B",exp:"A load is a sales commission on mutual fund shares. A front-end load is charged at purchase (reduces initial investment); a back-end load (contingent deferred sales charge) is charged at redemption and often declines over time. No-load funds have neither type of sales charge."},
{d:"medium",sub:"Annuities",q:"Annuity 'annuitization' means:",opts:{A:"Surrendering the contract for its cash value",B:"Converting the accumulated value into a stream of income payments",C:"Reinvesting dividends within the annuity",D:"Transferring the annuity to a different insurance company"},ans:"B",exp:"Annuitization is the process of converting an annuity's accumulated value into a series of periodic income payments. Once annuitized, the contract terms are usually irrevocable. Payment options include life only, life with period certain, and joint and survivor."},
{d:"hard",sub:"Equity",q:"A company has 1 million shares outstanding at $50. It repurchases 100,000 shares. If earnings remain $5 million, what happens to EPS?",opts:{A:"EPS decreases from $5 to $4.50",B:"EPS increases from $5 to approximately $5.56",C:"EPS remains $5 since total earnings are unchanged",D:"EPS decreases because the company spent cash on buybacks"},ans:"B",exp:"Original EPS = $5M / 1M shares = $5.00. After buyback: $5M / 900,000 shares = $5.56. Share repurchases reduce the share count while maintaining (or slightly reducing) earnings, thus increasing EPS. This is one reason companies buy back stock—to boost per-share metrics."},
{d:"hard",sub:"Debt Securities",q:"When comparing two bonds with the same maturity and credit quality, which will have higher price volatility (duration)?",opts:{A:"The bond with the higher coupon rate",B:"The bond with the lower coupon rate",C:"They will have identical price volatility since they have the same maturity",D:"The bond with the higher yield to maturity"},ans:"B",exp:"A lower coupon bond receives less cash flow early in its life, making more of its value dependent on the distant par payment. This increases duration (and price sensitivity to interest rate changes). A zero-coupon bond has the highest duration for any given maturity."},
{d:"hard",sub:"Municipal Securities",q:"A 'moral obligation' bond is a municipal bond that:",opts:{A:"Is backed only by the issuer's promise to repay with no legal obligation",B:"Has a non-binding pledge from the state legislature to appropriate funds if revenues are insufficient, but no legal requirement to do so",C:"Is guaranteed by the federal government through moral suasion",D:"Is backed by the taxing authority of the municipality"},ans:"B",exp:"A moral obligation bond carries a non-legally-binding legislative pledge to appropriate funds if revenues prove insufficient. The state legislature is not legally obligated to honor this pledge, creating additional risk compared to a full faith and credit bond or a revenue bond backed by robust revenues."},

,
{"d":"easy","sub":"Debt Securities","q":"A bond trading above its face (par) value is trading at:","opts":{"A":"A discount","B":"Par","C":"A premium","D":"Accrued interest"},"ans":"C","exp":"A bond trades at a premium when its coupon rate exceeds prevailing market interest rates, making it more attractive. The market price rises above par to reduce the effective yield to market rates."},
{"d":"easy","sub":"Debt Securities","q":"Municipal bond interest is generally:","opts":{"A":"Fully taxable at all levels","B":"Exempt from federal income tax and often from state/local taxes in the issuing state","C":"Subject to AMT for all investors","D":"Taxable only at the federal level"},"ans":"B","exp":"Municipal bond interest is generally exempt from federal income tax. Bonds issued in an investor's home state are typically triple tax-exempt (federal, state, and local). This advantage allows munis to offer lower coupon rates than taxable bonds."},
{"d":"easy","sub":"Options","q":"The buyer of a put option has the right to:","opts":{"A":"Buy the underlying stock at the strike price","B":"Sell the underlying stock at the strike price","C":"Receive dividends on the underlying stock","D":"Vote at shareholder meetings"},"ans":"B","exp":"A put option gives its buyer the right—but not the obligation—to sell the underlying security at the strike price before expiration. Put buyers profit when the underlying price falls below the strike price."},
{"d":"easy","sub":"Options","q":"An option premium is:","opts":{"A":"An annual fee charged by the OCC","B":"The price paid by the buyer to the seller to acquire the option","C":"The guaranteed profit when exercised","D":"The interest rate applied to options margin"},"ans":"B","exp":"The premium is the price the buyer pays (and seller receives) for the option contract. It consists of intrinsic value plus time value. The premium is the buyer's maximum loss and is paid upfront."},
{"d":"easy","sub":"Mutual Funds","q":"A mutual fund's NAV per share is:","opts":{"A":"Calculated weekly after market close","B":"(Total fund assets minus liabilities) divided by shares outstanding, calculated daily after market close","C":"Set in real-time throughout the trading day","D":"Determined quarterly based on audited statements"},"ans":"B","exp":"Mutual fund NAV is calculated daily after the market closes (typically 4 PM ET): (Total assets - Liabilities) ÷ Shares outstanding. Investors who buy or sell that day receive that day's NAV."},
{"d":"easy","sub":"Annuities","q":"The accumulation phase of an annuity is the period during which:","opts":{"A":"The annuitant receives income payments","B":"The investor makes contributions and builds value, with growth on a tax-deferred basis","C":"The IRS qualifies the annuity","D":"Beneficiaries receive death benefits"},"ans":"B","exp":"During the accumulation phase, the contract holder makes contributions and the account grows tax-deferred. It ends when the contract is annuitized and the payout phase begins."},
{"d":"easy","sub":"Annuities","q":"A variable annuity's investment return depends on:","opts":{"A":"A guaranteed fixed rate from the insurance company","B":"The performance of the selected subaccounts (investment portfolios)","C":"A stock index with a cap and floor","D":"A fixed rate for 5 years then variable"},"ans":"B","exp":"Variable annuities allow allocation among subaccounts similar to mutual funds. The return—and account value—varies with those investments' performance. There is no guaranteed basic return unless a rider is added."},
{"d":"medium","sub":"Equity","q":"Preemptive rights allow existing shareholders to:","opts":{"A":"Vote to remove board members at any time","B":"Buy newly issued shares before they are offered to the public, preserving proportional ownership","C":"Receive dividends before preferred stockholders","D":"Sell shares back to the company at a guaranteed price"},"ans":"B","exp":"Preemptive (subscription) rights give existing shareholders the opportunity to purchase newly issued shares in proportion to their current ownership, preventing dilution of their economic interest and voting percentage."},
{"d":"medium","sub":"Debt Securities","q":"Current yield of a bond is calculated as:","opts":{"A":"Total return including capital gains","B":"Annual coupon divided by the bond's current market price","C":"The yield assuming held to maturity","D":"Coupon rate divided by face value"},"ans":"B","exp":"Current yield = Annual coupon ÷ Current market price. A bond with a $60 coupon trading at $950 has a current yield of 6.32%. It does not account for capital gains or losses at maturity, unlike YTM."},
{"d":"medium","sub":"Debt Securities","q":"Which bond would have the greatest price volatility given a change in interest rates?","opts":{"A":"A 2-year bond with a 10% coupon","B":"A 30-year zero-coupon bond","C":"A 10-year bond with an 8% coupon","D":"A 5-year bond with a 6% coupon"},"ans":"B","exp":"Price sensitivity to interest rates is greatest for bonds with longer maturities and lower coupons. A 30-year zero-coupon bond has the highest duration—all cash flow is at maturity—making it the most rate-sensitive."},
{"d":"medium","sub":"Options","q":"A covered call strategy involves:","opts":{"A":"Buying a call and the underlying stock simultaneously","B":"Selling a call option against shares already owned","C":"Buying both a call and a put at the same strike price","D":"Selling a call without owning the underlying stock"},"ans":"B","exp":"A covered call: the investor sells (writes) a call against shares they already own. They collect the premium as income but agree to sell shares at the strike price if exercised. It limits upside but generates income."},
{"d":"medium","sub":"Options","q":"A long straddle involves:","opts":{"A":"Owning calls and puts with different strike prices","B":"Owning both a call and a put with the same strike price and expiration on the same underlying","C":"Being short both a call and a put with the same strike and expiration","D":"Owning calls on one stock and puts on another"},"ans":"B","exp":"A long straddle: buy a call and put with identical strike and expiration. The investor profits from large moves in either direction—used when significant price movement is expected but direction is uncertain."},
{"d":"medium","sub":"Mutual Funds","q":"A 'load' mutual fund charges:","opts":{"A":"An annual fee paid to the portfolio manager","B":"A sales commission at purchase (front-end) or redemption (back-end)","C":"A performance fee when the fund outperforms its benchmark","D":"A trading fee each time the fund rebalances"},"ans":"B","exp":"Load funds charge sales commissions either at purchase (front-end load, Class A) or redemption (CDSC/back-end load, Class B/C). No-load funds skip the sales charge but all funds have ongoing expense ratios."},
{"d":"medium","sub":"Mutual Funds","q":"An ETF differs from a mutual fund primarily in that:","opts":{"A":"ETFs can only be purchased directly from the fund company","B":"ETF shares trade on exchanges throughout the day at market prices, while mutual fund shares are bought/sold at end-of-day NAV","C":"ETFs are exclusively for institutional investors","D":"ETFs hold only derivatives"},"ans":"B","exp":"ETFs trade on exchanges intraday at market prices like stocks. Mutual fund shares are only priced and transacted once daily at NAV. ETFs also use an in-kind creation/redemption mechanism with authorized participants."},
{"d":"medium","sub":"REITs","q":"To qualify as a REIT, a company must distribute at least what percentage of taxable income as dividends?","opts":{"A":"50%","B":"75%","C":"90%","D":"100%"},"ans":"C","exp":"REITs must distribute at least 90% of taxable income to shareholders annually to maintain pass-through tax status, avoiding corporate income tax on distributed amounts."},
{"d":"medium","sub":"REITs","q":"An equity REIT primarily:","opts":{"A":"Invests in mortgage loans and earns interest income","B":"Owns and operates income-producing real estate, generating income primarily from rents","C":"Issues REIT bonds in the debt market","D":"Manages private real estate partnerships"},"ans":"B","exp":"Equity REITs own and operate physical income-producing properties (apartments, office buildings, retail centers, etc.) and generate income mainly from rent. Mortgage REITs invest in mortgage loans or MBS and earn interest."},
{"d":"medium","sub":"Debt Securities","q":"A callable bond benefits the issuer because:","opts":{"A":"Investors receive a guaranteed premium at maturity","B":"The issuer can redeem bonds early and refinance at lower rates if interest rates decline","C":"It eliminates the need for interest payments","D":"It creates more secondary market trading activity"},"ans":"B","exp":"Call provisions let the issuer redeem bonds before maturity—usually at a slight premium—and reissue new debt at lower rates. This creates reinvestment risk for bondholders, who must reinvest at lower prevailing rates."},
{"d":"hard","sub":"Options","q":"Delta measures:","opts":{"A":"Time decay of the option's value","B":"The sensitivity of an option's price to a $1 change in the underlying stock price","C":"The volatility of the underlying stock","D":"The interest rate sensitivity of the option"},"ans":"B","exp":"Delta: how much an option's price changes per $1 move in the underlying. Call deltas range 0–1; put deltas range -1–0. At-the-money options have deltas near ±0.50. A call with delta 0.60 rises $0.60 for every $1 stock increase."},
{"d":"hard","sub":"Options","q":"The maximum loss for an investor who sells a naked (uncovered) call is:","opts":{"A":"The premium received","B":"The strike price minus the premium","C":"Theoretically unlimited, as the stock price can rise without bound","D":"Limited to the stock's current market value"},"ans":"C","exp":"A naked call writer doesn't own the underlying. If the stock surges, the writer must buy it at market and deliver at the lower strike. Since there is no theoretical ceiling on stock prices, the potential loss is unlimited."},
{"d":"hard","sub":"Debt Securities","q":"A bond with negative convexity will:","opts":{"A":"Rise in price faster than expected when rates fall","B":"Rise in price more slowly than expected when rates fall, because the issuer is likely to call it","C":"Always trade at a discount to par","D":"Have a lower yield than a positively convex bond"},"ans":"B","exp":"Callable bonds and MBS exhibit negative convexity at lower yields: when rates fall enough, issuers call the bonds, capping price appreciation. Standard non-callable bonds have positive convexity—price rises accelerate as yields fall."},
{"d":"hard","sub":"Mutual Funds","q":"A mutual fund's 12b-1 fee is:","opts":{"A":"A penalty charged to managers for underperformance","B":"An annual fee charged to fund assets to cover distribution and marketing expenses","C":"A fee paid to the SEC for registration","D":"A redemption fee for selling within 90 days"},"ans":"B","exp":"Rule 12b-1 allows funds to use assets for distribution costs (marketing, advertising, broker compensation). The SEC caps 12b-1 fees at 1% annually (0.25% for 'no-load' designation). Class C shares typically carry the highest 12b-1 fees."},
{"d":"hard","sub":"Annuities","q":"The mortality and expense (M&E) risk charge in a variable annuity:","opts":{"A":"Compensates the insurer for the mortality risk it assumes under the death benefit guarantee","B":"Is charged only if the annuitant dies before annuitization","C":"Is an optional rider guaranteeing minimum income","D":"Covers only administrative costs of the subaccounts"},"ans":"A","exp":"The M&E charge (typically 1–1.5% annually) compensates the insurance company for assuming the mortality risk under the death benefit guarantee and the expense risk of not covering contract costs. It is a core cost built into variable annuities."},
{"d":"easy","sub":"Equity","q":"An American Depositary Receipt (ADR) allows U.S. investors to:","opts":{"A":"Buy shares of U.S. companies listed on foreign exchanges","B":"Invest in foreign companies through U.S.-listed certificates denominated in dollars","C":"Purchase commodities through equity-linked notes","D":"Trade government bonds of foreign countries on U.S. exchanges"},"ans":"B","exp":"ADRs are U.S. dollar-denominated certificates issued by U.S. depository banks representing shares of foreign companies. They trade on U.S. exchanges and allow domestic investors to invest in foreign companies without navigating foreign markets or currencies directly."},
{"d":"easy","sub":"Equity","q":"A rights offering allows existing shareholders to:","opts":{"A":"Convert their shares to bonds at par","B":"Purchase additional shares at a discount to market price before new shares are offered to the public","C":"Sell their shares back to the company at a premium","D":"Receive additional shares instead of cash dividends"},"ans":"B","exp":"Rights offerings give existing shareholders the right to buy new shares at a subscription price (typically below market) proportional to their current holdings. This allows them to maintain their ownership percentage before a dilutive issuance."},
{"d":"medium","sub":"Options","q":"The time value of an option is greatest when:","opts":{"A":"The option is deep in the money","B":"The option is deep out of the money","C":"The option is at the money and far from expiration","D":"The option has one day remaining to expiration"},"ans":"C","exp":"Time value is highest for at-the-money options with significant time remaining. Deep ITM options have mostly intrinsic value; deep OTM options have almost no time value because the probability of profitable exercise is low. Time value decays accelerating toward expiration (theta decay)."},
{"d":"medium","sub":"Debt Securities","q":"A 'zero-coupon' bond:","opts":{"A":"Pays interest monthly at a variable rate","B":"Is issued at a discount to face value and pays no periodic interest; return comes from appreciation to par at maturity","C":"Pays a coupon only in the first and last years","D":"Is a bond with no credit risk"},"ans":"B","exp":"Zero-coupon bonds pay no periodic interest. They are issued at a deep discount and mature at par (face value). The difference between purchase price and par represents the investor's return. Examples include U.S. Treasury STRIPS."},
{"d":"medium","sub":"Debt Securities","q":"TIPS (Treasury Inflation-Protected Securities) protect investors by:","opts":{"A":"Paying a higher fixed coupon than regular Treasuries","B":"Adjusting the principal value for changes in the Consumer Price Index (CPI)","C":"Guaranteeing a positive real return regardless of inflation","D":"Being exempt from federal income tax"},"ans":"B","exp":"TIPS principal adjusts up with CPI increases and down with deflation. The coupon rate is fixed, but because it applies to the adjusted principal, coupon payments rise with inflation. At maturity, investors receive the greater of the adjusted or original principal."},
{"d":"easy","sub":"Debt Securities","q":"The yield to maturity (YTM) of a bond accounts for:","opts":{"A":"Only the annual coupon payment","B":"The total return including coupon payments and the capital gain or loss if held to maturity","C":"Only the capital appreciation from discount to par","D":"The after-tax return on the bond"},"ans":"B","exp":"YTM is the total return of a bond if held to maturity—it incorporates all coupon payments, the time value of money, and any difference between the purchase price and par value. It is the most comprehensive measure of a bond's return."},
{"d":"easy","sub":"Equity","q":"A company's 'market capitalization' equals:","opts":{"A":"Total assets minus total liabilities","B":"Share price multiplied by the number of shares outstanding","C":"Annual earnings multiplied by the P/E ratio of the industry","D":"The book value of equity on the balance sheet"},"ans":"B","exp":"Market cap = Current share price × Shares outstanding. It represents the total market value of a company's equity. Large-cap stocks are typically defined as having market caps over $10 billion; small-cap under $2 billion."},
{"d":"medium","sub":"Mutual Funds","q":"A closed-end fund differs from an open-end mutual fund in that:","opts":{"A":"Closed-end funds continuously issue new shares on demand","B":"Closed-end funds issue a fixed number of shares at IPO and trade on exchanges at market prices, which may differ from NAV","C":"Closed-end funds are not registered with the SEC","D":"Closed-end funds can only hold fixed income securities"},"ans":"B","exp":"Closed-end funds raise capital once at IPO, issue a fixed number of shares, and then trade on exchanges like stocks. Share prices are determined by supply and demand and can trade at a premium or discount to NAV—unlike open-end funds that always transact at NAV."},
{"d":"medium","sub":"Options","q":"An investor who is bearish on a stock might buy:","opts":{"A":"A call option on the stock","B":"A put option on the stock","C":"The stock on margin","D":"A covered call on the stock"},"ans":"B","exp":"A bearish investor profits when a stock falls. Buying a put option gives the right to sell the stock at the strike price—if the stock falls below the strike, the put gains value. The maximum loss is limited to the premium paid."},
{"d":"hard","sub":"Equity","q":"A leveraged buyout (LBO) is characterized by:","opts":{"A":"A company issuing large amounts of new equity to fund an acquisition","B":"The acquisition of a company using primarily borrowed funds, with the target's assets often serving as collateral","C":"The government acquiring a private company for public ownership","D":"Two companies merging using a tax-free stock swap"},"ans":"B","exp":"In an LBO, a buyer (often a private equity firm) acquires a company using mostly debt financing, with the target's assets and cash flows serving as collateral and repayment source. The goal is to use leverage to amplify equity returns once the debt is paid down."},
{"d":"hard","sub":"Options","q":"Theta in options trading measures:","opts":{"A":"The rate at which an option loses value as time passes, all else equal","B":"The sensitivity of an option's price to changes in implied volatility","C":"The option's sensitivity to a $1 move in the underlying","D":"The change in delta for a $1 move in the underlying"},"ans":"A","exp":"Theta measures time decay—the rate at which an option's value erodes as expiration approaches, all else equal. Theta is typically negative for option buyers (value decays daily) and positive for sellers (they benefit from decay). Time decay accelerates as expiration nears."},
{"d":"easy","sub":"Equity","q":"The ex-dividend date is important because:","opts":{"A":"It is the date dividends are paid to shareholders","B":"Investors must own the stock before the ex-dividend date to receive the declared dividend","C":"It is the last date the company can declare a dividend","D":"It is when the dividend is approved by the board of directors"},"ans":"B","exp":"The ex-dividend date ('ex-date') is the cutoff: investors must buy shares before this date to receive the upcoming dividend. Shares purchased on or after the ex-date do not include the dividend. The stock price typically drops by approximately the dividend amount on the ex-date."},
{"d":"easy","sub":"Equity","q":"Convertible preferred stock:","opts":{"A":"Can be redeemed by the issuer at a set price","B":"Can be exchanged for a fixed number of common shares at the holder's option","C":"Pays dividends that accumulate if unpaid","D":"Participates in earnings above the stated dividend rate"},"ans":"B","exp":"Convertible preferred stock gives the holder the right to convert their preferred shares into a fixed number of common shares at a set conversion ratio. This provides upside participation if the common stock appreciates, while retaining the income and preference features of preferred stock."},
{"d":"easy","sub":"Debt Securities","q":"General obligation (GO) municipal bonds are backed by:","opts":{"A":"The revenues of a specific project (toll road, stadium)","B":"The full faith and credit and taxing power of the issuing municipality","C":"Insurance from a bond insurer only","D":"Federal government guarantees"},"ans":"B","exp":"GO bonds are backed by the issuer's unlimited or limited taxing authority and general creditworthiness. Because they are backed by the full taxing power of the government entity, they generally have lower yields than revenue bonds of the same issuer."},
{"d":"easy","sub":"Debt Securities","q":"Revenue bonds are secured by:","opts":{"A":"The full taxing power of the issuing municipality","B":"Revenues generated by a specific project, facility, or enterprise","C":"Federal government backing","D":"Bond insurance exclusively"},"ans":"B","exp":"Revenue bonds are repaid solely from revenues generated by a specific project (toll bridge, airport, hospital, water system). They do not have access to the municipality's general tax base, so they typically carry higher yields than GO bonds to compensate for higher risk."},
{"d":"easy","sub":"Options","q":"An option is 'in the money' (ITM) when:","opts":{"A":"The option has significant time value remaining","B":"Exercising the option would result in a profit—the intrinsic value is positive","C":"The option's premium exceeds $1.00","D":"The option has been open for at least 30 days"},"ans":"B","exp":"An option is ITM when it has positive intrinsic value: a call is ITM when the stock price exceeds the strike price; a put is ITM when the stock price is below the strike price. Intrinsic value = the profit from immediate exercise."},
{"d":"medium","sub":"Options","q":"What happens to an option's time value as expiration approaches?","opts":{"A":"It increases as expiration nears","B":"It decreases toward zero as expiration nears (theta decay)","C":"It remains constant until the final week","D":"It increases if the option is in the money"},"ans":"B","exp":"Time value decays as expiration approaches—this is theta decay. An option loses time value every day, with the decay accelerating in the final weeks before expiration. At expiration, an option's value equals only its intrinsic value (zero if out of the money)."},
{"d":"medium","sub":"Equity","q":"Dollar-cost averaging (DCA) involves:","opts":{"A":"Converting all investments to dollar-denominated assets","B":"Investing a fixed dollar amount at regular intervals regardless of price","C":"Averaging down by buying more shares whenever a stock falls 10%","D":"Dividing a lump sum equally across all asset classes"},"ans":"B","exp":"Dollar-cost averaging means investing a fixed dollar amount at regular intervals (e.g., $500/month). When prices are low, you buy more shares; when prices are high, you buy fewer. Over time, this can reduce the average cost per share compared to investing a lump sum at a market peak."},
{"d":"medium","sub":"Annuities","q":"The 'annuitization' of a contract converts the accumulated value into:","opts":{"A":"A lump sum payment immediately available to the annuitant","B":"A series of periodic payments for a specified period or for the annuitant's life","C":"A tax-free rollover to an IRA","D":"Common stock in the insurance company"},"ans":"B","exp":"Annuitization converts the accumulated annuity value into a stream of periodic payments. Options include life only (payments until death), life with period certain (guaranteed minimum period), and joint and survivor (continues for a spouse). Once annuitized, the decision is typically irrevocable."},
{"d":"medium","sub":"Mutual Funds","q":"The expense ratio of a mutual fund represents:","opts":{"A":"The sales commission charged when buying shares","B":"The annual operating costs of the fund as a percentage of average net assets","C":"The fund's annual return minus inflation","D":"The cost of redemption when selling shares"},"ans":"B","exp":"The expense ratio is the total annual fund operating expenses (management fees, 12b-1 fees, administrative costs) divided by average net assets. It is expressed as a percentage (e.g., 0.75%) and is deducted from fund assets daily. Lower expense ratios directly improve investor returns."},
{"d":"medium","sub":"Debt Securities","q":"The 'yield spread' between corporate bonds and Treasury bonds reflects:","opts":{"A":"The difference in maturity between the two bonds","B":"The additional yield investors demand for taking on the credit risk of the corporate issuer","C":"The tax advantage of Treasuries over corporate bonds","D":"The currency risk of holding non-government debt"},"ans":"B","exp":"The yield spread (or credit spread) is the yield difference between a corporate bond and a comparable-maturity Treasury. It represents the extra compensation investors require for the credit risk (default risk) of the corporate issuer relative to the risk-free Treasury."},
{"d":"medium","sub":"Options","q":"An investor sells a put option on a stock. They profit if:","opts":{"A":"The stock rises above the strike price plus the premium","B":"The stock stays above the strike price, and the put expires worthless","C":"The stock falls sharply below the strike price","D":"Volatility increases significantly before expiration"},"ans":"B","exp":"A put seller (writer) receives the premium upfront and profits if the stock remains above the strike price—the put expires worthless and the seller keeps the full premium. If the stock falls below the strike, the put may be exercised, requiring the seller to buy shares at the strike price (above market value)."},
{"d":"hard","sub":"Debt Securities","q":"Modified duration measures:","opts":{"A":"The number of years to recover a bond's cost through coupon payments","B":"The approximate percentage price change in a bond for a 1% (100 basis point) change in yield","C":"The weighted average maturity of all cash flows","D":"The time to the first coupon payment"},"ans":"B","exp":"Modified duration approximates the percentage price change in a bond for a 100 basis point (1%) parallel shift in yields. A bond with modified duration of 5 will change in price by approximately 5% for a 1% change in yields. It equals Macaulay duration ÷ (1 + periodic yield)."},
{"d":"hard","sub":"Equity","q":"The 'Capital Asset Pricing Model' (CAPM) calculates expected return as:","opts":{"A":"Risk-free rate + (Beta × market return)","B":"Risk-free rate + Beta × (market return minus risk-free rate)","C":"Dividend yield + expected capital gains","D":"(Earnings per share) ÷ (Price per share)"},"ans":"B","exp":"CAPM: Expected Return = Rf + β × (Rm − Rf), where Rf is the risk-free rate, β (beta) measures the stock's systematic risk relative to the market, and (Rm − Rf) is the equity risk premium. A beta >1 indicates higher than market risk; <1 indicates lower."},
{"d":"hard","sub":"Mutual Funds","q":"A fund's 'alpha' represents:","opts":{"A":"The fund's total return for the year","B":"The excess return generated by the fund above what CAPM would predict given its beta (risk-adjusted outperformance)","C":"The fund's sensitivity to market movements","D":"The fund's standard deviation of returns"},"ans":"B","exp":"Alpha measures risk-adjusted performance: how much a fund returned above or below what would be expected given its beta. A positive alpha of 2% means the manager added 2% above what the market risk alone would predict. It is the key measure of active management skill."},
{"d":"easy","sub":"Equity","q":"Callable preferred stock:","opts":{"A":"Allows the holder to convert to common stock","B":"Can be redeemed by the issuer at a specified price after a stated date","C":"Pays higher dividends when the company's earnings increase","D":"Is entitled to vote on corporate matters"},"ans":"B","exp":"Callable (redeemable) preferred stock gives the issuer the right to redeem the shares at a specified call price on or after a certain date. This benefits the issuer—like a callable bond, it allows refinancing at lower rates if the cost of capital declines."},
{"d":"medium","sub":"Debt Securities","q":"Collateralized mortgage obligations (CMOs) are:","opts":{"A":"Mortgage loans issued directly by government agencies","B":"Debt securities backed by pools of mortgages, structured into tranches with different maturities and risk profiles","C":"Municipal bonds used to finance housing construction","D":"Variable-rate mortgages issued by savings banks"},"ans":"B","exp":"CMOs (a type of MBS) divide mortgage pools into tranches, each with different prepayment risk, maturity, and yield. Sequential-pay tranches receive prepayments in order of priority; PAC tranches offer more predictable cash flows. CMOs allow investors to choose their desired risk/maturity profile."},
{"d":"easy","sub":"Equity","q":"The P/E (price-to-earnings) ratio is calculated as:","opts":{"A":"Price per share divided by annual dividends","B":"Price per share divided by earnings per share (EPS)","C":"Market capitalization divided by book value","D":"Earnings per share divided by price per share"},"ans":"B","exp":"P/E = Price per share ÷ Earnings per share. It shows how much investors pay for each dollar of earnings. A high P/E may reflect growth expectations or overvaluation; a low P/E may reflect value or lack of growth. Industry comparisons are most meaningful."},
{"d":"medium","sub":"Equity","q":"A 'stock dividend' paid as 10% means:","opts":{"A":"Shareholders receive a 10% cash payment based on share price","B":"Shareholders receive additional shares equal to 10% of their current holdings","C":"The stock price increases by 10%","D":"The company's retained earnings increase by 10%"},"ans":"B","exp":"A 10% stock dividend means shareholders receive 10 additional shares for every 100 shares they own. Unlike cash dividends, stock dividends don't distribute cash—they increase shares outstanding while reducing retained earnings. The share price adjusts proportionally downward."},
{"d":"medium","sub":"Debt Securities","q":"A 'put bond' gives the bondholder the right to:","opts":{"A":"Convert the bond to stock at a fixed price","B":"Require the issuer to repurchase the bond at par before maturity","C":"Sell the bond on any exchange at will","D":"Receive the bond's full face value at any time"},"ans":"B","exp":"A put bond (or puttable bond) gives the holder the option to sell the bond back to the issuer at par value before maturity, usually on specified dates. If interest rates rise, the holder can put the bond at par and reinvest at higher rates—the opposite of a callable bond."},
{"d":"easy","sub":"Options","q":"Options contracts typically represent:","opts":{"A":"1 share of the underlying security","B":"100 shares of the underlying security","C":"1,000 shares of the underlying security","D":"The full value of the underlying index"},"ans":"B","exp":"Standard listed equity options contracts cover 100 shares of the underlying security. When you buy or sell one options contract, you are controlling (or obligating yourself for) 100 shares. Total premium paid = contract premium × 100."},
{"d":"easy","sub":"Annuities","q":"A 'fixed annuity' guarantees:","opts":{"A":"A rate of return tied to the stock market","B":"A specified interest rate for a defined period, with principal protection by the insurance company","C":"Income payments that increase with inflation","D":"The highest available market rate on the date of purchase"},"ans":"B","exp":"A fixed annuity pays a specified interest rate (guaranteed by the insurance company) for a set period. Principal is protected, and the company assumes all investment risk. Returns are predictable but may not keep pace with inflation. Insurance company credit quality matters."},
{"d":"medium","sub":"REITs","q":"Which type of REIT invests in mortgages and mortgage-backed securities rather than physical properties?","opts":{"A":"Equity REIT","B":"Mortgage REIT","C":"Hybrid REIT","D":"Industrial REIT"},"ans":"B","exp":"Mortgage REITs (mREITs) invest in mortgage loans and mortgage-backed securities rather than owning physical real estate. Their income comes from interest on mortgages. They are highly sensitive to interest rate changes and typically use leverage, making them more volatile than equity REITs."},
{"d":"hard","sub":"Options","q":"Vega measures:","opts":{"A":"The rate of time decay in an option","B":"The sensitivity of an option's price to changes in implied volatility of the underlying","C":"The change in delta for a $1 move in the underlying","D":"The option's sensitivity to interest rate changes"},"ans":"B","exp":"Vega measures how much an option's price changes for a 1% change in implied volatility. Options with higher vega gain more value when volatility increases. Long options (calls or puts) benefit from rising volatility (positive vega); option sellers have negative vega."},
{"d":"easy","sub":"Equity","q":"A 'bear market' is generally defined as:","opts":{"A":"Any period where stock prices fall for two consecutive weeks","B":"A decline of 20% or more from a recent high in a broad market index","C":"A period where more stocks fall than rise for 30 days","D":"A market where interest rates are rising"},"ans":"B","exp":"A bear market is commonly defined as a decline of 20% or more in a broad market index (like the S&P 500) from a recent peak, typically accompanied by widespread pessimism. A 'correction' is a 10-20% decline; anything less is normal volatility."},
{"d":"easy","sub":"Equity","q":"Common stockholders' claim on assets in bankruptcy is:","opts":{"A":"First priority, ahead of all other creditors","B":"Last priority—they receive assets only after all creditors and preferred stockholders are paid","C":"Equal to preferred stockholders","D":"Second only to secured creditors"},"ans":"B","exp":"In bankruptcy liquidation, the priority order is: secured creditors → unsecured creditors → subordinated debt holders → preferred stockholders → common stockholders. Common stockholders are residual claimants—they receive whatever (if anything) remains after all other obligations are satisfied."},
{"d":"easy","sub":"Debt Securities","q":"The coupon rate of a bond is:","opts":{"A":"The rate that changes with prevailing market interest rates","B":"The annual interest rate stated on the bond, expressed as a percentage of par value","C":"The current yield of the bond in the secondary market","D":"The yield to maturity if purchased at par"},"ans":"B","exp":"The coupon rate is the fixed annual interest rate printed on the bond certificate, expressed as a percentage of par (face) value. A bond with a $1,000 par value and a 6% coupon pays $60 annually (typically $30 every 6 months). It never changes unless the bond is a floating-rate note."},
{"d":"medium","sub":"Debt Securities","q":"Accrued interest on a bond is:","opts":{"A":"Interest added to the coupon rate when inflation rises","B":"Interest earned since the last coupon payment date that the bond buyer must pay to the seller at settlement","C":"A penalty charge for early bond redemption","D":"Interest that accumulates and is paid only at maturity"},"ans":"B","exp":"When a bond is sold between coupon dates, the buyer pays the seller accrued interest—the interest earned from the last coupon payment date to the settlement date. The buyer then receives the full next coupon payment, which effectively reimburses them for the accrued interest paid to the seller."},
{"d":"medium","sub":"Equity","q":"'Dilution' of common stock occurs when:","opts":{"A":"A company buys back its own shares","B":"New shares are issued, increasing total shares outstanding and reducing existing shareholders' ownership percentage","C":"A company pays a large special dividend","D":"The stock price drops significantly"},"ans":"B","exp":"Dilution occurs when a company issues additional shares (through new stock offerings, option exercises, or convertible security conversions), which increases total shares outstanding. Unless proportionally offset, each existing shareholder owns a smaller percentage of the company—their ownership stake is diluted."},
{"d":"medium","sub":"Options","q":"The break-even point for a long call option is:","opts":{"A":"The strike price only","B":"The strike price plus the premium paid","C":"The stock's current price plus the premium","D":"The premium paid divided by the strike price"},"ans":"B","exp":"For a long call, break-even = strike price + premium paid. At expiration, the stock must be above this price for the holder to profit. Example: $50 strike call purchased for $3 premium → break-even is $53. Below $53, the call holder loses some or all of the premium."},
{"d":"medium","sub":"Options","q":"The break-even point for a long put option is:","opts":{"A":"The strike price only","B":"The strike price minus the premium paid","C":"The premium paid divided by the strike price","D":"The current stock price minus the strike price"},"ans":"B","exp":"For a long put, break-even = strike price - premium paid. At expiration, the stock must be below this price for the holder to profit. Example: $50 strike put purchased for $3 premium → break-even is $47. Above $47, the put holder loses some or all of the premium."},
{"d":"easy","sub":"Mutual Funds","q":"A 'no-load' mutual fund is one that:","opts":{"A":"Has no expense ratio","B":"Does not charge a front-end or back-end sales commission (load)","C":"Is not registered with the SEC","D":"Has no minimum investment requirement"},"ans":"B","exp":"A no-load fund charges no sales commission at purchase or redemption. However, no-load funds still have annual expense ratios (management fees, operating costs). FINRA rules limit 12b-1 fees for funds calling themselves 'no-load' to 0.25% annually."},
{"d":"medium","sub":"Annuities","q":"The 'surrender period' in an annuity refers to:","opts":{"A":"The period after which the annuitant cannot receive payments","B":"A time period during which withdrawals above a free amount trigger surrender charges (CDSC) that decline over time","C":"The period before annuitization during which contributions are not accepted","D":"The grace period for missed premium payments"},"ans":"B","exp":"Surrender charges (contingent deferred sales charges) apply during the surrender period—typically 6-10 years from contract inception. Early withdrawals exceeding the free withdrawal amount (often 10% annually) trigger these charges, which typically start at 6-8% and decline to zero over the period."},
{"d":"easy","sub":"Equity","q":"A stock's 'book value per share' is:","opts":{"A":"The market capitalization divided by shares outstanding","B":"(Total assets minus total liabilities) divided by shares outstanding","C":"The stock's price-to-earnings ratio","D":"The dividend per share divided by the coupon rate"},"ans":"B","exp":"Book value per share = (Total shareholders' equity) ÷ Shares outstanding. It represents the net asset value on a per-share basis according to accounting records. If market price < book value, the stock may be undervalued; growth stocks often trade at large premiums to book value."},
{"d":"hard","sub":"Options","q":"Rho measures:","opts":{"A":"The option's sensitivity to volatility changes","B":"The option's sensitivity to changes in interest rates","C":"Time decay of the option","D":"The change in delta for a $1 move in the underlying"},"ans":"B","exp":"Rho measures how much an option's price changes for a 1% change in interest rates. Call options have positive rho (benefit from rate increases); put options have negative rho. Rho is generally the least impactful of the major Greeks for short-dated options but more significant for longer-dated options (LEAPS)."},
{"d":"medium","sub":"Equity","q":"A 'defensive stock' is characterized by:","opts":{"A":"Being issued by companies in the defense/military industry","B":"Being relatively resistant to economic downturns—companies in sectors with inelastic demand like utilities, consumer staples, and healthcare","C":"Always paying the highest dividends in the market","D":"Having a beta greater than 1.5"},"ans":"B","exp":"Defensive (non-cyclical) stocks are in industries whose demand is relatively inelastic—people need utilities, food, medicine, and household products regardless of the economy. They tend to be more stable during recessions. Cyclical stocks (autos, luxury goods, construction) are more sensitive to economic conditions."},
