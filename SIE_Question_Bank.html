{"d":"medium","sub":"Debt Securities","q":"A 'serial bond' is:","opts":{"A":"A bond that pays interest in a series of declining amounts","B":"A bond issue where portions of the outstanding principal mature at different scheduled dates","C":"A bond that converts to a series of equal annuity payments","D":"A bond where coupons are paid only on specific serial numbers of bonds"},"ans":"B","exp":"Serial bonds are structured so that portions of the total issue mature in different years, rather than all at once. This is common for municipal bonds—the issuer repays principal over time (like a mortgage), reducing the risk of a large single repayment. Investors can select maturities that match their needs."},
{"d":"easy","sub":"Annuities","q":"Tax-deferred growth in an annuity means:","opts":{"A":"The contract holder never pays taxes on gains","B":"Taxes on investment gains are deferred until withdrawn; no current tax is owed on earnings within the contract","C":"Contributions to the annuity are tax-deductible","D":"The annuity is exempt from state income taxes"},"ans":"B","exp":"Annuities grow tax-deferred—earnings (interest, dividends, capital gains) accumulate without current taxation. Taxes are paid only when withdrawals are made. Withdrawals from non-qualified annuities are taxed on a last-in-first-out (LIFO) basis, meaning earnings come out first and are fully taxable as ordinary income."},
{"d":"hard","sub":"Debt Securities","q":"Basis points (bps) are used to measure:","opts":{"A":"The number of trading days in a quarter","B":"Small changes in interest rates—1 basis point equals 0.01% (1/100th of 1%)","C":"The percentage of a bond issue that trades daily","D":"The credit rating steps between bond rating categories"},"ans":"B","exp":"One basis point (bps) = 0.01% = 0.0001. So 100 bps = 1%. If the Fed raises rates by 25 bps, that is a 0.25% increase. Basis points allow precise communication of small rate differences without ambiguity about percentages vs. percentage points."},
{"d":"medium","sub":"REITs","q":"REIT shares are:","opts":{"A":"Exempt from SEC registration requirements","B":"Typically traded on major stock exchanges like common stocks, providing liquidity","C":"Available only to accredited investors","D":"Restricted from paying more than 50% of income as dividends"},"ans":"B","exp":"Most REITs are publicly traded on major exchanges (NYSE, Nasdaq), making them liquid compared to direct real estate investment. There are also non-traded REITs (private, illiquid) and private REITs (exempt from SEC registration). The key feature of publicly traded REITs is their stock-like liquidity."},
{"d":"easy","sub":"Equity","q":"'Authorized shares' refers to:","opts":{"A":"Shares currently owned by the public","B":"The maximum number of shares a corporation may issue as specified in its corporate charter","C":"Shares that have been issued and are currently outstanding","D":"Shares reserved for employee stock option plans"},"ans":"B","exp":"Authorized shares are the maximum number of shares a company is legally permitted to issue, as stated in its corporate charter (articles of incorporation). Of authorized shares: issued shares have been sold, treasury shares are bought back, and outstanding shares are issued minus treasury. Companies need shareholder approval to increase authorized shares."},
{"d":"medium","sub":"Debt Securities","q":"The 'yield to call' (YTC) of a callable bond assumes:","opts":{"A":"The bond is held to its maturity date","B":"The bond is redeemed by the issuer at the first call date and call price","C":"The bondholder sells in the secondary market at a premium","D":"The coupon rate is adjusted downward upon call"},"ans":"B","exp":"YTC calculates the return assuming the issuer calls (redeems) the bond on the first call date at the call price. For bonds trading at a premium, YTC is typically lower than YTM because the premium must be amortized over the shorter call period. Investors should consider the lower of YTM and YTC ('yield to worst')."},
{"d":"easy","sub":"Equity","q":"Preferred stockholders typically have priority over common stockholders for:","opts":{"A":"Voting rights on all corporate decisions","B":"Dividends and assets in liquidation","C":"Preemptive rights in new stock offerings","D":"Rights to additional shares in stock splits"},"ans":"B","exp":"Preferred stockholders have priority over common stockholders for: (1) dividend payments—preferred dividends must be paid before any common dividend; and (2) liquidation—preferred holders receive assets before common holders (but after creditors/bondholders). In exchange, preferred typically have limited or no voting rights."},
{"d":"medium","sub":"Options","q":"Writing a naked put means the investor:","opts":{"A":"Owns the underlying stock and sells a put against it","B":"Sells a put option without holding a short position in the underlying stock","C":"Buys a put option on a stock they do not own","D":"Sells both a put and call simultaneously on the same stock"},"ans":"B","exp":"A naked (uncovered) put writer sells a put option without holding a corresponding short stock position. The writer collects the premium and profits if the stock stays above the strike price. The maximum loss is the strike price minus the premium (the stock going to zero). Writers may be required to buy the stock if put is exercised."},
{"d":"medium","sub":"Mutual Funds","q":"The 'turnover rate' of a mutual fund measures:","opts":{"A":"How frequently fund managers are replaced","B":"The percentage of a fund's holdings that are replaced in a given year","C":"How many times per year the fund pays dividends","D":"The rate at which new investors enter and exit the fund"},"ans":"B","exp":"Turnover rate measures portfolio activity: a 100% turnover rate means the fund replaced all its holdings once during the year. High turnover generates more taxable capital gains and higher transaction costs. Index funds typically have very low turnover; actively managed funds tend to have higher turnover."},
{"d":"easy","sub":"Debt Securities","q":"A 'floating rate' (variable rate) bond pays:","opts":{"A":"A fixed coupon for the life of the bond","B":"An interest rate that adjusts periodically based on a benchmark rate (e.g., SOFR plus a spread)","C":"No interest until maturity","D":"Interest only if the issuer earns a profit"},"ans":"B","exp":"Floating rate bonds (floaters) pay interest that resets periodically (e.g., quarterly) based on a benchmark plus a fixed spread. SOFR (Secured Overnight Financing Rate) has replaced LIBOR as the primary benchmark for floating rate instruments. Floaters reduce interest rate risk because the coupon adjusts to market rates."},
{"d":"medium","sub":"Options","q":"A 'protective put' strategy involves:","opts":{"A":"Selling a put against a stock position to generate income","B":"Buying a put option on a stock already owned to protect against downside risk","C":"Buying both a put and call on the same stock","D":"Buying a put on a stock the investor plans to sell short"},"ans":"B","exp":"A protective put (portfolio insurance): an investor who owns a stock buys a put option to limit downside risk. If the stock falls, the put gains value, offsetting losses. The cost is the put premium. It's similar to buying insurance on the stock position."},
{"d":"hard","sub":"Equity","q":"The 'efficient market hypothesis' in its strong form states that:","opts":{"A":"No investor can consistently beat the market using publicly available information","B":"Security prices reflect all information—public and private—so even insider information cannot generate consistent excess returns","C":"Technical analysis can be used to predict future prices","D":"Markets are efficient only in the long run, not the short run"},"ans":"B","exp":"Strong-form EMH holds that prices reflect all information—public AND private (insider). No investor, even with material non-public information, can consistently outperform. Most regulators and academics believe markets are at best semi-strong form efficient; strong form is largely rejected (insider trading does generate excess returns, as evidenced by SEC enforcement)."},
{"d":"medium","sub":"Debt Securities","q":"Municipal bonds are issued by:","opts":{"A":"The U.S. Treasury Department","B":"State and local governments and their agencies to fund public projects","C":"The Federal Reserve to control money supply","D":"Corporations in high-tax states"},"ans":"B","exp":"Municipal bonds ('munis') are debt securities issued by state and local governments, cities, counties, school districts, and special-purpose authorities (water districts, port authorities, transit agencies). Proceeds fund public projects: schools, roads, hospitals, utilities. Their interest is generally exempt from federal taxes."},
{"d":"medium","sub":"Equity","q":"A company's 'dividend yield' is calculated as:","opts":{"A":"Earnings per share divided by the stock price","B":"Annual dividend per share divided by the current stock price","C":"Total dividends paid divided by net income","D":"Dividend per share divided by book value per share"},"ans":"B","exp":"Dividend yield = Annual dividends per share ÷ Current price per share. A stock paying $2 annually and trading at $40 has a 5% dividend yield. It measures the income return from dividends relative to the investment cost. Higher dividend yields may indicate value or high income but could also signal risk if unusually high."},
{"d":"easy","sub":"Equity","q":"A stock warrant gives its holder:","opts":{"A":"The right to vote on corporate matters","B":"The right to purchase company stock at a specified price for a set period, often issued with bonds or preferred stock","C":"A guaranteed dividend payment","D":"Priority over bondholders in liquidation"},"ans":"B","exp":"Warrants are long-term (often multi-year) instruments issued by a company giving the holder the right to buy shares at a fixed exercise price. They are typically issued as sweeteners with bonds or preferred stock. Unlike standard listed options, they are issued by the company itself (creating new shares upon exercise) and tend to have much longer time horizons."},
{"d":"easy","sub":"Debt Securities","q":"The 'face value' (par value) of most corporate and government bonds is:","opts":{"A":"$100","B":"$1,000","C":"$10,000","D":"$100,000"},"ans":"B","exp":"The standard par (face) value of most U.S. corporate and government bonds is $1,000. Bonds trade as a percentage of par—a price of 98 means $980 per bond. Municipal bonds also typically have $5,000 par values. T-bills have minimum face values of $100."},
{"d":"easy","sub":"Mutual Funds","q":"Which share class of mutual fund typically has the highest 12b-1 fee and no front-end load?","opts":{"A":"Class A","B":"Class B","C":"Class C","D":"Class I (Institutional)"},"ans":"C","exp":"Class C shares have no front-end sales load and usually no (or minimal) back-end load after 1 year, but carry the highest ongoing 12b-1 fees (typically 1% annually). Class A shares have front-end loads and low 12b-1 fees. Class B shares have back-end loads that decline over time. Class I (institutional) shares have no loads and the lowest expense ratios."},
{"d":"medium","sub":"Equity","q":"A 'stock split' vs. a 'reverse stock split':","opts":{"A":"A split increases shares and reduces price proportionally; a reverse split reduces shares and increases price proportionally","B":"A split reduces shares and increases price; a reverse split increases shares and reduces price","C":"Both have the same effect on market capitalization","D":"Only reverse splits affect par value"},"ans":"A","exp":"Forward split (e.g., 2-for-1): doubles shares, halves price—total market cap unchanged. Reverse split (e.g., 1-for-10): reduces shares, multiplies price—total market cap unchanged. Reverse splits are often done to raise share price above exchange minimum listing requirements or to reduce the number of shareholders."},
{"d":"medium","sub":"Annuities","q":"A 'life with period certain' annuity payout option:","opts":{"A":"Pays income only for the annuitant's life with no minimum guarantee","B":"Pays income for the annuitant's life, guaranteeing payments for a minimum period (e.g., 10-20 years) even if the annuitant dies sooner","C":"Pays income only for the specified period regardless of life status","D":"Guarantees payments to two annuitants for as long as either lives"},"ans":"B","exp":"Life with period certain: the annuitant receives income for life, but if they die before the specified period (e.g., 10 or 20 years), payments continue to the beneficiary for the remainder of that period. This provides protection against dying early without leaving the insurance company keeping the balance."},
{"d":"medium","sub":"Options","q":"A 'collar' options strategy involves:","opts":{"A":"Buying a call and selling a put with the same strike price","B":"Owning stock, buying a put (for downside protection), and selling a call (to finance the put) simultaneously","C":"Buying both a call and put with different strikes but same expiration","D":"Selling a call and put with the same expiration and strike"},"ans":"B","exp":"A collar: investor owns stock + buys a protective put + sells a covered call. The put provides downside protection (at the cost of the put premium); the call sale generates income to offset the put cost. The trade-off: upside is capped at the call strike. Collars are zero-cost or low-cost protective strategies."},
{"d":"easy","sub":"Debt Securities","q":"Which of the following is a characteristic of STRIPS (Separate Trading of Registered Interest and Principal of Securities)?","opts":{"A":"They pay both interest and principal at maturity","B":"They are zero-coupon instruments created by separating Treasury coupon payments from principal","C":"They are issued directly by the Fed, not the Treasury","D":"They are municipal bond instruments"},"ans":"B","exp":"Treasury STRIPS are created by financial institutions that separate (strip) a Treasury note or bond into its individual cash flows—each coupon payment and the principal payment become separate zero-coupon securities. They are sold at a discount and pay face value at their respective maturity dates. They are popular for long-term liability matching."},
{"d":"hard","sub":"Equity","q":"Gamma in options trading measures:","opts":{"A":"The rate of change of an option's value with respect to time","B":"The rate of change of delta with respect to a $1 change in the underlying stock price","C":"The option's sensitivity to changes in implied volatility","D":"The option's sensitivity to interest rate changes"},"ans":"B","exp":"Gamma measures how much delta changes for a $1 move in the underlying. High gamma options (near expiration, near-the-money) have rapidly changing deltas—small moves in the stock produce large changes in delta. Options sellers (who are short gamma) face the most risk from sharp moves in the underlying."},
{"d":"medium","sub":"Mutual Funds","q":"An 'open-end' mutual fund differs from a 'closed-end' fund in that:","opts":{"A":"Open-end funds trade on exchanges; closed-end funds do not","B":"Open-end funds continuously create and redeem shares at NAV; closed-end funds issue a fixed number of shares that trade on exchanges","C":"Open-end funds are not regulated by the Investment Company Act","D":"Closed-end funds have lower expense ratios because they don't issue new shares"},"ans":"B","exp":"Open-end mutual funds issue new shares when investors buy and redeem shares when investors sell (at that day's NAV). There is no secondary market for open-end fund shares. Closed-end funds issue a fixed number of shares at IPO; shares then trade on exchanges at market prices that can differ from NAV (premium or discount)."},
{"d":"easy","sub":"Equity","q":"The record date for a dividend means:","opts":{"A":"The date the dividend is declared by the board of directors","B":"The date shareholders must be on the company's books to receive the dividend","C":"The date dividends are mailed to shareholders","D":"The date the stock price drops to reflect the dividend"},"ans":"B","exp":"Shareholders of record on the record date are entitled to receive the declared dividend. The ex-dividend date is 1 business day before the record date (under T+1 settlement): buy before the ex-date → owner of record by the record date → receive dividend. Buy on or after ex-date → not on record → no dividend."},
{"d":"easy","sub":"Options","q":"An option is 'out of the money' (OTM) when:","opts":{"A":"The option is deeply profitable if exercised","B":"Exercising the option would not be profitable—the intrinsic value is zero","C":"The option's premium exceeds $5.00","D":"The option expires in less than 30 days"},"ans":"B","exp":"An option is OTM when it has no intrinsic value: a call is OTM when the stock price is below the strike price; a put is OTM when the stock price is above the strike price. OTM options have only time value and expire worthless if still OTM at expiration."},
{"d":"medium","sub":"Equity","q":"The 'conversion ratio' of a convertible bond determines:","opts":{"A":"The exchange rate for converting the bond to foreign currency","B":"The number of common shares received when the convertible bond is converted","C":"The discount rate used to value the bond","D":"The ratio of convertible bonds to total debt outstanding"},"ans":"B","exp":"The conversion ratio specifies how many shares of common stock the bondholder receives upon conversion. If the conversion ratio is 40, each $1,000 bond converts to 40 shares. The conversion price = Par ÷ Conversion ratio = $1,000 ÷ 40 = $25 per share. Investors convert when the stock price exceeds the conversion price."},
{"d":"medium","sub":"Debt Securities","q":"CMO tranches are structured to:","opts":{"A":"Guarantee a fixed return regardless of mortgage prepayments","B":"Redirect prepayment risk, giving different tranches different levels of prepayment exposure and average life","C":"Allow investors to choose individual mortgage loans for investment","D":"Convert adjustable-rate mortgages into fixed-rate instruments"},"ans":"B","exp":"CMO tranches are created to redistribute prepayment risk from mortgage pools. Sequential-pay CMOs direct all prepayments first to the shortest tranche until it's retired. PAC (Planned Amortization Class) tranches have defined prepayment schedules within a band, providing more predictable cash flows, while companion/support tranches absorb excess prepayment risk."},
{"d":"hard","sub":"Options","q":"A long straddle profits when:","opts":{"A":"The stock stays close to the strike price at expiration","B":"The stock moves significantly in either direction—the combined gain on the profitable leg exceeds the total premium paid","C":"Implied volatility decreases","D":"The stock expires exactly at the strike price"},"ans":"B","exp":"A long straddle buyer wants large moves. Profit occurs when the stock moves enough so that the gain on the call (if up) or put (if down) exceeds the total premium paid for both options. The break-even points are: strike + total premium (upside) and strike - total premium (downside). The position loses if the stock stays near the strike."},
{"d":"easy","sub":"REITs","q":"REIT dividends paid to investors are generally taxed as:","opts":{"A":"Long-term capital gains","B":"Ordinary income (in most cases), since REITs pay out most of their taxable income","C":"Tax-free municipal income","D":"Qualified dividends at the lower capital gains rate"},"ans":"B","exp":"Most REIT dividends are taxed as ordinary income because REITs pass through their rental and interest income. However, a portion may qualify as capital gain distributions or return of capital (which lowers the cost basis). The Tax Cuts and Jobs Act (2017) added a 20% deduction for pass-through income, reducing the effective rate on REIT dividends for eligible taxpayers."},
{"d":"medium","sub":"Annuities","q":"Which of the following annuity features protects against outliving one's assets?","opts":{"A":"Surrender period","B":"Life annuity payout option—provides income for as long as the annuitant lives","C":"Accumulation bonus","D":"Free withdrawal privilege"},"ans":"B","exp":"The life annuity payout (straight life or life only) provides guaranteed income for the annuitant's entire lifetime, regardless of how long they live. This is the primary insurance feature of annuities—they cannot be outlived. The trade-off: payments typically stop at death (no benefit to beneficiaries unless a period certain or joint option is chosen)."},
{"d":"easy","sub":"Equity","q":"A 'growth stock' is typically characterized by:","opts":{"A":"High dividend yields and low price-to-earnings ratios","B":"High price-to-earnings ratios and reinvestment of earnings rather than dividend payments","C":"Stable earnings regardless of economic conditions","D":"Very low volatility and beta below 0.5"},"ans":"B","exp":"Growth stocks are companies expected to grow faster than average. They typically have high P/E ratios (investors pay a premium for expected future earnings) and reinvest most earnings rather than paying dividends. Technology companies like Amazon and Tesla are classic examples. They are more volatile and sensitive to growth expectations."},
{"d":"medium","sub":"Mutual Funds","q":"The 'portfolio turnover ratio' has a direct impact on:","opts":{"A":"The fund's ability to accept new investors","B":"The fund's tax efficiency—high turnover generates more realized capital gains distributed to shareholders","C":"The minimum investment requirement","D":"The fund's ability to track its benchmark index"},"ans":"B","exp":"High portfolio turnover means more frequent buying and selling within the fund, which realizes capital gains that must be distributed to shareholders (who owe taxes on them). Index funds have low turnover (single-digit percentages) and are tax-efficient; actively managed funds often have 50-100%+ turnover generating significant taxable distributions."},
{"d":"hard","sub":"Debt Securities","q":"When inflation rises, the real return on a fixed-rate bond:","opts":{"A":"Increases proportionally","B":"Decreases because the fixed coupon payments are worth less in real purchasing power terms","C":"Remains unchanged because coupon payments are fixed","D":"Increases because bond prices rise with inflation"},"ans":"B","exp":"The real return = nominal return - inflation. If a bond pays a 4% coupon and inflation rises to 6%, the real return is negative (-2%). Fixed coupon payments become less valuable in real terms when inflation rises. TIPS address this by adjusting principal for CPI—providing a fixed real return rather than a fixed nominal return."},
{"d":"easy","sub":"Municipal Securities","q":"A general obligation (GO) bond is backed by:","opts":{"A":"The revenues of a specific municipal project","B":"The full taxing power and creditworthiness of the issuing municipality","C":"Federal government guarantees","D":"Bond insurance purchased by the issuer"},"ans":"B","exp":"GO bonds are backed by the issuer's full faith, credit, and taxing power—the municipality can raise taxes to meet debt service. This makes them generally safer than revenue bonds. They typically require voter approval."},
{"d":"easy","sub":"Municipal Securities","q":"A revenue bond is secured by:","opts":{"A":"The municipality's general tax base","B":"The revenues generated by the specific project the bond finances","C":"Federal Housing Administration guarantees","D":"SIPC protection"},"ans":"B","exp":"Revenue bonds are repaid solely from revenues of a specific project—toll roads, airports, hospitals, water systems. If the project generates insufficient revenue, bondholders have no claim on the municipality's general tax base. This additional risk means revenue bonds typically yield more than GO bonds."},
{"d":"easy","sub":"Municipal Securities","q":"Municipal bond interest is generally:","opts":{"A":"Taxable at all levels","B":"Exempt from federal income tax, and often from state/local taxes in the issuing state","C":"Subject to the Alternative Minimum Tax for all investors","D":"Tax-free only for investors over age 65"},"ans":"B","exp":"Muni bond interest is generally exempt from federal income tax. If you live in the issuing state, interest is often also exempt from state and local taxes—making it 'triple tax-exempt.' This tax advantage allows issuers to offer lower coupon rates than comparable taxable bonds."},
{"d":"medium","sub":"Municipal Securities","q":"An investor in the 32% federal tax bracket is deciding between a 4.5% municipal bond and a 6.5% corporate bond. What is the tax-equivalent yield of the muni?","opts":{"A":"4.5%","B":"5.96%","C":"6.62%","D":"7.20%"},"ans":"C","exp":"Tax-Equivalent Yield = Muni Yield ÷ (1 − Tax Rate) = 4.5% ÷ (1 − 0.32) = 4.5% ÷ 0.68 = 6.62%. Since the corporate bond yields 6.5%, which is less than the 6.62% TEY, the municipal bond provides the better after-tax return for this investor."},
{"d":"medium","sub":"Municipal Securities","q":"Which of the following best describes a 'serial bond' structure common in municipal finance?","opts":{"A":"All bonds in the issue mature on the same date","B":"Portions of the bond issue mature at different scheduled dates, reducing total outstanding debt over time","C":"Bonds that convert to equity upon a trigger event","D":"Bonds with interest rates that reset periodically"},"ans":"B","exp":"Serial bonds are structured so that a portion matures each year, similar to mortgage amortization. This allows the issuer to retire debt gradually rather than face one large balloon payment. Serial bonds are the most common structure in municipal finance."},
{"d":"medium","sub":"Municipal Securities","q":"The MSRB (Municipal Securities Rulemaking Board) has regulatory authority over:","opts":{"A":"Municipal issuers—the cities and states that issue bonds","B":"Broker-dealers and bank dealers that underwrite, trade, and sell municipal securities","C":"Both issuers and dealer firms equally","D":"Only retail investors purchasing municipal bonds"},"ans":"B","exp":"The MSRB writes rules governing broker-dealers (and bank dealers) in the municipal securities market. Importantly, the MSRB has NO regulatory authority over municipal issuers themselves—it cannot tell a city or state what to disclose or how to structure its bonds. The SEC and FINRA enforce MSRB rules against dealer firms."},
{"d":"medium","sub":"Municipal Securities","q":"Which type of private activity municipal bond may be subject to the Alternative Minimum Tax (AMT)?","opts":{"A":"General obligation bonds issued by states","B":"Bonds for certain private purposes like airports, stadiums, and private student loans","C":"All municipal bonds issued after 1986","D":"Only municipal bonds with ratings below investment grade"},"ans":"B","exp":"Most muni bond interest is federally tax-exempt. However, interest from certain 'private activity bonds'—those where proceeds substantially benefit private entities (airports, sports stadiums, private university bonds, private student loan bonds)—may be a preference item subject to the AMT for affected taxpayers."},
{"d":"hard","sub":"Municipal Securities","q":"An investor buys a municipal bond at a premium. If they hold it to maturity, the premium must be:","opts":{"A":"Deducted as a capital loss at maturity","B":"Amortized over the life of the bond, reducing the cost basis and the tax-exempt interest recognized","C":"Reported as taxable income in the year of purchase","D":"Ignored for tax purposes since munis are tax-exempt"},"ans":"B","exp":"For tax-exempt muni bonds purchased at a premium, the IRS requires the premium to be amortized over the bond's life (using the constant yield method). Each year, the amortized amount reduces the investor's cost basis and reduces (offsets) the tax-exempt interest recognized. At maturity, if fully amortized, the adjusted basis equals par—no capital gain or loss."},
{"d":"easy","sub":"Investment Risks","q":"Which type of risk CANNOT be eliminated through diversification?","opts":{"A":"Unsystematic (specific) risk","B":"Systematic (market) risk","C":"Credit risk","D":"Liquidity risk"},"ans":"B","exp":"Systematic risk (market risk) affects all securities and cannot be eliminated through diversification because all assets are correlated with the overall market to some degree. Examples: recessions, interest rate changes, geopolitical events. Unsystematic (specific) risk—company or industry-specific—CAN be reduced through diversification."},
{"d":"easy","sub":"Investment Risks","q":"'Inflation risk' (purchasing power risk) primarily affects:","opts":{"A":"Equity securities with high growth potential","B":"Fixed-rate investments whose returns may not keep pace with inflation","C":"Only government bonds, not corporate bonds","D":"Securities with floating interest rates"},"ans":"B","exp":"Inflation risk is the risk that returns won't keep pace with inflation, eroding purchasing power. Fixed-rate bonds are most exposed—the coupon stays the same while inflation reduces the real value of those payments. TIPS (Treasury Inflation-Protected Securities) are specifically designed to address this risk by adjusting principal for CPI changes."},
{"d":"easy","sub":"Investment Risks","q":"Reinvestment risk is the risk that:","opts":{"A":"The issuer will default on interest payments","B":"Cash flows from an investment must be reinvested at lower rates than originally anticipated","C":"The investor cannot sell the security at a fair price","D":"Rising interest rates will reduce the bond's market price"},"ans":"B","exp":"Reinvestment risk is greatest for callable bonds—when rates fall, issuers call high-coupon bonds and investors must reinvest at lower prevailing rates. It also affects mortgage-backed securities (prepayment risk) and investors who rely on coupon income. A zero-coupon bond eliminates reinvestment risk since there are no interim coupon payments to reinvest."},
{"d":"medium","sub":"Investment Risks","q":"A portfolio concentrated in a single industry sector faces primarily:","opts":{"A":"Systematic risk only","B":"Concentration risk—excessive exposure to a single sector or issuer","C":"Inflation risk from sector-specific price pressures","D":"Regulatory risk from SEC oversight"},"ans":"B","exp":"Concentration risk arises when a portfolio is over-exposed to a single security, sector, industry, or geographic region. The remedy is diversification across asset classes, sectors, and geographies. Unlike systematic risk, concentration risk IS diversifiable—spreading across multiple sectors reduces it."},
{"d":"medium","sub":"Investment Risks","q":"Which of the following bonds has the HIGHEST interest rate risk?","opts":{"A":"A 2-year Treasury note paying 5% coupon","B":"A 30-year zero-coupon Treasury bond","C":"A 10-year corporate bond paying 6% coupon","D":"A floating-rate note tied to SOFR"},"ans":"B","exp":"Interest rate risk (duration) is highest for: (1) longer maturities and (2) lower coupons. A 30-year zero-coupon bond has the highest possible duration for its maturity—all cash flow arrives at maturity, making it maximally sensitive to rate changes. Floating-rate notes have very low interest rate risk because their coupons reset periodically."},
{"d":"medium","sub":"Investment Risks","q":"Prepayment risk in mortgage-backed securities (MBS) means:","opts":{"A":"The mortgage servicer may fail to forward payments to bondholders","B":"Homeowners may pay off mortgages early—especially when rates fall—returning principal that must be reinvested at lower rates","C":"The government may call the MBS before maturity","D":"MBS investors may not receive all promised interest payments"},"ans":"B","exp":"Prepayment risk is specific to MBS and CMOs. When interest rates fall, homeowners refinance—paying off mortgages early. This returns principal to MBS investors ahead of schedule, who must then reinvest at the now-lower market rates. Prepayment risk is why MBS carry negative convexity and generally yield more than comparable Treasuries."},
{"d":"medium","sub":"Investment Risks","q":"An investor holds ADRs (American Depositary Receipts) of a European company. In addition to market risk, they face:","opts":{"A":"Only political risk if the European country is unstable","B":"Currency/exchange rate risk—if the euro weakens vs. the dollar, returns decline even if the stock rises in local terms","C":"Liquidity risk since ADRs never trade on U.S. exchanges","D":"No additional risks beyond those of U.S. stocks"},"ans":"B","exp":"ADRs expose investors to currency/exchange rate risk. If the foreign currency depreciates against the dollar, returns in dollar terms will be lower than local-currency returns—even if the underlying stock price rises. For example, a European stock rising 10% in euros provides less than 10% dollar return if the euro weakens 5% vs. the dollar."},
{"d":"hard","sub":"Investment Risks","q":"Call risk on a corporate bond means the investor faces which specific risk if the bond is called?","opts":{"A":"The investor receives less than par at redemption","B":"The investor must reinvest the returned principal at lower prevailing interest rates","C":"The bond price rises above the call price, and the investor misses the gain","D":"The investor owes capital gains taxes on the call premium"},"ans":"B","exp":"Call risk and reinvestment risk are closely related. When an issuer calls a bond (typically after rates fall and the issuer can refinance more cheaply), the investor receives par back but must reinvest at the now-lower market rates. This is why callable bonds carry a 'yield to worst' measure—investors should compare YTC to YTM and assume the worst case."}
],
trading:[
{d:"easy",sub:"Order Types",q:"A market order is an order to:",opts:{A:"Buy or sell at a specified price or better",B:"Buy or sell immediately at the best available current price",C:"Buy or sell only if the price moves to a specific trigger",D:"Buy or sell at the closing price of the day"},ans:"B",exp:"A market order executes immediately at the best available market price. It prioritizes speed over price. Market orders are always filled but not always at the expected price, especially in fast-moving markets."},
{d:"easy",sub:"Order Types",q:"A buy limit order at $50 will execute at:",opts:{A:"Exactly $50 only",B:"$50 or higher",C:"$50 or lower",D:"The market price regardless of the limit"},ans:"C",exp:"A buy limit order sets the maximum price the investor will pay. It executes at $50 or lower (a better price). It will not execute above $50. The risk is that the order may go unfilled if the price never drops to $50."},
{d:"easy",sub:"Order Types",q:"A stop order converts to what type of order when triggered?",opts:{A:"A limit order at the stop price",B:"A market order",C:"A day order",D:"A GTC order"},ans:"B",exp:"When a stop order's trigger price is reached, it becomes a market order and executes at the next available price. The execution price may differ from the stop price, especially in fast-moving markets."},
{d:"easy",sub:"Order Types",q:"A Good-Till-Canceled (GTC) order:",opts:{A:"Expires at the end of the trading day if not executed",B:"Remains active until executed or explicitly canceled by the investor",C:"Can only be canceled by the broker-dealer",D:"Is valid for the current month only"},ans:"B",exp:"A GTC order remains in effect until filled or canceled by the customer. Unlike a day order (which expires at close), a GTC order carries over from day to day. Broker-dealers typically set a maximum duration."},
{d:"easy",sub:"Settlement",q:"T+1 settlement for equities means the trade settles:",opts:{A:"On the same day",B:"One business day after the trade date",C:"Two business days after the trade date",D:"One calendar day after the trade date"},ans:"B",exp:"T+1 means settlement occurs one business day after the trade date. This is the current standard for most U.S. equity securities since May 2024. A Monday trade settles on Tuesday (assuming no holidays)."},
{d:"easy",sub:"Account Types",q:"In a cash account, customers must pay for securities by:",opts:{A:"The trade date",B:"The settlement date",C:"Within 30 days of the trade date",D:"The end of the calendar month"},ans:"B",exp:"In a cash account, customers must pay for purchased securities in full by the settlement date. If payment is not received, the broker may sell the securities and restrict the account."},
{d:"easy",sub:"Margin",q:"Regulation T sets the initial margin requirement for equity securities at:",opts:{A:"25%",B:"50%",C:"75%",D:"100%"},ans:"B",exp:"Regulation T (set by the Federal Reserve) requires customers to deposit at least 50% of the purchase price of marginable equity securities as initial margin. The broker can lend the remaining 50%."},
{d:"easy",sub:"Prohibited Activities",q:"Churning is best described as:",opts:{A:"Investing a customer's entire account in one stock",B:"Executing excessive trades in a customer's account primarily to generate commissions",C:"Trading on inside information",D:"Recommending unsuitable investments"},ans:"B",exp:"Churning is excessive trading in a customer's account not for the customer's benefit but to generate commissions for the broker. It violates FINRA suitability rules and the broker's obligations to customers."},
{d:"easy",sub:"Prohibited Activities",q:"Insider trading involves trading based on:",opts:{A:"Information from financial news sources",B:"Material, non-public information",C:"Analyst recommendations published in reports",D:"Historical price patterns"},ans:"B",exp:"Insider trading is buying or selling securities while in possession of material information that has not been made public. 'Material' means it would likely influence an investor's decision; 'non-public' means it hasn't been broadly disclosed."},
{d:"easy",sub:"Short Selling",q:"Short selling involves:",opts:{A:"Buying shares at a low price and selling when the price rises",B:"Selling borrowed shares expecting to buy them back at a lower price",C:"Selling put options on shares you already own",D:"Selling shares in a declining market to minimize losses"},ans:"B",exp:"In a short sale, an investor borrows shares and sells them, hoping the price will fall. If it does, they buy shares back at the lower price (covering), return them to the lender, and profit from the difference."},
{d:"easy",sub:"Customer Accounts",q:"A JTWROS account means:",opts:{A:"Each owner's share passes to their estate at death",B:"Upon one owner's death, their share passes automatically to the surviving owner(s)",C:"Both owners must approve all transactions",D:"The account can only be opened by married couples"},ans:"B",exp:"In a JTWROS account, when one owner dies, their interest automatically passes to the surviving joint owner(s) by operation of law, outside of probate. This contrasts with Tenants in Common, where each owner's share passes through their estate."},
{d:"easy",sub:"Prohibited Activities",q:"Front-running occurs when a broker-dealer:",opts:{A:"Executes client orders before the market opens",B:"Trades for its own account ahead of a known pending customer order to profit from the price move",C:"Fills customer orders at prices better than quoted",D:"Buys securities before earnings announcements"},ans:"B",exp:"Front-running is illegal. It involves a broker knowing about a pending large customer order and trading in the same direction for their own account first to profit from the price movement the customer's order will cause."},
{d:"easy",sub:"Prohibited Activities",q:"'Selling away' refers to a registered representative:",opts:{A:"Selling securities below market value",B:"Executing transactions away from the employing firm without the firm's knowledge or approval",C:"Selling restricted securities in violation of lock-up agreements",D:"Selling securities of another country in U.S. markets"},ans:"B",exp:"'Selling away' occurs when a rep conducts securities transactions outside their employing broker-dealer without its knowledge or approval. Customers have no SIPC protection and the firm cannot supervise outside transactions."},
{d:"medium",sub:"Order Types",q:"A stop-limit order's primary risk compared to a stop order is:",opts:{A:"The order might execute at a worse price than intended",B:"The order might never execute if the market moves through the limit price without filling",C:"The order might be executed before the stop price is reached",D:"The order always guarantees execution at the limit price"},ans:"B",exp:"Once a stop-limit order's stop price triggers, it becomes a limit order. If the market moves quickly through the limit price (e.g., a stock gaps down past the limit), the order may not execute at all. A stop order would become a market order and be more likely to fill."},
{d:"medium",sub:"Order Types",q:"A short seller uses which order to limit losses if the stock rises?",opts:{A:"Buy limit order",B:"Sell stop order",C:"Buy stop order",D:"Sell limit order"},ans:"C",exp:"A short seller profits when the stock falls. To limit losses if the stock rises, they place a buy stop order above the current price. When triggered, it becomes a market order to buy (cover) the short position, capping the loss."},
{d:"medium",sub:"Margin",q:"FINRA Rule 4210 sets the minimum maintenance margin requirement at:",opts:{A:"50% of current market value",B:"30% of current market value",C:"25% of current market value",D:"10% of current market value"},ans:"C",exp:"FINRA Rule 4210 sets the minimum maintenance margin at 25% of the current market value of the securities in a margin account. Individual broker-dealers may impose higher 'house' requirements (often 30-35%)."},
{d:"medium",sub:"Margin",q:"Pattern day traders must maintain minimum equity of:",opts:{A:"$2,000",B:"$10,000",C:"$25,000",D:"$50,000"},ans:"C",exp:"FINRA defines a pattern day trader as anyone who executes 4 or more day trades within 5 business days in a margin account. Pattern day traders must maintain at least $25,000 in their margin account at all times."},
{d:"medium",sub:"Customer Accounts",q:"A discretionary account requires:",opts:{A:"Verbal authorization from the customer",B:"Written authorization from the customer before the representative can trade without prior approval",C:"Supervisor approval on each trade",D:"The account must be a margin account"},ans:"B",exp:"Discretionary authority must be granted in writing. The customer signs a trading authorization (limited power of attorney) allowing the rep to determine the security, action, and amount without prior approval for each trade."},
{d:"medium",sub:"Prohibited Activities",q:"'Spoofing' in modern electronic markets refers to:",opts:{A:"Impersonating a licensed broker to solicit customers",B:"Placing large orders with intent to cancel before execution to create false impression of supply or demand",C:"Trading using a false identity",D:"Creating fake account statements to defraud customers"},ans:"B",exp:"Spoofing involves placing large buy or sell orders with no intention of executing them to move prices by creating false impressions of demand or supply, then canceling after profiting from the price move. Dodd-Frank explicitly banned spoofing."},
{d:"medium",sub:"Short Selling",q:"Which regulation governs short selling and requires broker-dealers to have a 'locate' before executing a short sale?",opts:{A:"Regulation T",B:"Regulation SHO",C:"Regulation D",D:"Regulation M"},ans:"B",exp:"Regulation SHO requires broker-dealers to locate shares available to borrow before executing a short sale (the 'locate' requirement) and imposes mandatory close-out requirements for failures to deliver."},
{d:"medium",sub:"Customer Accounts",q:"Under the USA PATRIOT Act, broker-dealers must implement a Customer Identification Program (CIP) to:",opts:{A:"Check customers' credit scores before opening accounts",B:"Verify the identity of customers opening new accounts",C:"Screen customers for criminal backgrounds",D:"Obtain complete financial history from all customers"},ans:"B",exp:"The CIP requires broker-dealers to collect identifying information (name, date of birth, address, Social Security or tax ID) and verify customer identity through documentary or non-documentary means when opening new accounts."},
{d:"medium",sub:"Prohibited Activities",q:"The 'pump and dump' scheme typically targets:",opts:{A:"Large-cap stocks with high daily volume",B:"Small-cap or microcap stocks with low liquidity",C:"Treasury securities and government bonds",D:"Blue-chip stocks recommended by major banks"},ans:"B",exp:"Pump-and-dump schemes typically target thinly traded micro-cap stocks because they are easy to manipulate with limited capital. The manipulators inflate the price through false promotion, then sell their shares, leaving victims with losses."},
{d:"hard",sub:"Order Types",q:"A 'not-held' order gives the registered representative:",opts:{A:"Authority to hold the order indefinitely",B:"Discretion over timing and price without the customer holding the rep responsible for missing the market",C:"The right to cancel the order if conditions are unfavorable",D:"Automatic execution at the best price within 30 seconds"},ans:"B",exp:"A 'not-held' order gives the rep discretion over timing and price. The customer agrees not to hold the rep responsible if they miss the best price while using judgment. This contrasts with a 'held' order, which must be executed promptly."},
{d:"hard",sub:"Margin",q:"Under Regulation T, the SMA represents:",opts:{A:"Funds set aside for margin calls",B:"Excess equity above the Reg T requirement that can be used to purchase additional securities or withdrawn",C:"The customer's settlement account for cash trades",D:"The broker's reserve account for margin loans"},ans:"B",exp:"The SMA records excess equity in a margin account beyond what Reg T requires. Customers can use SMA to buy additional securities (up to twice the SMA in buying power) or withdraw cash, subject to maintenance margin being met."},
{d:"hard",sub:"Prohibited Activities",q:"Under Rule 10b-5, a misrepresentation or omission is 'material' if:",opts:{A:"It involves a transaction over $10,000",B:"There is a substantial likelihood that a reasonable investor would consider it important in an investment decision",C:"It was made intentionally by a registered person",D:"It affects the security's price by more than 5%"},ans:"B",exp:"The Supreme Court defined materiality under Rule 10b-5 as information where there is 'a substantial likelihood that a reasonable investor would consider it important' when making an investment decision. Dollar amount or price impact alone do not determine materiality."},
{d:"hard",sub:"Short Selling",q:"A short squeeze is most accurately described as:",opts:{A:"Regulators requiring short sellers to cover their positions",B:"A rapid price increase in a heavily shorted stock forcing short sellers to buy shares to cover, further driving up the price",C:"A company using its cash to buy back heavily shorted stock",D:"Short sellers coordinating to drive a stock's price down"},ans:"B",exp:"A short squeeze occurs when a heavily shorted stock's price rises rapidly, forcing short sellers to buy shares to cover their positions. This buying pressure further drives up the price, creating a cascading effect and potentially unlimited losses for short sellers."},
{d:"easy",sub:"Account Types",q:"What is a 'wrap account'?",opts:{A:"An account that bundles multiple mutual funds into a single portfolio",B:"A managed account that charges a single annual fee covering investment management and transaction costs",C:"An account that automatically rebalances to a target allocation",D:"A retirement account that wraps multiple tax-advantaged vehicles"},ans:"B",exp:"A wrap account is a managed investment account in which the client pays a single annual fee (typically a percentage of assets) that covers investment management, brokerage services, and often financial planning. All transaction costs are 'wrapped' into the fee."},
{d:"easy",sub:"Order Types",q:"An 'Immediate-or-Cancel' (IOC) order means:",opts:{A:"The order must be filled entirely or canceled",B:"Any portion of the order that can be filled immediately is executed; the rest is canceled",C:"The order must be executed within 5 minutes or it cancels",D:"The order can only be placed at the market open"},ans:"B",exp:"An IOC order executes whatever portion of the order can be filled immediately at the specified price, and the unfilled remainder is automatically canceled. Unlike AON orders, partial fills are accepted; unlike market orders, it can be a limit IOC."},
{d:"easy",sub:"Settlement",q:"In a regular-way settlement for U.S. government bonds, settlement occurs on:",opts:{A:"Same day (T+0)",B:"T+1",C:"T+2",D:"T+3"},ans:"B",exp:"U.S. government securities (Treasuries) settle on T+1 (next business day after trade date). Equities now also settle on T+1. Corporate and municipal bonds settle on T+2."},
{d:"easy",sub:"Customer Accounts",q:"Under FINRA rules, customer account statements must be sent at least:",opts:{A:"Daily",B:"Weekly",C:"Monthly if there is account activity, quarterly if inactive",D:"Only when the customer requests them"},ans:"C",exp:"FINRA rules require firms to send account statements at least quarterly. If there is activity (trades, dividends, etc.) in a month, a monthly statement must be sent. Customers may request more frequent statements."},
{d:"medium",sub:"Margin",q:"A customer buys $60,000 of marginable securities with $30,000 cash (50% Reg T requirement). If the securities rise to $75,000, the customer's equity and buying power change as follows:",opts:{A:"Equity: $30,000; no change in buying power",B:"Equity: $45,000; new buying power is generated from the excess equity above Reg T",C:"Equity: $15,000; a margin call is issued",D:"Equity: $30,000; the SMA is zero"},ans:"B",exp:"Debit balance = $30,000 (unchanged). New equity = $75,000 - $30,000 = $45,000. Reg T requires 50% x $75,000 = $37,500. Excess equity = $45,000 - $37,500 = $7,500 credited to SMA. This SMA allows the customer to buy up to $15,000 more securities (2x the SMA) without depositing additional funds."},
{d:"medium",sub:"Customer Accounts",q:"Under Regulation S-P, broker-dealers must:",opts:{A:"File a privacy notice only when opening new accounts",B:"Provide customers with an initial privacy notice and annual privacy notices, describing information sharing practices",C:"Obtain written consent from customers before sharing any information",D:"Destroy all customer records after 3 years"},ans:"B",exp:"Regulation S-P (Privacy of Consumer Financial Information) requires broker-dealers to provide customers with an initial privacy notice at account opening and annual notices thereafter, explaining what non-public personal information is collected, how it is used, and customers' opt-out rights for information sharing with non-affiliated third parties."},
{d:"medium",sub:"Prohibited Activities",q:"A registered representative who knows a customer's trade order is large enough to move the market and places a personal trade in the same direction before executing the customer's order is committing:",opts:{A:"Unauthorized trading",B:"Front-running",C:"Churning",D:"Selling away"},ans:"B",exp:"Front-running involves a rep using advance knowledge of a pending customer order that will move the market to trade for their own account first, profiting from the anticipated price move. This is illegal market manipulation and a breach of fiduciary-like duty to the customer."},
{d:"medium",sub:"Short Selling",q:"Which of the following correctly describes a 'hard to borrow' (HTB) security?",opts:{A:"A security that trades only on foreign exchanges",B:"A security with limited shares available to borrow for short selling, often commanding a higher borrowing fee",C:"A security that requires SEC approval to short sell",D:"A security exempt from short selling regulations"},ans:"B",exp:"HTB securities have limited shares available in the borrowing market—often because they are heavily shorted or thinly traded. Short sellers must pay higher borrow rates for HTB stocks, which increases the cost of maintaining a short position."},
{d:"hard",sub:"Customer Accounts",q:"FINRA's suitability rule requires reasonable-basis suitability, customer-specific suitability, and quantitative suitability. Which scenario violates ONLY quantitative suitability?",opts:{A:"Recommending a complex derivative to a customer with no derivatives experience",B:"Recommending a series of individually suitable but collectively excessive trades that generate high commissions",C:"Recommending a high-risk stock to a conservative retiree",D:"Recommending a product without understanding its characteristics"},ans:"B",exp:"Quantitative suitability is violated when a series of individually suitable recommendations results in an overall pattern of excessive trading that is not in the customer's interest (churning). The other choices violate reasonable-basis suitability (failure to understand the product) or customer-specific suitability (mismatch with the customer's profile)."},
{d:"hard",sub:"Order Types",q:"Under Regulation NMS, the 'order protection rule' (trade-through rule) requires that:",opts:{A:"All customer orders must be filled within 30 seconds",B:"Market orders must be executed before limit orders at the same price",C:"Market centers must not execute trades at prices inferior to better-priced quotes displayed by other market centers",D:"Broker-dealers must route all orders to the NYSE first"},ans:"C",exp:"The Order Protection Rule (Rule 611) under Reg NMS prohibits trade-throughs: executing an order at a price worse than the best available quote displayed by another market center. It requires routing to the best available price across all trading venues, promoting best execution."},
{d:"hard",sub:"Prohibited Activities",q:"Under FINRA Rule 2010 (Standards of Commercial Honor), which of the following statements is most accurate?",opts:{A:"The rule only applies to customer-facing activities of registered representatives",B:"The rule requires all registered persons to observe high standards of commercial honor and just and equitable principles of trade in ALL business activities, not just securities-related ones",C:"The rule applies only during market hours",D:"The rule is superseded by state business ethics laws"},ans:"B",exp:"FINRA Rule 2010 requires members and their associated persons to observe high standards of commercial honor and just and equitable principles of trade. Courts and FINRA have interpreted this broadly to cover conduct in all business activities, not just securities transactions, as long as the conduct reflects on the person's fitness to work in the industry."},

,
{"d":"easy","sub":"Order Types","q":"A fill-or-kill (FOK) order:","opts":{"A":"Must be filled over the course of the trading day","B":"Must be filled immediately in its entirety or cancelled completely","C":"Is good until the following trading day","D":"Can be partially filled and the remainder cancelled"},"ans":"B","exp":"A FOK order requires immediate and complete execution—if the full quantity cannot be filled at once, the entire order is cancelled. Unlike IOC orders, no partial fills are accepted."},
{"d":"easy","sub":"Settlement","q":"Regular-way settlement for U.S. corporate and municipal bonds occurs:","opts":{"A":"Same day (T+0)","B":"T+1","C":"T+2","D":"T+3"},"ans":"C","exp":"As of May 2024, standard (regular-way) settlement for U.S. equities, corporate bonds, and municipal bonds is T+2. Government securities and options settle T+1."},
{"d":"easy","sub":"Account Types","q":"A discretionary account authorizes:","opts":{"A":"The customer to make all trading decisions without broker input","B":"The broker to make trading decisions without the client's prior approval for each transaction","C":"Both parties to trade without any written agreement","D":"The firm to use customer funds for the firm's own account"},"ans":"B","exp":"In a discretionary account, the broker or adviser is authorized via written power of attorney to make investment decisions—including selecting securities, price, and quantity—without prior customer approval for each trade."},
{"d":"easy","sub":"Account Types","q":"In a JTWROS account, when one owner dies:","opts":{"A":"The account is frozen until probate is complete","B":"The surviving account holder(s) automatically receive the deceased's share","C":"The deceased's share passes to their estate","D":"The account is split equally among all heirs"},"ans":"B","exp":"Joint tenants with right of survivorship (JTWROS): when one owner dies, their interest automatically transfers to the surviving owner(s) outside of probate. This differs from tenants in common (TIC), where the deceased's share passes per their will."},
{"d":"easy","sub":"Margin","q":"Regulation T sets the initial margin requirement at:","opts":{"A":"25% of the purchase price","B":"50% of the purchase price","C":"75% of the purchase price","D":"100% of the purchase price"},"ans":"B","exp":"Regulation T (set by the Federal Reserve) requires investors to deposit at least 50% of the purchase price of marginable securities as initial margin. The broker-dealer funds the remaining 50%."},
{"d":"medium","sub":"Order Types","q":"A stop-limit order:","opts":{"A":"Guarantees execution at the limit price once triggered","B":"Becomes a limit order at a specified price once the stop price is reached","C":"Executes immediately at market price once triggered","D":"Is good only during extended-hours trading"},"ans":"B","exp":"A stop-limit order has two components: a stop price (activates the order) and a limit price (worst acceptable fill). Once triggered, it becomes a limit order—unlike a stop-market order, it may not execute if the market moves through the limit price too quickly."},
{"d":"medium","sub":"Short Selling","q":"SEC Rule 201 (alternative uptick rule) restricts short selling when:","opts":{"A":"A stock falls more than 5% in a day—short selling is banned entirely","B":"A stock drops 10%+ from the prior close—short sales must be above the best bid for the remainder of that day and the next","C":"Short interest exceeds 10% of the float","D":"Only institutional investors can short the security"},"ans":"B","exp":"Rule 201 imposes a circuit breaker when a stock falls 10%+ from its prior closing price. The restriction limits short sales to prices above the current national best bid for the rest of that trading day and the following day."},
{"d":"medium","sub":"Margin","q":"A margin call is triggered when:","opts":{"A":"A customer opens a new margin position","B":"The equity in a margin account falls below the maintenance margin requirement","C":"A customer's account reaches the initial margin level","D":"A customer buys securities on the same day as a prior purchase"},"ans":"B","exp":"A margin call occurs when the account equity drops below the maintenance margin (typically 25% for long positions). The broker requires the customer to deposit additional cash or securities to bring equity back to the maintenance level."},
{"d":"medium","sub":"Prohibited Activities","q":"'Painting the tape' is:","opts":{"A":"Falsifying brokerage account statements","B":"Executing trades between conspirators to create artificial trading volume and attract outside investors","C":"Marking the close to influence the closing price","D":"Reporting false earnings to inflate stock prices"},"ans":"B","exp":"Painting the tape involves wash trades or matched orders that generate artificial volume with no change in beneficial ownership, designed to lure other investors. It is market manipulation prohibited under Section 9 of the Securities Exchange Act."},
{"d":"medium","sub":"Prohibited Activities","q":"'Selling away' refers to a registered representative:","opts":{"A":"Selling securities to foreign nationals without disclosure","B":"Participating in private securities transactions outside their firm's supervision without the firm's knowledge and consent","C":"Selling securities at off-market prices","D":"Selling client securities without authorization"},"ans":"B","exp":"Selling away occurs when a registered rep sells securities not offered by their member firm without disclosure and prior approval. It removes firm supervision from customer transactions and is a serious FINRA violation."},
{"d":"medium","sub":"Account Types","q":"A UGMA/UTMA account is:","opts":{"A":"A retirement account for the self-employed","B":"A custodial account for a minor, controlled by a custodian until the minor reaches the age of majority","C":"A joint account between a parent and a corporation","D":"A trust requiring court approval for all withdrawals"},"ans":"B","exp":"UGMA/UTMA accounts allow assets to be transferred to a minor with a custodian managing the account. At the age of majority (18–21 depending on state), the former minor gains full irrevocable control."},
{"d":"hard","sub":"Margin","q":"A customer's margin account has: market value $20,000, debit balance $9,000. At 25% maintenance margin, a margin call is triggered when market value falls to:","opts":{"A":"$11,000","B":"$12,000","C":"$13,333","D":"$15,000"},"ans":"B","exp":"Margin call triggers when equity = 25% of MV. Equity = MV − Debit. So MV − $9,000 = 0.25 × MV → 0.75 × MV = $9,000 → MV = $12,000. Below $12,000 the account falls under the 25% threshold."},
{"d":"hard","sub":"Prohibited Activities","q":"'Spoofing' in securities trading involves:","opts":{"A":"Placing large orders intended to be cancelled before execution, creating a false appearance of supply or demand","B":"Front-running customer orders","C":"Spreading false rumors to move a stock price","D":"Trading on material non-public information"},"ans":"A","exp":"Spoofing: placing large bids/offers with no intent to execute, then cancelling them after the artificial signal moves prices, and trading against that movement. It was explicitly prohibited under Dodd-Frank and is aggressively prosecuted by regulators."},
{"d":"hard","sub":"Short Selling","q":"Under Regulation SHO, a threshold security is one where:","opts":{"A":"The stock fell more than 10% in a day","B":"Fails to deliver have persisted for 5 consecutive settlement days and meet a volume threshold","C":"Short interest exceeds 10% of the float","D":"The stock trades below $5 with daily fails to deliver"},"ans":"B","exp":"A threshold security has aggregate fails to deliver of 10,000+ shares daily, equal to 0.5%+ of shares outstanding, for 5 consecutive settlement days at a registered clearing agency. Broker-dealers face enhanced close-out requirements for fails in these securities."},
{"d":"easy","sub":"Account Types","q":"Pattern day trader (PDT) rules apply to a customer who:","opts":{"A":"Makes any short sale in a given day","B":"Executes 4 or more day trades in 5 business days in a margin account if those trades represent more than 6% of total trades","C":"Trades options on any given day","D":"Maintains a margin balance over $25,000"},"ans":"B","exp":"FINRA defines a pattern day trader as someone who executes 4+ day trades in a rolling 5-business-day period in a margin account, where those day trades exceed 6% of the account's total trades. PDTs must maintain a $25,000 minimum equity balance."},
{"d":"medium","sub":"Account Types","q":"A wrap account:","opts":{"A":"Charges per-trade commissions plus an advisory fee","B":"Bundles investment management and brokerage services into a single all-inclusive fee based on assets","C":"Is a type of retirement account with special tax treatment","D":"Limits the investor to a single mutual fund family"},"ans":"B","exp":"A wrap account bundles portfolio management, trading, and custodial services into one annual fee (typically 1–3% of AUM) rather than per-transaction commissions. This aligns the adviser's incentives with the client's because excessive trading doesn't generate extra revenue."},
{"d":"easy","sub":"Order Types","q":"A 'good till cancelled' (GTC) order:","opts":{"A":"Expires at the end of each trading day if not filled","B":"Remains in force until executed or explicitly cancelled by the customer","C":"Is good only for the current trading session","D":"Must be filled or cancelled within 48 hours"},"ans":"B","exp":"A GTC order remains active until it is either executed or the customer cancels it. Broker-dealers often set internal limits on GTC duration (e.g., 60–90 days) even though the order technically persists until cancelled."},
{"d":"medium","sub":"Margin","q":"The 'Special Memorandum Account' (SMA) in a margin account represents:","opts":{"A":"The total amount owed to the broker-dealer","B":"Accumulated buying power that can be used without triggering a Reg T call, created by excess equity above the Reg T requirement","C":"A separate account for holding government securities","D":"The margin requirement for options positions"},"ans":"B","exp":"SMA is a line of credit that builds up in a margin account when equity exceeds the Reg T 50% requirement (due to market appreciation or deposits). The customer can borrow against SMA without making a new Reg T deposit, providing additional buying power."},
{"d":"medium","sub":"Prohibited Activities","q":"Front-running is:","opts":{"A":"Being the first broker to execute a customer order in a new trading day","B":"Trading for one's own account ahead of a customer's large pending order, knowing the customer's trade will likely move the price","C":"Buying IPO shares before they begin trading on the exchange","D":"Executing orders faster than competitors using advanced technology"},"ans":"B","exp":"Front-running is a prohibited practice where a broker-dealer or registered representative trades in a security for their own account ahead of a known large customer order, profiting from the anticipated price impact of that customer's trade."},
{"d":"hard","sub":"Account Types","q":"Regulation T excess in a margin account:","opts":{"A":"Must be withdrawn within 5 business days","B":"Can be used as SMA buying power or withdrawn; if withdrawn, the SMA decreases accordingly","C":"Automatically reduces the debit balance","D":"Triggers a required contribution from the customer"},"ans":"B","exp":"Excess equity above the Reg T 50% requirement is credited to the SMA. The customer may withdraw this excess as cash or use it to support new purchases (each dollar of SMA supports $2 of new purchases). Withdrawing cash reduces SMA dollar-for-dollar."},
{"d":"easy","sub":"Order Types","q":"A 'market order' guarantees:","opts":{"A":"Execution at the best available price but not a specific price","B":"Execution at the last traded price","C":"Execution at the opening price of the next trading day","D":"Execution within 1 minute of submission"},"ans":"A","exp":"A market order guarantees execution (assuming the market is open and liquid) at the best currently available price, but provides no price certainty. In fast-moving or illiquid markets, the execution price may differ significantly from the last traded price."},
{"d":"easy","sub":"Settlement","q":"Government securities (Treasuries) settle on:","opts":{"A":"Same day (T+0)","B":"T+1","C":"T+2","D":"T+3"},"ans":"B","exp":"U.S. Treasury securities settle on T+1 (trade date plus one business day). This differs from equities, corporate bonds, and municipal bonds, which settle on T+2."},
{"d":"easy","sub":"Account Types","q":"A cash account differs from a margin account in that:","opts":{"A":"Cash account holders can borrow against their securities","B":"Cash account holders must pay for securities in full by settlement date—no borrowing allowed","C":"Cash accounts earn higher interest on idle balances","D":"Cash accounts are available only to retail investors"},"ans":"B","exp":"In a cash account, investors must pay in full for all securities purchased by the settlement date. Borrowing (margin) is not permitted. In a margin account, investors can borrow a portion of the purchase price from the broker-dealer."},
{"d":"medium","sub":"Prohibited Activities","q":"Insider trading based on material non-public information is prohibited under:","opts":{"A":"FINRA Rule 2010 only","B":"Section 10(b) of the Securities Exchange Act and SEC Rule 10b-5","C":"The Securities Act of 1933 exclusively","D":"Blue sky laws only"},"ans":"B","exp":"Insider trading is primarily prosecuted under Section 10(b) of the Exchange Act and SEC Rule 10b-5, which broadly prohibit fraud in connection with securities transactions. The Insider Trading Sanctions Act of 1984 and Insider Trading and Securities Fraud Enforcement Act of 1988 added civil and criminal penalties."},
{"d":"medium","sub":"Account Types","q":"'Tenants in Common' (TIC) differs from JTWROS in that:","opts":{"A":"TIC requires equal ownership percentages among all tenants","B":"Each TIC owner's share passes to their estate upon death rather than to surviving co-owners","C":"TIC accounts are only available to business partners","D":"TIC accounts require all owners' signatures for any transaction"},"ans":"B","exp":"In a TIC account, each owner holds a separate, divisible interest that passes to their estate (per their will) upon death. In JTWROS, the deceased's interest automatically passes to surviving account holders. TIC also permits unequal ownership percentages."},
{"d":"medium","sub":"Margin","q":"A customer receives a margin call. They can satisfy it by:","opts":{"A":"Selling securities from their IRA","B":"Depositing additional cash or marginable securities, or selling securities in the account to reduce the debit balance","C":"Requesting an extension of up to 30 days from their broker","D":"Converting the margin account to a cash account"},"ans":"B","exp":"A margin call can be met by: (1) depositing additional cash, (2) depositing marginable securities, or (3) selling securities in the account (proceeds reduce the debit balance and restore the equity percentage). Brokers may liquidate positions without notice if a margin call is not met."},
{"d":"medium","sub":"Short Selling","q":"Short selling a stock involves:","opts":{"A":"Buying a put option on the stock","B":"Borrowing shares and selling them, hoping to repurchase them later at a lower price","C":"Selling shares of a stock already owned","D":"Buying the stock at a discount through a rights offering"},"ans":"B","exp":"Short selling: an investor borrows shares from a broker and sells them at current market price, expecting the price to fall. If the price falls, the short seller repurchases (covers) at the lower price, returns the shares, and profits from the difference. The potential loss is unlimited if the price rises."},
{"d":"hard","sub":"Account Types","q":"A 'wrap fee' account charges:","opts":{"A":"A per-trade commission plus an annual custodial fee","B":"A single all-inclusive annual fee (typically % of AUM) covering investment management, trading, and custodial services","C":"No fees for trades but charges a performance fee if returns exceed a benchmark","D":"A monthly flat fee regardless of account size"},"ans":"B","exp":"Wrap accounts bundle investment management, trade execution, and custody into one fee (typically 1-3% of AUM annually). They eliminate per-trade commissions, aligning adviser incentives with clients (excessive trading doesn't generate extra revenue). They may be more expensive than commission-based accounts for low-turnover investors."},
{"d":"easy","sub":"Order Types","q":"A 'limit order' specifies:","opts":{"A":"The maximum number of shares to trade","B":"The maximum price to pay (buy limit) or minimum price to accept (sell limit)","C":"A guaranteed execution price","D":"That the order must be filled within a specified time"},"ans":"B","exp":"A limit order sets a price boundary: a buy limit order will only execute at or below the limit price; a sell limit order will only execute at or above the limit price. Unlike market orders, limit orders may not be executed if the market doesn't reach the specified price."},
{"d":"medium","sub":"Prohibited Activities","q":"'Churning' a customer account is a violation because:","opts":{"A":"The broker is recommending unsuitable investments","B":"The broker is making excessive trades primarily to generate commissions, not in the client's interest","C":"The client is trading too frequently for their account size","D":"The trades exceed the client's stated risk tolerance"},"ans":"B","exp":"Churning occurs when a broker excessively trades a customer's account for the primary purpose of generating commissions rather than serving the client's investment needs. It violates FINRA rules, the Exchange Act, and fiduciary duties. Courts and regulators look at turnover rates, cost-equity ratios, and broker control."},
{"d":"medium","sub":"Settlement","q":"If an investor fails to pay for a securities purchase in a cash account by the settlement date, what may the broker-dealer do?","opts":{"A":"Convert the account to a margin account automatically","B":"Cancel the trade and freeze the account for 90 days, requiring prepayment for future trades","C":"Charge a late fee and allow 30 additional days","D":"Report the investor to the SEC for enforcement action"},"ans":"B","exp":"If a cash account customer fails to pay by settlement (a 'freeriding' violation), the broker must cancel (liquidate) the position. The account is then restricted (frozen) for 90 days, meaning the customer must deposit full payment before placing any new purchase orders during that period."},
{"d":"hard","sub":"Margin","q":"The maintenance margin requirement for a short margin account is:","opts":{"A":"The same as the initial margin requirement of 50%","B":"Typically 30% of the current market value of the short securities","C":"25% of the initial sale proceeds","D":"100% of the market value of shorted securities"},"ans":"B","exp":"For short margin accounts, FINRA requires a maintenance margin of at least 30% of the current market value of the shorted securities. As the short stock rises in price, the required margin increases, potentially triggering a margin call. The initial Reg T requirement is also 50% on short sales."},
{"d":"easy","sub":"Account Types","q":"A 'fiduciary' account requires the account manager to:","opts":{"A":"Maximize investment returns above all else","B":"Act in the best interest of the beneficiary and prudently manage assets","C":"Obtain beneficiary approval for every trade","D":"Invest only in government-guaranteed securities"},"ans":"B","exp":"Fiduciary accounts (trusts, guardianships, estates) require the fiduciary (trustee, guardian, executor) to act solely in the beneficiary's best interest and manage assets with the care, skill, and diligence of a prudent investor. This is a higher standard than the suitability standard applicable to broker-dealers."},
{"d":"medium","sub":"Prohibited Activities","q":"'Marking the close' is prohibited market manipulation involving:","opts":{"A":"Setting the opening price of a security by placing large orders before the market opens","B":"Executing trades near market close to artificially influence the closing price of a security","C":"Keeping a security's price stable by continuous buying throughout the day","D":"Withholding trade reports until after the market closes"},"ans":"B","exp":"Marking the close involves trading near the market's close to artificially influence the closing price—which is used for performance benchmarking, margin calls, index rebalancing, and fund NAV calculations. It is a form of market manipulation prohibited under the Exchange Act."},
{"d":"medium","sub":"Account Types","q":"Under ERISA, a 'qualified retirement plan' must:","opts":{"A":"Be funded entirely by employer contributions","B":"Meet specific IRS requirements for tax-favored treatment, including coverage, vesting, and funding standards","C":"Invest only in employer stock","D":"Be offered to only highly compensated employees"},"ans":"B","exp":"ERISA (Employee Retirement Income Security Act) governs qualified retirement plans (401(k), pension, profit-sharing). Plans must meet minimum coverage (who must be included), vesting schedules, and funding requirements to receive tax-favored treatment. ERISA fiduciaries must act in participants' best interests."},
{"d":"easy","sub":"Order Types","q":"A 'day order' is:","opts":{"A":"Valid for one week from submission","B":"Cancelled if not executed by the end of the trading day","C":"Valid only during the first hour of trading","D":"Good until the end of the current month"},"ans":"B","exp":"A day order expires at the end of the trading day if not executed. It is the default time-in-force for most order types unless the customer specifies otherwise (e.g., GTC, IOC)."},
{"d":"easy","sub":"Settlement","q":"Options contracts settle:","opts":{"A":"T+2 like equities","B":"T+1 (the business day after the trade date)","C":"Same day (T+0)","D":"T+3 for complex multi-leg strategies"},"ans":"B","exp":"Listed options settle on T+1 (trade date plus one business day), unlike equities which settle T+2. This means when an option is exercised, shares must be delivered by the next business day."},
{"d":"medium","sub":"Account Types","q":"In a margin account, the 'debit balance' represents:","opts":{"A":"The cash the customer must deposit immediately","B":"The amount borrowed from the broker-dealer to purchase securities","C":"The difference between the account's gain and loss","D":"The amount of unrealized gains in the account"},"ans":"B","exp":"The debit balance is the total amount borrowed from the broker-dealer in a margin account. It accrues interest charged by the broker. Equity = Market Value - Debit Balance. As securities decline in value, equity decreases while the debit balance remains unchanged."},
{"d":"medium","sub":"Prohibited Activities","q":"The 'free-riding' violation in a cash account occurs when:","opts":{"A":"A customer refuses to pay any commissions","B":"A customer buys a security and then sells it before paying for it, using the sale proceeds to fund the purchase","C":"A broker executes unauthorized trades for profit","D":"A customer withdraws cash from the account before settlement"},"ans":"B","exp":"In a cash account, free-riding occurs when a customer buys a security and, before paying for it, sells it and uses the proceeds to pay for the original purchase. This violates Regulation T's payment requirements. The account is frozen for 90 days, requiring prepayment for future purchases."},
{"d":"hard","sub":"Short Selling","q":"When a short seller's stock pays a dividend, the short seller must:","opts":{"A":"Receive the dividend from the lender","B":"Pay an amount equal to the dividend to the owner of the borrowed shares","C":"Cover the short immediately on the record date","D":"Do nothing—dividends are the lender's responsibility"},"ans":"B","exp":"When a short seller borrows and sells shares, the buyer of those shares receives dividends from the company. However, the original owner (who lent the shares) also expects dividend income. The short seller must make a 'payment in lieu of dividends' to the lender, equal to the dividend amount."},
{"d":"medium","sub":"Account Types","q":"Which of the following accounts requires a trustee to be named?","opts":{"A":"Individual account","B":"Joint account (JTWROS)","C":"Trust account","D":"Corporate account"},"ans":"C","exp":"A trust account is managed by a trustee for the benefit of a beneficiary (or beneficiaries) according to the trust document. The trustee has a fiduciary obligation to manage assets in the beneficiaries' best interests. Unlike JTWROS or individual accounts, trust accounts require a formal trust agreement and trustee designation."},
