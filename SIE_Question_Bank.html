{"d":"easy","sub":"Order Types","q":"An 'immediate or cancel' (IOC) order:","opts":{"A":"Must be filled immediately in full or cancelled","B":"Executes whatever quantity is available immediately; any unfilled portion is cancelled","C":"Is valid for 5 minutes then automatically cancelled","D":"Guarantees execution at the best available price"},"ans":"B","exp":"An IOC order must be executed immediately, but unlike FOK (fill-or-kill), partial fills are acceptable. Whatever portion cannot be filled immediately is cancelled. IOC orders are common for large institutional orders where partial execution is acceptable."},
{"d":"medium","sub":"Margin","q":"The 'loan value' in a margin account refers to:","opts":{"A":"The total cost of securities in the account","B":"The maximum amount a customer can borrow based on the marginable value of securities held","C":"The debit balance owed to the broker-dealer","D":"The amount the broker-dealer will lend for options purchases"},"ans":"B","exp":"Loan value is the maximum credit a broker-dealer can extend against marginable securities (50% of market value under Reg T for equities). Non-marginable securities (stocks under $5, some OTC stocks) have zero loan value. The loan value determines the total buying power available to the customer."},
{"d":"hard","sub":"Margin","q":"Restricted accounts in margin:","opts":{"A":"Are accounts that have been frozen due to free-riding violations","B":"Are margin accounts where equity has fallen below the Reg T requirement (50%) but is still above the maintenance margin","C":"Are accounts that cannot be used for short selling","D":"Are margin accounts held by restricted persons (company insiders)"},"ans":"B","exp":"A restricted margin account has equity below the 50% Reg T requirement (often due to declining security prices) but above the maintenance margin floor. In a restricted account, the customer cannot make new purchases unless they deposit additional funds—they can only sell or maintain current positions."},
{"d":"medium","sub":"Prohibited Activities","q":"Excessive mark-ups on OTC transactions violate:","opts":{"A":"Only state blue sky laws","B":"FINRA's 5% policy guideline and the prohibition against unfair dealing","C":"Only Regulation T","D":"Only if the mark-up exceeds 10%"},"ans":"B","exp":"FINRA's 5% policy (a guideline, not a hard rule) suggests that mark-ups, mark-downs, and commissions should not exceed 5% of the price for typical OTC transactions. Factors include the price, the type of security, availability, and the firm's costs. Mark-ups significantly above 5% may constitute unfair dealing and violate FINRA Rule 2010."},
{"d":"easy","sub":"Account Types","q":"A 'beneficiary designation' on a brokerage account allows:","opts":{"A":"The beneficiary to trade in the account while the owner is alive","B":"Assets to pass directly to the named beneficiary upon the account owner's death, bypassing probate","C":"The beneficiary to withdraw up to 50% of assets at any time","D":"Two owners to hold equal shares of the account"},"ans":"B","exp":"A beneficiary designation (transfer-on-death or TOD designation) specifies who receives the account assets upon the owner's death. Assets transfer directly to the named beneficiary outside of probate. This is a simple, cost-effective estate planning tool for brokerage accounts."},
{"d":"medium","sub":"Short Selling","q":"The 'short interest ratio' (days to cover) is:","opts":{"A":"The percentage of a stock's float that is sold short","B":"The total short interest divided by average daily trading volume—estimating how many days it would take all short sellers to cover","C":"The ratio of short sales to total trades in a day","D":"The interest rate charged to borrow shares for short selling"},"ans":"B","exp":"Days to cover (short interest ratio) = Total shares sold short ÷ Average daily volume. A high ratio (e.g., 10+ days) means it would take many days for shorts to cover, creating squeeze risk if the stock rallies. It is published bi-monthly by exchanges and watched as a market sentiment indicator."},
{"d":"hard","sub":"Account Types","q":"A 'prime brokerage' agreement differs from a standard brokerage agreement primarily in that it:","opts":{"A":"Charges no commissions","B":"Provides a bundle of services including custody, leverage, securities lending, and trade execution from multiple brokers under one umbrella","C":"Is restricted to retail customers with over $10 million","D":"Allows trading in unregistered securities without SEC approval"},"ans":"B","exp":"Prime brokerage bundles services for institutional clients (hedge funds): centralized custody, securities lending for short selling, leveraged financing, trade clearing from multiple executing brokers, and comprehensive reporting. This consolidated relationship allows institutions to trade across many venues while maintaining one primary relationship."},
{"d":"easy","sub":"Margin","q":"Buying on margin requires an investor to:","opts":{"A":"Have a minimum account balance of $100,000","B":"Deposit at least 50% of the purchase price (Reg T) and maintain minimum equity per FINRA maintenance requirements","C":"Pledge real estate as collateral","D":"Have a perfect credit score and 5 years of investing experience"},"ans":"B","exp":"Margin accounts require: (1) Reg T initial deposit of 50% of purchase price; (2) FINRA minimum equity of $2,000 to open; (3) ongoing maintenance margin (typically 25% of market value). The broker-dealer provides the remaining funds as a loan, charging margin interest."},
{"d":"medium","sub":"Account Types","q":"Securities held in 'street name' means:","opts":{"A":"The securities are traded on the NYSE, which is on Wall Street","B":"The securities are registered in the name of the broker-dealer (nominee) on behalf of the beneficial owner (customer)","C":"The securities are held in physical certificate form at the investor's home","D":"The securities have no registered owner"},"ans":"B","exp":"Most securities are held in 'street name'—registered in the broker-dealer's name (or its nominee) on the issuer's books, while the customer is the beneficial owner tracked in the broker-dealer's records. This simplifies settlement, dividend collection, and corporate actions. The customer retains all economic and voting rights."},
{"d":"medium","sub":"Prohibited Activities","q":"An agent engages in 'unauthorized trading' when they:","opts":{"A":"Trade securities outside normal market hours","B":"Execute trades in a customer's account without that customer's prior authorization","C":"Trade securities not listed on major exchanges","D":"Execute trades for their personal account using the firm's systems"},"ans":"B","exp":"Unauthorized trading is executing transactions in a customer's account without their knowledge and prior consent (unless the account is a legitimate discretionary account with a written trading authorization). It is a violation of FINRA rules and fiduciary principles regardless of whether the trades are profitable."},
{"d":"easy","sub":"Settlement","q":"A 'regular way' options contract settlement on exercise is:","opts":{"A":"T+0 (same day)","B":"T+1 (next business day)","C":"T+2 (two business days)","D":"T+3 (three business days)"},"ans":"B","exp":"When an options contract is exercised, the underlying shares resulting from that exercise settle on T+1 (the next business day). The options contract itself settles T+1, meaning the buyer's account is credited/debited and the seller's account is debited/credited the day after exercise."},
{"d":"hard","sub":"Prohibited Activities","q":"'Pump and dump' fraud involves:","opts":{"A":"Acquiring large positions in blue-chip stocks and quietly selling at small profits","B":"Artificially inflating a stock's price through false or misleading statements, then selling the position at the inflated price before the price collapses","C":"Short selling a stock and then releasing negative research","D":"Accumulating shares in a target company before a hostile takeover announcement"},"ans":"B","exp":"Pump and dump: manipulators acquire shares of a thinly traded (often penny) stock, then aggressively promote it through false claims about the company's prospects via social media, email spam, or message boards. When the price rises (pump), they sell their shares (dump), leaving other investors with losses as the price collapses."},
{"d":"medium","sub":"Account Types","q":"Under FINRA rules, a new margin account must have a minimum equity of:","opts":{"A":"$1,000","B":"$2,000","C":"$5,000","D":"$10,000"},"ans":"B","exp":"FINRA requires a minimum deposit of $2,000 (or 100% of the purchase price if less than $2,000) before a customer can begin margin trading. This minimum equity requirement exists regardless of the Reg T 50% initial margin calculation."},
{"d":"medium","sub":"Order Types","q":"A 'not held' (NH) order gives the broker:","opts":{"A":"No discretion over the execution","B":"Discretion over the time and price of execution to obtain the best result","C":"Authorization to hold the order for up to 30 days","D":"The ability to execute the order in multiple markets simultaneously"},"ans":"B","exp":"A 'not held' order grants the floor broker or trader discretion over timing and price of execution to obtain the best result for the customer. Unlike a held order (which requires prompt execution), NH orders allow the broker to exercise judgment—useful for large orders where rushing could adversely impact the price."},
{"d":"hard","sub":"Account Types","q":"A 'discretionary account' requires all of the following EXCEPT:","opts":{"A":"Written authorization from the customer","B":"Acceptance by an authorized principal of the member firm","C":"Review of all discretionary transactions by a supervisor","D":"Approval from FINRA before any discretionary trades"},"ans":"D","exp":"Discretionary accounts require: (1) written power of attorney from the customer, (2) acceptance by a principal of the firm. All discretionary transactions must be reviewed (frequently) by a supervisory principal for appropriateness. FINRA does not pre-approve individual discretionary accounts—this is handled internally by the firm's supervisory structure."},
{"d":"medium","sub":"Short Selling","q":"A 'buy stop' order is often used by short sellers to:","opts":{"A":"Initiate a new short position when a stock rises to a target price","B":"Limit losses on a short position by automatically covering if the stock rises to the stop price","C":"Buy additional shares at a discount when the stock falls","D":"Execute a short sale at a specific maximum price"},"ans":"B","exp":"A buy stop order (placed above the current market price) triggers automatically when the stock rises to the stop price, converting to a market order to buy (cover the short). Short sellers use buy stops to cap losses—if the shorted stock rises to an unacceptable level, the stop triggers and covers the short automatically."},
{"d":"easy","sub":"Account Types","q":"A 'corporate account' requires:","opts":{"A":"Only the CEO's signature on all transactions","B":"Corporate resolution documents specifying who is authorized to act on behalf of the corporation in the account","C":"Approval from FINRA before trading can begin","D":"All shareholders of the corporation to sign the account agreement"},"ans":"B","exp":"When opening a corporate brokerage account, the firm must obtain: the corporate charter/articles of incorporation, a corporate resolution from the board of directors specifying who is authorized to act on the account and what activities are permitted, and a list of authorized signers."},
{"d":"medium","sub":"Margin","q":"The 'Regulation T call' (Fed call) differs from a 'maintenance call' in that:","opts":{"A":"A Reg T call triggers when margin equity falls below 25%; maintenance calls at below 50%","B":"A Reg T call arises when a new purchase is not fully paid by settlement; a maintenance call arises when existing equity falls below the minimum maintenance level","C":"They are the same type of call with different names","D":"Reg T calls can only be met with cash; maintenance calls can be met with securities"},"ans":"B","exp":"A Regulation T call is triggered when a customer makes a new margin purchase but doesn't deposit the required 50% initial margin by settlement. A maintenance call occurs when existing positions decline in value and equity drops below the maintenance minimum (25%). Both must be met promptly, but they arise from different circumstances."},
{"d":"medium","sub":"Prohibited Activities","q":"FINRA's 5% markup policy applies to:","opts":{"A":"All securities transactions without exception","B":"OTC securities transactions where the firm acts as principal (dealer)—it is a guideline, not an absolute rule","C":"Only equity transactions, not fixed income","D":"Transactions only if the customer complains about the markup"},"ans":"B","exp":"FINRA's 5% policy is a guideline (not a rule) for markups/markdowns on OTC principal transactions and commissions on agency transactions. The 5% is not an absolute limit—factors include security type, price, firm costs, and market conditions. Markups on some low-priced or illiquid securities may be held to a lower standard."},
{"d":"easy","sub":"Order Types","q":"A 'sell stop' order is placed:","opts":{"A":"Above the current market price to capture gains","B":"Below the current market price to limit losses or protect profits on a long position","C":"At exactly the current market price","D":"Only by institutions, not retail investors"},"ans":"B","exp":"A sell stop order (stop-loss) is placed below the current market price. If the stock falls to the stop price, the order converts to a market sell order. Investors use sell stops to limit losses (exit a losing position automatically) or to protect profits (lock in gains by stopping out if the price reverses)."},
{"d":"medium","sub":"Account Types","q":"Securities Investor Protection Act (SIPA) applies when:","opts":{"A":"An investor loses money due to market declines","B":"A broker-dealer becomes insolvent and customer assets are missing or insufficient to cover claims","C":"An investor is defrauded by an investment adviser","D":"A public company commits accounting fraud causing investor losses"},"ans":"B","exp":"SIPA (1970) established SIPC to protect investors when a broker-dealer fails and customer assets are missing. SIPC is not an insurance policy against bad investments—it specifically addresses the insolvency of broker-dealers and the need to return customer property or compensate within statutory limits."},
{"d":"hard","sub":"Short Selling","q":"In a short margin account, equity is calculated as:","opts":{"A":"Market value minus debit balance","B":"Short market value subtracted from the credit balance (original proceeds plus initial margin deposit)","C":"Initial margin deposit only","D":"Current market value plus unrealized gain on the short position"},"ans":"B","exp":"In a short account: the credit balance = short sale proceeds + initial margin deposited (e.g., $10,000 proceeds + $5,000 deposit = $15,000 credit). Equity = Credit Balance - Current Market Value of short position. If the short stock rises (MV increases), equity decreases. Maintenance margin = 30% of current MV."},
{"d":"medium","sub":"Prohibited Activities","q":"An agent who executes trades in a customer account and keeps the profits but does not charge the customer is still violating rules because:","opts":{"A":"All profits from customer accounts belong to the firm","B":"Using customer accounts for personal benefit without authorization is a prohibited practice regardless of whether the customer profits or loses","C":"The agent should have disclosed the strategy to earn management fees","D":"This is only a violation if the customer loses money"},"ans":"B","exp":"Unauthorized use of customer accounts for personal benefit—even if profitable for the customer—is a prohibited practice. The agent has not obtained proper authorization, has violated trust, and may have exposed the customer to risks not disclosed or approved. Intent to profit at the customer's expense is not required for the violation to occur."},
{"d":"easy","sub":"Prohibited Activities","q":"A broker who recommends an unsuitable investment to a customer in exchange for a higher commission is primarily violating:","opts":{"A":"FINRA's suitability rule and the prohibition against self-dealing","B":"The margin rules under Regulation T","C":"The short-selling rules under Regulation SHO","D":"The trading rules under Regulation NMS"},"ans":"A","exp":"Recommending an investment primarily to generate higher compensation rather than because it is appropriate for the customer violates FINRA Rule 2111 (suitability) and the broader prohibition against placing one's own interests above the customer's. Under Reg BI, this also violates the obligation to act in the customer's best interest."},
{"d":"medium","sub":"Short Selling","q":"A 'short squeeze' occurs when:","opts":{"A":"The SEC forces short sellers to cover their positions","B":"Rising prices force short sellers to cover, which further drives the price higher in a self-reinforcing cycle","C":"Short interest exceeds available shares to borrow","D":"A company announces a dividend that short sellers must pay"},"ans":"B","exp":"A short squeeze: when a heavily shorted stock's price rises, short sellers face losses and margin calls, forcing them to buy shares to cover their shorts. This buying demand further drives the price up, triggering more forced covering. The result is a rapid, dramatic price spike (e.g., GameStop in January 2021)."},
{"d":"easy","sub":"Account Types","q":"For a discretionary account, the written trading authorization must be:","opts":{"A":"Renewed annually","B":"Obtained before any discretionary order is placed","C":"Filed with FINRA within 10 days","D":"Witnessed by two compliance officers"},"ans":"B","exp":"Written discretionary authorization (limited power of attorney) must be obtained from the customer BEFORE any discretionary trades are placed. Without written authorization, any trade the rep places without the customer's prior approval for that specific trade is an unauthorized trade. The form must be kept on file."},
{"d":"medium","sub":"Margin","q":"The 'buying power' in a margin account refers to:","opts":{"A":"The total market value of all securities in the account","B":"The total dollar amount of additional securities the customer can purchase without depositing new funds","C":"The cash balance in the account available for withdrawal","D":"The amount already borrowed from the broker-dealer"},"ans":"B","exp":"Buying power is the total purchase value available given current equity. In a standard margin account: Buying power = SMA × 2 (each dollar of SMA supports $2 of new purchases at 50% margin). High buying power doesn't mean unlimited risk—the resulting debt must be maintained above the maintenance margin threshold."},
{"d":"hard","sub":"Prohibited Activities","q":"Under SEC Rule 15c3-1, broker-dealers must maintain:","opts":{"A":"A 10% cash reserve against all customer deposits","B":"Minimum net capital based on their business activity to ensure they can meet obligations to customers","C":"A maximum leverage ratio of 10:1 on all securities positions","D":"Separate accounts for each customer's securities"},"ans":"B","exp":"The Net Capital Rule (Rule 15c3-1) requires broker-dealers to maintain minimum net capital (liquid assets minus liabilities and certain haircuts on securities) based on their activities. It is designed to ensure firms have enough liquid assets to meet obligations to customers and creditors. Violations of net capital rules trigger regulatory action and can lead to business suspension."},
{"d":"medium","sub":"Order Types","q":"A 'buy stop' order is placed:","opts":{"A":"Below the current market price to get a bargain entry","B":"Above the current market price—it triggers when the stock rises to that level","C":"At exactly the current bid price","D":"Only by institutional investors hedging positions"},"ans":"B","exp":"A buy stop order is placed above the current market price. If the stock rises to the stop price, the order triggers and converts to a market buy order. Buy stops are used by: (1) short sellers to limit losses (cover if price rises), (2) momentum traders to enter a position once it breaks through resistance."},
{"d":"easy","sub":"Account Types","q":"An executor of an estate may open a brokerage account to:","opts":{"A":"Trade actively to maximize the estate's value","B":"Manage, collect, and distribute estate assets in accordance with the decedent's will or state law","C":"Convert the estate's securities into permanent trusts","D":"Avoid estate taxes through active trading strategies"},"ans":"B","exp":"An executor (or personal representative) is appointed to administer a deceased person's estate—collecting assets, paying debts and taxes, and distributing the remainder per the will. They may open an estate account to hold and manage securities during this process. They owe a fiduciary duty to the beneficiaries."},
{"d":"medium","sub":"Prohibited Activities","q":"An investment adviser who trades securities for their personal account based on knowledge of pending customer orders is engaging in:","opts":{"A":"Legitimate portfolio rebalancing","B":"Front-running—using knowledge of customer orders to trade ahead of those orders for personal benefit","C":"Permissible market making","D":"Legal hedging of the firm's risk exposure"},"ans":"B","exp":"Front-running by an investment adviser who knows about large pending customer orders and trades their personal account ahead of those orders to profit from the anticipated price impact is a serious breach of fiduciary duty and securities fraud. Advisers owe their clients a duty of loyalty and must not trade ahead of client transactions."},
{"d":"easy","sub":"Retirement Accounts","q":"Required Minimum Distributions (RMDs) from Traditional IRAs must begin by:","opts":{"A":"Age 59½","B":"April 1 of the year following the year you turn 73","C":"Age 65, regardless of retirement status","D":"The year the account holder stops working"},"ans":"B","exp":"Under the SECURE Act 2.0 (2022), RMDs from Traditional IRAs, 401(k)s, and most other retirement plans must begin by April 1 of the year following the year the account holder turns 73. Roth IRAs are NOT subject to RMDs during the original owner's lifetime."},
{"d":"easy","sub":"Retirement Accounts","q":"A direct rollover from a 401(k) to a Traditional IRA:","opts":{"A":"Is subject to 20% mandatory withholding","B":"Must be completed within 60 days to avoid taxes","C":"Results in funds moving directly between institutions with no tax withholding","D":"Can only be done once in a lifetime"},"ans":"C","exp":"In a direct rollover, funds move directly from the old plan to the new IRA (or plan), with no check issued to the account holder. There is no mandatory 20% withholding, no 60-day deadline, and no limit on frequency. This is always preferred over an indirect rollover."},
{"d":"medium","sub":"Retirement Accounts","q":"An investor takes an indirect rollover from their 401(k). Their employer withholds 20% for taxes. To avoid any tax liability, the investor must deposit into the new IRA:","opts":{"A":"Only the amount received (80% of the total)","B":"The full 100% of the original distribution, including the 20% that was withheld","C":"The amount received plus interest earned in 60 days","D":"Any amount within 60 days; taxes on the remainder can be filed as an amended return"},"ans":"B","exp":"In an indirect rollover, the employer withholds 20% for potential taxes. To avoid treating the withheld amount as a taxable distribution (plus 10% early withdrawal penalty if under 59½), the investor must deposit 100% of the original amount—including the 20% withheld—into the new IRA within 60 days. The withheld tax is recovered when filing the annual tax return."},
{"d":"medium","sub":"Retirement Accounts","q":"Which of the following is NOT an exception to the 10% early withdrawal penalty from an IRA?","opts":{"A":"Disability","B":"Purchasing a second vacation home","C":"Substantially equal periodic payments (72t/SEPP)","D":"Higher education expenses for the account holder's child"},"ans":"B","exp":"Exceptions to the 10% early withdrawal penalty include: death, disability, substantially equal periodic payments (SEPP/72t), first-time home purchase (up to $10,000 lifetime), higher education expenses, health insurance premiums while unemployed, and medical expenses exceeding 7.5% of AGI. Purchasing a second home or vacation property does NOT qualify."},
{"d":"easy","sub":"Retirement Accounts","q":"A Roth IRA differs from a Traditional IRA primarily in that:","opts":{"A":"Roth contributions are tax-deductible; Traditional contributions are not","B":"Roth contributions are made with after-tax dollars; qualified distributions are tax-free","C":"Roth IRAs require RMDs at age 73; Traditional IRAs do not","D":"Roth IRAs have no contribution limits; Traditional IRAs are capped at $7,000"},"ans":"B","exp":"Roth IRA contributions are made with after-tax dollars (no deduction). The benefit: qualified withdrawals (after age 59½ and 5-year holding period) are completely tax-free, including earnings. Traditional IRA contributions may be tax-deductible; withdrawals are taxed as ordinary income. Roth IRAs have no RMDs during the original owner's lifetime."}
],
regulatory:[
{d:"easy",sub:"Securities Act 1933",q:"The Securities Act of 1933 is often called the 'truth in securities law' because it:",opts:{A:"Requires ongoing disclosure by public companies",B:"Requires full and fair disclosure in connection with new securities offerings",C:"Created the SEC",D:"Prohibits insider trading"},ans:"B",exp:"The '33 Act requires issuers of new securities to register with the SEC and provide full and fair disclosure to investors through a prospectus. Its goal is ensuring investors have accurate information before investing in new offerings."},
{d:"easy",sub:"Securities Act 1933",q:"SEC registration of a securities offering means the SEC has:",opts:{A:"Guaranteed the accuracy of the prospectus",B:"Approved the merits of the investment",C:"Reviewed the disclosure but does not endorse the investment",D:"Insured investors against loss"},ans:"C",exp:"SEC registration does NOT guarantee accuracy or approve the investment's merits. The SEC reviews disclosure for completeness and compliance, but it does not vouch for the truth of statements or the investment's quality."},
{d:"easy",sub:"Securities Exchange Act 1934",q:"The Securities Exchange Act of 1934 established the SEC primarily to:",opts:{A:"Manage the U.S. money supply",B:"Regulate the secondary trading of securities and the firms involved",C:"Set interest rates for government bonds",D:"Insure customer accounts against broker-dealer failure"},ans:"B",exp:"The '34 Act created the SEC and gave it broad authority to regulate the secondary markets, broker-dealers, exchanges, and transfer agents. It also requires ongoing disclosure from public companies (10-K, 10-Q, 8-K filings)."},
{d:"easy",sub:"Investment Company Act",q:"The Investment Company Act of 1940 primarily regulates:",opts:{A:"Hedge funds and private equity funds",B:"Mutual funds, closed-end funds, and ETFs",C:"Insurance companies",D:"Investment advisers and their fee structures"},ans:"B",exp:"The Investment Company Act of 1940 regulates investment companies, including mutual funds (open-end), closed-end funds, and ETFs. It sets requirements for registration, governance, and investor protection."},
{d:"easy",sub:"Investment Advisers Act",q:"The Investment Advisers Act of 1940 defines an investment adviser as a person who:",opts:{A:"Executes securities transactions for compensation",B:"Provides advice about securities for compensation as a regular business",C:"Manages client funds under a power of attorney",D:"Analyzes market trends for broker-dealers"},ans:"B",exp:"The Investment Advisers Act defines an investment adviser as any person who provides advice about securities for compensation as part of their regular business. Advisers above the SEC registration threshold register with the SEC; others register with states."},
{d:"easy",sub:"Regulatory Bodies",q:"FINRA is best described as:",opts:{A:"A federal government agency",B:"A self-regulatory organization (SRO) that oversees broker-dealers",C:"A state regulatory body for investment advisers",D:"An insurance company that protects investor accounts"},ans:"B",exp:"FINRA is a non-governmental SRO that regulates broker-dealers and their registered representatives. It operates under SEC oversight and enforces rules governing member firm conduct."},
{d:"easy",sub:"Regulatory Bodies",q:"SIPC was created to:",opts:{A:"Guarantee investment returns for mutual fund investors",B:"Protect customers of failed broker-dealers by replacing missing cash and securities up to specified limits",C:"Insure bank deposits",D:"Regulate investment advisers"},ans:"B",exp:"SIPC protects customers of financially failed broker-dealers by replacing missing securities and cash up to $500,000 per customer ($250,000 cash sublimit). It does NOT protect against investment losses or market declines."},
{d:"easy",sub:"AML",q:"A Currency Transaction Report (CTR) must be filed for cash transactions that:",opts:{A:"Appear suspicious regardless of amount",B:"Exceed $10,000 in a single business day",C:"Exceed $5,000 and involve a foreign national",D:"Exceed $25,000 at any time"},ans:"B",exp:"Under the Bank Secrecy Act, financial institutions must file a CTR for cash transactions exceeding $10,000 in a single business day. This includes deposits, withdrawals, exchanges, or other transfers."},
{d:"easy",sub:"AML",q:"'Structuring' (smurfing) is:",opts:{A:"Creating complex derivatives to hide risk",B:"Breaking large cash transactions into smaller amounts to avoid the $10,000 CTR threshold",C:"Layering investments through multiple accounts to obscure ownership",D:"Using shell companies to hold securities anonymously"},ans:"B",exp:"Structuring is illegally breaking up cash transactions to stay below the $10,000 CTR threshold. Structuring is itself a federal crime under the Bank Secrecy Act, regardless of whether the underlying funds are from legal sources."},
{d:"easy",sub:"Registration",q:"Which securities are exempt from SEC registration under the '33 Act?",opts:{A:"Corporate stock in an IPO",B:"U.S. Treasury securities",C:"Shares of a new mutual fund",D:"Investment-grade corporate bonds"},ans:"B",exp:"Securities issued by the U.S. government (Treasuries) are exempt from '33 Act registration. Other exempt securities include municipal bonds, short-term commercial paper (under 270 days), and non-profit organization securities."},
{d:"easy",sub:"Investor Protection",q:"SIPC coverage protects customers up to:",opts:{A:"$100,000 per account",B:"$250,000 cash only",C:"$500,000 per customer with a $250,000 cash sublimit",D:"$1,000,000 for retirement accounts"},ans:"C",exp:"SIPC provides up to $500,000 per customer ($250,000 cash sublimit) when a SIPC member broker-dealer fails and customer assets are missing. Coverage is per separate customer, not per account type."},
{d:"easy",sub:"State Regulation",q:"'Blue sky laws' refer to:",opts:{A:"Federal regulations governing tech stock valuations",B:"State securities laws that regulate the offer and sale of securities within the state",C:"SEC rules for securities offered in international markets",D:"FINRA rules about mutual fund marketing"},ans:"B",exp:"Blue sky laws are state securities regulations that predate the federal securities acts. Each state has its own law requiring registration of securities offerings and broker-dealers doing business in that state."},
{d:"medium",sub:"Suitability",q:"Under FINRA Rule 2111, a recommendation is suitable based on the customer's:",opts:{A:"Account size and trading history only",B:"Full investment profile including risk tolerance, time horizon, financial situation, and investment objectives",C:"Brokerage firm's product list",D:"Current market conditions alone"},ans:"B",exp:"Rule 2111 requires that recommendations be based on the customer's full investment profile: age, financial situation, tax status, investment objectives, risk tolerance, time horizon, liquidity needs, and other relevant facts."},
{d:"medium",sub:"Suitability",q:"Regulation Best Interest (Reg BI) requires broker-dealers to:",opts:{A:"Always recommend the cheapest product available",B:"Act in the best interest of retail customers and disclose material conflicts of interest",C:"Provide investment advice under a strict fiduciary standard at all times",D:"Avoid recommending proprietary products"},ans:"B",exp:"Reg BI (effective June 2020) requires broker-dealers to act in the best interest of retail customers when making recommendations, not just recommend 'suitable' products. It requires disclosure of material conflicts of interest through Form CRS."},
{d:"medium",sub:"AML",q:"A Suspicious Activity Report (SAR) must be filed when a firm:",opts:{A:"Detects any transaction over $5,000",B:"Suspects a transaction involves illegal activity or lacks a lawful purpose",C:"Receives a CTR for a customer",D:"Has a customer who refuses to provide identification"},ans:"B",exp:"Firms file SARs when they know, suspect, or have reason to suspect a transaction involves funds from illegal activity, is designed to evade BSA requirements, or has no apparent lawful purpose. SARs are confidential; the filing must not be disclosed to the suspect."},
{d:"medium",sub:"AML",q:"The three stages of money laundering in order are:",opts:{A:"Layering, placement, integration",B:"Placement, layering, integration",C:"Integration, placement, layering",D:"Detection, structuring, placement"},ans:"B",exp:"Money laundering involves: (1) Placement - introducing illegal cash into the financial system; (2) Layering - moving money through complex transactions to obscure its origin; (3) Integration - returning the now-clean money into the legitimate economy."},
{d:"medium",sub:"Registration",q:"Regulation D Rule 506(b) allows companies to raise unlimited capital from:",opts:{A:"Any investor with a brokerage account",B:"Up to 35 non-accredited sophisticated investors and unlimited accredited investors, with no general solicitation",C:"Only qualified institutional buyers",D:"Up to 500 retail investors per year"},ans:"B",exp:"Reg D Rule 506(b) allows raising unlimited capital from accredited investors and up to 35 sophisticated (non-accredited) investors, without general solicitation or advertising. Rule 506(c) allows general solicitation but only to verified accredited investors."},
{d:"medium",sub:"Regulatory Bodies",q:"MSRB (Municipal Securities Rulemaking Board) regulates:",opts:{A:"The issuance of new municipal bonds by governments",B:"The conduct of broker-dealers and banks dealing in municipal securities",C:"Municipal bond credit ratings",D:"Tax treatment of municipal bond interest"},ans:"B",exp:"The MSRB regulates the conduct of broker-dealers and banks that deal in municipal securities. However, the MSRB is a rulemaking body only; enforcement is handled by FINRA (for broker-dealers) and federal banking regulators (for banks)."},
{d:"medium",sub:"Major Legislation",q:"The Sarbanes-Oxley Act of 2002 (SOX) was enacted in response to:",opts:{A:"The 1987 stock market crash",B:"Corporate accounting scandals such as Enron and WorldCom",C:"The dot-com bubble bursting in 2000",D:"Excessive leverage in the banking system"},ans:"B",exp:"SOX was enacted after major accounting scandals (Enron, WorldCom, Tyco) revealed massive corporate fraud. It established the PCAOB, required CEO/CFO certification of financial statements, and strengthened audit requirements."},
{d:"medium",sub:"Major Legislation",q:"The Dodd-Frank Act of 2010 was primarily a response to:",opts:{A:"The dot-com bubble of 2000",B:"The 2008 financial crisis and systemic risks posed by large financial institutions",C:"Mutual fund scandals in the early 2000s",D:"The bankruptcy of Orange County in 1994"},ans:"B",exp:"Dodd-Frank was enacted after the 2008 financial crisis to increase oversight of systemic risk, regulate derivatives markets, create the Consumer Financial Protection Bureau, and implement the Volcker Rule restricting proprietary trading by banks."},
{d:"medium",sub:"Major Legislation",q:"The Volcker Rule generally prohibits banks from:",opts:{A:"Lending to hedge funds",B:"Engaging in proprietary trading and owning hedge funds or private equity funds",C:"Accepting deposits from foreign nationals",D:"Underwriting municipal securities"},ans:"B",exp:"The Volcker Rule prohibits banking entities from engaging in short-term proprietary trading of securities and from owning, investing in, or sponsoring hedge funds or private equity funds, to reduce systemic risk."},
{d:"medium",sub:"Investor Protection",q:"BrokerCheck is a FINRA tool that allows investors to:",opts:{A:"File arbitration claims against broker-dealers",B:"Research the background, qualifications, and disciplinary history of brokers and broker-dealers",C:"Compare fee structures at different firms",D:"Access real-time market data for free"},ans:"B",exp:"FINRA's BrokerCheck is a free public database where investors can look up the registration status, employment history, qualifications, and any disciplinary actions or customer complaints on record for broker-dealers and registered representatives."},
{d:"hard",sub:"Registration",q:"During the 'waiting period' under the '33 Act, an issuer may:",opts:{A:"Accept offers to purchase the securities",B:"Distribute the final prospectus",C:"Distribute a preliminary prospectus (red herring) and take indications of interest",D:"Complete sales to accredited investors only"},ans:"C",exp:"During the waiting period, the issuer cannot sell or accept binding offers. However, it may distribute a preliminary prospectus (red herring) and collect non-binding indications of interest. Sales can only occur after the registration statement becomes effective."},
{d:"hard",sub:"Major Legislation",q:"Regulation NMS is designed to:",opts:{A:"Regulate the sale of non-registered securities to retail investors",B:"Ensure investors receive best available prices across all trading venues by preventing trade-throughs",C:"Set margin requirements for equity securities",D:"Govern material information disclosure by public companies"},ans:"B",exp:"Regulation NMS modernized equity market structure, including the Order Protection Rule requiring that orders be executed at the best price available across all trading venues. It also governs access to market data and quotations."},
{d:"hard",sub:"Major Legislation",q:"Section 16(b) of the '34 Act requires 'short swing profits' to be disgorged when:",opts:{A:"Any investor profits from trading within a 6-month period",B:"A corporate insider buys and sells the company's stock within a 6-month period",C:"A broker-dealer profits on a principal transaction within 7 business days",D:"An investment adviser trades a client's securities within 30 days of a recommendation"},ans:"B",exp:"Section 16(b) requires corporate insiders (officers, directors, and >10% shareholders) to return to the company any profits from short-swing transactions (any purchase and sale, or sale and purchase, of company equity within 6 months), regardless of intent."},
{d:"hard",sub:"Registration",q:"Under Regulation CF, issuers may raise a maximum of approximately:",opts:{A:"$1 million in 12 months",B:"$5 million in 12 months",C:"$20 million in 12 months",D:"$75 million in 12 months"},ans:"B",exp:"Regulation CF (as amended in 2021) allows issuers to raise up to $5 million in a 12-month period from both accredited and non-accredited investors through SEC-registered crowdfunding portals."},
{d:"hard",sub:"Suitability",q:"The 'quantitative suitability' obligation under FINRA Rule 2111 addresses:",opts:{A:"Whether each individual trade is suitable for the customer",B:"Whether a series of recommended transactions is excessive and unsuitable given the customer's profile",C:"Whether the transaction amount exceeds the customer's account balance",D:"Whether the firm's product meets a minimum credit quality standard"},ans:"B",exp:"Quantitative suitability (one of three suitability obligations) addresses the overall frequency and size of transactions. Even if each individual trade seems suitable, a pattern of excessive trading (churning) that is not in the customer's overall interest violates quantitative suitability."},
{d:"hard",sub:"Major Legislation",q:"Regulation FD requires publicly traded companies to:",opts:{A:"File all material information with the SEC before releasing it publicly",B:"Simultaneously disclose material non-public information to the public when intentionally disclosing it to any market professional or large shareholder",C:"Provide equal access to all investors for earnings calls",D:"Prohibit selective disclosure of any information to any party"},ans:"B",exp:"Reg FD requires that when a public company intentionally discloses material non-public information to certain market professionals or large shareholders, it must simultaneously (or promptly for unintentional disclosures) make that information publicly available, preventing selective disclosure advantages."},
{d:"easy",sub:"Securities Act 1933",q:"A 'tombstone' advertisement may be published:",opts:{A:"Only before the SEC declares the registration effective",B:"Both before and after the offering; if before, only as a preliminary notice",C:"Only after the offering is complete, as it is not a solicitation",D:"Only in national newspapers approved by the SEC"},ans:"C",exp:"Traditionally, tombstones were published after an offering closed, listing the securities sold and the underwriting syndicate. They are not solicitations. While modern rules have relaxed some pre-offering communications, tombstones are properly identified as post-offering announcements."},
{d:"easy",sub:"Investment Company Act",q:"Under the Investment Company Act, a mutual fund board of directors must include at least what percentage of independent (non-interested) directors?",opts:{A:"25%",B:"40%",C:"51%",D:"75%"},ans:"B",exp:"The Investment Company Act requires that at least 40% of a mutual fund's board of directors be independent (non-interested) directors. Independent directors are those with no material relationship with the fund's investment adviser, underwriter, or other major service providers."},
{d:"easy",sub:"Regulatory Bodies",q:"Which regulatory body enforces rules for securities traded on national exchanges?",opts:{A:"CFTC",B:"FINRA",C:"SEC",D:"Federal Reserve"},ans:"C",exp:"The SEC oversees and enforces regulations for securities trading on national exchanges and in the OTC markets. FINRA (an SRO) regulates broker-dealer conduct under SEC oversight. The CFTC regulates futures and some derivatives."},
{d:"easy",sub:"AML",q:"Under the Bank Secrecy Act, financial institutions must retain CTR records for at least:",opts:{A:"1 year",B:"3 years",C:"5 years",D:"7 years"},ans:"C",exp:"The Bank Secrecy Act requires financial institutions to retain Currency Transaction Reports (CTRs) and supporting documentation for at least 5 years. SAR records must also be retained for 5 years."},
{d:"medium",sub:"Registration",q:"Regulation A (Tier 1) under the Securities Act of 1933 allows issuers to raise up to:",opts:{A:"$5 million per year without any SEC review",B:"$20 million in a 12-month period with lighter registration requirements",C:"$75 million per year only to accredited investors",D:"$500 million with full SEC registration"},ans:"B",exp:"Regulation A Tier 1 allows issuers to raise up to $20 million in a 12-month period with less burdensome requirements than full registration. Tier 2 allows up to $75 million. Both require SEC review of an offering circular."},
{d:"medium",sub:"Suitability",q:"Form CRS (Client Relationship Summary) is required to be delivered by:",opts:{A:"Investment advisers only",B:"Broker-dealers only",C:"Both broker-dealers and investment advisers to retail investors",D:"Only firms managing assets over $1 billion"},ans:"C",exp:"Form CRS (required under Reg BI and parallel SEC investment adviser rules) must be delivered by both broker-dealers and registered investment advisers to retail investors. It summarizes the type of services offered, fees, conflicts of interest, and whether the firm is acting as a broker-dealer or investment adviser."},
{d:"medium",sub:"Major Legislation",q:"The JOBS Act of 2012 primarily was designed to:",opts:{A:"Create stricter regulations following the 2008 financial crisis",B:"Make it easier for smaller companies to raise capital and go public",C:"Regulate high-frequency trading",D:"Expand SEC enforcement authority"},ans:"B",exp:"The Jumpstart Our Business Startups (JOBS) Act was designed to reduce regulatory burdens on smaller companies trying to raise capital and go public. It created 'emerging growth company' status with reduced disclosure requirements, expanded Reg A+, and created Regulation Crowdfunding."},
{d:"medium",sub:"AML",q:"FinCEN (Financial Crimes Enforcement Network) is a bureau of:",opts:{A:"The SEC",B:"The Federal Reserve",C:"The U.S. Department of the Treasury",D:"FINRA"},ans:"C",exp:"FinCEN is a bureau of the U.S. Department of the Treasury. It collects and analyzes financial intelligence (CTRs, SARs) to combat money laundering, terrorist financing, and other financial crimes. Financial institutions file their BSA reports to FinCEN."},
{d:"hard",sub:"Registration",q:"Under Rule 144, an affiliate of a public company who wants to sell restricted or control securities must comply with which requirements?",opts:{A:"No restrictions apply to affiliates who have held shares for 6 months",B:"Must hold shares for one year, comply with volume limitations, file Form 144, and sell through broker transactions",C:"May sell unrestricted shares freely if registered with FINRA",D:"Must obtain SEC approval for each sale transaction"},ans:"B",exp:"Rule 144 governs resale of restricted and control securities. For affiliates (insiders), requirements include: a 6-month holding period for restricted securities (1 year for non-reporting companies), volume limitations (the lesser of 1% of outstanding shares or average weekly trading volume), manner of sale restrictions, and filing Form 144 for sales above certain thresholds."},
{d:"hard",sub:"Regulatory Bodies",q:"The Public Company Accounting Oversight Board (PCAOB) was created by:",opts:{A:"The Securities Exchange Act of 1934",B:"The Sarbanes-Oxley Act of 2002",C:"The Dodd-Frank Act of 2010",D:"The Investment Company Act of 1940"},ans:"B",exp:"The PCAOB was established by the Sarbanes-Oxley Act of 2002 in response to major accounting scandals. It is a non-profit corporation that oversees the audits of public companies to protect investors by ensuring informative, accurate, and independent audit reports."},
{d:"hard",sub:"Major Legislation",q:"Which of the following is a key provision of the Employee Retirement Income Security Act (ERISA)?",opts:{A:"It requires all retirement plan assets to be invested in government securities",B:"It establishes fiduciary standards for those managing pension and retirement plan assets",C:"It requires all employers to offer defined benefit pension plans",D:"It sets the contribution limits for IRA accounts"},ans:"B",exp:"ERISA establishes fiduciary standards for those who manage employee benefit plans (including pension plans and 401(k) plans). Fiduciaries must act solely in the interest of plan participants, with the care, skill, prudence, and diligence of a prudent expert. ERISA does not require employers to offer plans, but if they do, they must comply with its standards."},
,
{"d":"easy","sub":"Securities Acts","q":"The Securities Act of 1933 primarily regulates:","opts":{"A":"Secondary market trading of securities","B":"The initial issuance and registration of new securities","C":"The conduct of broker-dealers in the secondary market","D":"Investment companies and mutual funds"},"ans":"B","exp":"The Securities Act of 1933 (the 'Truth in Securities Act') governs the IPO and primary market process. It requires issuers to register securities with the SEC and provide investors with a prospectus containing material information."},
{"d":"easy","sub":"Securities Acts","q":"The Securities Exchange Act of 1934:","opts":{"A":"Created registration requirements for new IPOs","B":"Established the SEC and regulates secondary market trading and broker-dealers","C":"Governs investment companies like mutual funds","D":"Requires investment advisers to register with the SEC"},"ans":"B","exp":"The Exchange Act of 1934 created the SEC, established the framework for secondary market regulation, and requires registration of broker-dealers, exchanges, and transfer agents. It prohibits fraud and manipulation in securities trading."},
{"d":"easy","sub":"FINRA","q":"FINRA is best described as:","opts":{"A":"A federal government agency that sets securities laws","B":"A self-regulatory organization (SRO) that regulates broker-dealers under SEC oversight","C":"A state regulator responsible for blue sky laws","D":"An international body setting global standards"},"ans":"B","exp":"FINRA (Financial Industry Regulatory Authority) is an SRO authorized by Congress to regulate broker-dealers. It operates under SEC oversight, writes and enforces rules for member firms, and administers licensing exams including the SIE and Series 7."},
{"d":"easy","sub":"SIPC","q":"SIPC coverage protects investors against:","opts":{"A":"Loss of value due to market declines","B":"Broker-dealer insolvency—covering missing customer securities and cash up to limits when a firm fails","C":"Fraudulent misrepresentation by a broker","D":"All investment losses up to $500,000"},"ans":"B","exp":"SIPC covers customers of failed broker-dealers up to $500,000 per customer (including up to $250,000 in cash) when the firm is insolvent and assets are missing. It does NOT cover market losses or investment fraud."},
{"d":"easy","sub":"Registration","q":"Under Regulation D, a private placement exemption is available for:","opts":{"A":"Any company selling to fewer than 500 investors","B":"Offerings meeting specific conditions, generally sold to accredited investors without general solicitation","C":"Securities sold only within one state","D":"Government and municipal securities"},"ans":"B","exp":"Reg D provides exemptions from SEC registration. Rule 506(b) allows sales to up to 35 non-accredited sophisticated investors and unlimited accredited investors without general solicitation. Rule 506(c) permits general solicitation if all investors are accredited."},
{"d":"easy","sub":"Suitability","q":"Regulation Best Interest (Reg BI) requires broker-dealers to:","opts":{"A":"Always recommend the lowest-cost option","B":"Act in the best interest of retail customers when making recommendations, placing customer interests above their own","C":"Obtain FINRA approval for each recommendation","D":"Recommend only products on the firm's approved list"},"ans":"B","exp":"Reg BI (effective June 2020) requires broker-dealers to act in the best interest of retail customers when making investment recommendations, and not place the firm's or broker's financial interest ahead of the customer's."},
{"d":"easy","sub":"AML","q":"A Currency Transaction Report (CTR) must be filed for:","opts":{"A":"A suspicious wire transfer of any amount","B":"Any cash transaction exceeding $10,000 in a single business day","C":"Any wire transfer to a foreign country","D":"Opening an account for a foreign national"},"ans":"B","exp":"Financial institutions must file a CTR with FinCEN for any cash transaction (or related transactions) exceeding $10,000 in a single business day, regardless of whether it appears suspicious."},
{"d":"medium","sub":"Securities Acts","q":"The Investment Company Act of 1940 primarily governs:","opts":{"A":"Broker-dealers and securities exchanges","B":"Mutual funds, closed-end funds, ETFs, and other pooled investment vehicles","C":"The initial registration of corporate securities","D":"Investment advisers with AUM over $110 million"},"ans":"B","exp":"The Investment Company Act of 1940 regulates pooled investment vehicles—mutual funds, closed-end funds, ETFs, and UITs. It requires SEC registration and sets requirements for structure, governance, fees, reporting, and shareholder rights."},
{"d":"medium","sub":"Securities Acts","q":"The Investment Advisers Act of 1940 requires investment advisers to:","opts":{"A":"Register with FINRA and pass the Series 65","B":"Register with the SEC (or state) and meet fiduciary standards when advising clients for compensation","C":"Register with the SEC only if managing over $1 billion","D":"Obtain a license in each state where clients reside"},"ans":"B","exp":"The Advisers Act requires those providing investment advice for compensation to register with the SEC (if managing $110M+) or state regulators. Registered advisers owe a fiduciary duty—they must act in the client's best interest and disclose all conflicts of interest."},
{"d":"medium","sub":"FINRA","q":"Under FINRA Rule 4530, a registered representative must promptly report to their firm:","opts":{"A":"Any trade executed in a personal account","B":"A felony charge or conviction, or any securities-related misdemeanor","C":"A change in personal address","D":"Any verbal customer complaint"},"ans":"B","exp":"Rule 4530 requires associated persons to promptly report events including felony charges or convictions, securities-related misdemeanors, regulatory sanctions, and civil judgments. Firms must report qualifying events to FINRA within 30 days."},
{"d":"medium","sub":"AML","q":"Structuring (smurfing) involves:","opts":{"A":"Creating offshore corporate structures to hide assets","B":"Deliberately breaking large cash transactions into sub-$10,000 amounts to avoid CTR filing requirements","C":"Layering funds through multiple wire transfers","D":"Using multiple bank accounts in different countries"},"ans":"B","exp":"Structuring deliberately breaks cash into sub-$10,000 transactions to evade CTR reporting. Structuring itself is a federal crime under the Bank Secrecy Act, regardless of whether the underlying funds are from illegal activity."},
{"d":"medium","sub":"Registration","q":"Rule 144 governs the resale of:","opts":{"A":"Government bonds by primary dealers","B":"Restricted and control securities—allowing gradual public resale under volume limitations and conditions","C":"Securities by foreign private issuers","D":"Securities in Reg D private placements only"},"ans":"B","exp":"Rule 144 provides a safe harbor for reselling restricted securities (from private placements) and control securities (held by insiders/affiliates). It imposes holding periods (6-12 months), volume limits, manner-of-sale requirements, and disclosure conditions."},
{"d":"medium","sub":"Suitability","q":"Form CRS (Customer Relationship Summary) must be provided to:","opts":{"A":"Only institutional investors at account opening","B":"Retail investors by both broker-dealers and investment advisers, summarizing the relationship type, fees, and conflicts","C":"All investors annually with their account statement","D":"State regulators as part of annual compliance filings"},"ans":"B","exp":"Form CRS is required under Reg BI for broker-dealers and the Advisers Act for investment advisers. It must be provided to retail investors at or before the start of the relationship, summarizing services, fees, conflicts, and key differences between advisory and brokerage relationships."},
{"d":"medium","sub":"Blue Sky Laws","q":"Blue sky laws refer to:","opts":{"A":"SEC regulations governing offshore securities","B":"State-level securities laws regulating offerings and broker-dealer activity within each state","C":"FINRA rules protecting investors from high-risk products","D":"Federal laws governing commodity futures"},"ans":"B","exp":"Blue sky laws are state securities regulations requiring registration of securities and broker-dealers operating in each state, unless a federal exemption applies. NSMIA preempted many state requirements for nationally traded securities."},
{"d":"medium","sub":"Securities Acts","q":"The Sarbanes-Oxley Act (SOX) of 2002 was enacted to:","opts":{"A":"Regulate credit default swaps and OTC derivatives","B":"Strengthen corporate governance and financial disclosure after accounting scandals such as Enron and WorldCom","C":"Create the Consumer Financial Protection Bureau","D":"Establish commodity futures position limits"},"ans":"B","exp":"SOX was passed after massive accounting scandals. Key provisions: CEO/CFO certification of financial statements, restrictions on auditors providing non-audit services to audit clients, whistleblower protections, and creation of the PCAOB."},
{"d":"medium","sub":"Securities Acts","q":"The Dodd-Frank Act of 2010 was enacted to:","opts":{"A":"Create the FDIC and deposit insurance","B":"Reform financial regulation after the 2008 financial crisis, with new oversight of systemic risk and OTC derivatives","C":"Establish SIPC","D":"Set minimum standards for municipal bond disclosures"},"ans":"B","exp":"Dodd-Frank comprehensively reformed financial regulation post-2008. Key provisions: FSOC for systemic risk oversight, mandatory central clearing of standardized OTC derivatives, the Volcker Rule restricting bank proprietary trading, and the CFPB for consumer protection."},
{"d":"medium","sub":"FINRA","q":"FINRA Rule 2111 (suitability) requires that recommendations be:","opts":{"A":"The lowest-cost option available","B":"Suitable for the customer based on their investment profile including risk tolerance, time horizon, financial situation, and objectives","C":"Pre-approved by a principal","D":"Consistent with the firm's investment philosophy"},"ans":"B","exp":"Rule 2111 requires suitability based on the customer's full investment profile. Reg BI adds a 'best interest' standard for broker-dealer recommendations to retail customers, which goes beyond the basic suitability obligation."},
{"d":"hard","sub":"Securities Acts","q":"Section 16(b) short-swing profit rules apply to:","opts":{"A":"Any investor who sells a stock within 6 months of buying it","B":"Corporate insiders (officers, directors, 10%+ shareholders) who buy and sell the same security within any 6-month period","C":"Investment advisers who profit from client accounts within 6 months","D":"Broker-dealers profiting from market making within 6 months"},"ans":"B","exp":"Section 16(b) requires corporate insiders to disgorge profits from buying and selling (or vice versa) company stock within any 6-month period. The rule is strict liability—intent is irrelevant. Profits must be returned to the company."},
{"d":"hard","sub":"AML","q":"A Suspicious Activity Report (SAR) must be filed when:","opts":{"A":"Any transaction exceeds $5,000 involving a foreign national","B":"A transaction of $5,000+ is suspected to involve illegal activity, evade reporting, or lacks a lawful purpose","C":"A customer refuses to provide ID when opening an account","D":"Any wire transfer exceeds $10,000 regardless of suspicion"},"ans":"B","exp":"Firms must file a SAR with FinCEN within 30 days of detecting a $5,000+ transaction where illegal activity, BSA violations, or lack of lawful purpose is suspected. SARs require a subjective judgment unlike CTRs. Firms may not tip off the subject of the SAR."},
{"d":"hard","sub":"Registration","q":"Regulation A+ Tier 2 allows companies to raise up to how much in 12 months?","opts":{"A":"$5 million","B":"$20 million","C":"$75 million","D":"$250 million"},"ans":"C","exp":"Reg A+ Tier 2 allows companies to raise up to $75 million from the public in a 12-month period using an offering circular rather than a full registration statement. Tier 1 caps at $20 million. Reg A+ was expanded under the JOBS Act."},
{"d":"hard","sub":"FINRA","q":"Under FINRA Rule 2090 (know your customer), a firm must:","opts":{"A":"Verify every customer's source of funds before any transaction","B":"Use reasonable diligence to know and retain essential facts about each customer and their account","C":"Obtain a credit report on all customers before opening margin accounts","D":"Require customers to pass a financial literacy test before trading options"},"ans":"B","exp":"Rule 2090 requires member firms to use reasonable diligence to know essential facts about every customer and account—information needed to service the account effectively, ensure legal compliance, and understand who is authorized to act on the account."},
{"d":"hard","sub":"Securities Acts","q":"Regulation FD prohibits:","opts":{"A":"Investment advisers from trading on material non-public information","B":"Public companies from selectively disclosing material non-public information to certain investors without simultaneous public disclosure","C":"Broker-dealers from sharing research with select clients before public release","D":"Short sellers from publishing negative research on companies they are short"},"ans":"B","exp":"Reg FD requires that when a public company intentionally discloses material non-public information to market professionals, it must simultaneously make a public disclosure. Unintentional disclosures require prompt follow-up. It eliminates selective tipping to favored analysts."},
{"d":"medium","sub":"AML","q":"The three stages of money laundering are:","opts":{"A":"Investigation, prosecution, and conviction","B":"Placement, layering, and integration","C":"Detection, reporting, and monitoring","D":"Identification, verification, and clearance"},"ans":"B","exp":"(1) Placement: introducing illicit funds into the financial system. (2) Layering: obscuring the trail through complex transactions. (3) Integration: the funds re-enter the legitimate economy appearing clean."},
{"d":"medium","sub":"FINRA","q":"A statutory disqualification means:","opts":{"A":"A person cannot trade securities for 30 days","B":"A person is barred from associating with a FINRA member firm due to specified legal or disciplinary events such as felony convictions","C":"A company is banned from underwriting new securities","D":"A customer is prohibited from opening margin accounts"},"ans":"B","exp":"Statutory disqualification (Section 3(a)(39) of the Exchange Act) bars individuals from association with FINRA member firms without special approval. Triggers include felony convictions within 10 years, certain securities-related misdemeanors, SEC/CFTC bars, and similar events."},
{"d":"medium","sub":"Registration","q":"Regulation CF (crowdfunding) allows companies to raise capital from:","opts":{"A":"Only institutional investors through private placement","B":"The general public including non-accredited investors, through SEC-registered portals up to $5 million in 12 months","C":"Any accredited investor through general advertising","D":"Foreign investors only through offshore platforms"},"ans":"B","exp":"Reg CF (under the JOBS Act) allows companies to raise up to $5 million from the general public—including non-accredited investors—through SEC-registered crowdfunding portals in a 12-month period. Individual investment limits apply based on income and net worth."},
{"d":"easy","sub":"FINRA","q":"Which of the following must register as a broker-dealer?","opts":{"A":"A company that only issues its own stock","B":"A firm that buys and sells securities for others or for its own account as a regular business","C":"A company that employs registered representatives only","D":"Any company owning more than 1,000 shares of publicly traded stock"},"ans":"B","exp":"Broker-dealers—firms that transact in securities for customers (broker) or for their own account as a regular business (dealer)—must register with the SEC and become FINRA members. Issuers selling their own securities and passive investors are not required to register."},
{"d":"easy","sub":"Securities Acts","q":"The primary purpose of a prospectus is to:","opts":{"A":"Advertise the issuer's products and services","B":"Provide material information about a securities offering so investors can make an informed decision","C":"Serve as the legal contract between issuer and investors","D":"Summarize the company's quarterly earnings"},"ans":"B","exp":"A prospectus is the required disclosure document for registered securities offerings. It contains material information about the issuer, the offering, risks, financials, and use of proceeds—enabling investors to make informed decisions."},
{"d":"medium","sub":"SIPC","q":"SIPC coverage per customer is:","opts":{"A":"$100,000 cash and $250,000 total","B":"$250,000 in cash and $250,000 in securities","C":"Up to $500,000 total, with a $250,000 sub-limit for cash claims","D":"Unlimited for securities; $500,000 for cash"},"ans":"C","exp":"SIPC covers up to $500,000 per customer in a failed broker-dealer's accounts, with a sub-limit of $250,000 for cash claims. Securities can be covered up to the full $500,000. Multiple accounts at the same firm may be combined depending on account type."},
{"d":"medium","sub":"Suitability","q":"FINRA Rule 2210 governs:","opts":{"A":"Customer account supervision and margin requirements","B":"Member communications with the public, including retail communications, correspondence, and institutional communications","C":"Insider trading prohibitions","D":"Supervisory procedures for clearing firms"},"ans":"B","exp":"Rule 2210 sets standards for member communications with the public. It classifies communications as retail (general public), correspondence (up to 25 retail investors), or institutional. Retail communications require principal review; all must be fair, balanced, and not misleading."},
{"d":"hard","sub":"Securities Acts","q":"Rule 10b-5 under the Securities Exchange Act broadly prohibits:","opts":{"A":"Broker-dealers from charging excessive markups","B":"Fraudulent and manipulative devices in connection with the purchase or sale of any security","C":"Investment advisers from charging performance fees","D":"Insider trading only by corporate officers"},"ans":"B","exp":"Rule 10b-5 is the SEC's primary anti-fraud rule—it prohibits any scheme to defraud, any untrue statement of material fact or omission, and any act that operates as fraud in connection with the purchase or sale of any security. It is the basis for most SEC fraud enforcement, including insider trading cases."},
{"d":"hard","sub":"Registration","q":"The JOBS Act of 2012 was designed to:","opts":{"A":"Restrict access to capital markets for small companies","B":"Facilitate capital formation for small and emerging growth companies by relaxing certain registration requirements","C":"Increase disclosure requirements for all public companies","D":"Extend short-selling restrictions from the financial crisis"},"ans":"B","exp":"The JOBS Act loosened registration requirements for emerging growth companies. Key provisions: expanded Reg A+ (Tier 2 up to $75M), creation of Reg CF (equity crowdfunding up to $5M), relaxed IPO on-ramp rules for emerging growth companies, and eased general solicitation under Rule 506(c)."},
{"d":"easy","sub":"AML","q":"Know Your Customer (KYC) requirements under AML rules require firms to:","opts":{"A":"Obtain a credit report on every new customer","B":"Verify customer identity and collect information sufficient to assess the nature and purpose of the customer relationship and associated risks","C":"Interview every customer in person before account opening","D":"Obtain government clearance for customers from high-risk countries"},"ans":"B","exp":"KYC (part of the BSA/AML framework) requires firms to verify customer identity, collect beneficial ownership information for legal entities, understand the customer's business, and assess the risk profile of the relationship. This enables detection of unusual activity inconsistent with the customer's profile."},
{"d":"medium","sub":"FINRA","q":"Under FINRA Rule 4511, member firms must preserve most business-related records for:","opts":{"A":"1 year","B":"3 years (2 years in an easily accessible location)","C":"7 years","D":"Indefinitely"},"ans":"B","exp":"FINRA Rule 4511 (incorporating SEC Rule 17a-4) requires member firms to preserve most records for a minimum of 6 years, with 2 years in an easily accessible location. However, certain foundational records (formation documents, policies) must be kept for the life of the firm plus 6 years. Blotters and ledgers: 6 years."},
{"d":"medium","sub":"Suitability","q":"The 'three components' of the FINRA suitability rule (Rule 2111) are:","opts":{"A":"Disclosure, confirmation, and supervisory approval","B":"Reasonable basis suitability, customer-specific suitability, and quantitative suitability","C":"Risk assessment, return projection, and fee disclosure","D":"KYC, AML, and product approval"},"ans":"B","exp":"FINRA Rule 2111 has three obligations: (1) Reasonable basis—the recommendation must be suitable for at least some investors based on analysis; (2) Customer-specific—it must be suitable for this particular customer's profile; (3) Quantitative (anti-churning)—the overall number of recommended transactions must not be excessive."},
{"d":"hard","sub":"Securities Acts","q":"Under the Investment Advisers Act, the 'Brochure Rule' (Rule 204-3) requires:","opts":{"A":"Investment advisers to advertise using only SEC-approved brochures","B":"Registered investment advisers to deliver Form ADV Part 2 to clients, disclosing the adviser's business, fees, conflicts, and disciplinary history","C":"Broker-dealers to provide product brochures for every recommended security","D":"All client communications to be pre-approved by a compliance officer"},"ans":"B","exp":"Rule 204-3 requires registered investment advisers to deliver Form ADV Part 2A (the 'brochure') to clients and prospective clients. It must describe the adviser's services, fees, investment strategies, risks, conflicts of interest, and disciplinary history. It must be updated annually and provided to clients or upon material change."},
{"d":"medium","sub":"FINRA","q":"Under FINRA Rule 3110, 'supervision' requirements mean a firm must:","opts":{"A":"Have all trades approved by a principal before execution","B":"Establish and maintain written supervisory procedures and designate principals responsible for supervision of the firm's business activities","C":"Require all registered reps to be supervised by a Series 24 principal 100% of the time","D":"Submit all customer complaints to FINRA within 24 hours"},"ans":"B","exp":"Rule 3110 requires member firms to establish written supervisory procedures (WSPs) reasonably designed to achieve compliance with applicable rules, designate supervisory personnel, review correspondence and transactions, and maintain supervisory systems including OSJs (offices of supervisory jurisdiction)."},
{"d":"easy","sub":"Registration","q":"A 'prospectus' must be delivered to investors:","opts":{"A":"Within 30 days after the securities transaction is complete","B":"Before or at the time of delivery of securities in a registered offering","C":"Only if the investor specifically requests it","D":"Annually as long as the investor holds the securities"},"ans":"B","exp":"Under the Securities Act, investors must receive the final prospectus no later than the time of delivery of the securities ('delivery vs. payment'). For IPOs and follow-on offerings, the prospectus must be delivered before or at the time of the transaction to allow informed investment decisions."},
{"d":"medium","sub":"AML","q":"The Bank Secrecy Act (BSA) is enforced primarily by:","opts":{"A":"The SEC and FINRA for all financial entities","B":"FinCEN (Financial Crimes Enforcement Network), with FINRA enforcing BSA compliance for broker-dealers","C":"The FBI and Department of Justice exclusively","D":"The Federal Reserve for banks only"},"ans":"B","exp":"FinCEN (a bureau of the Treasury Department) administers and enforces the BSA for most financial institutions. For broker-dealers specifically, FINRA has examination authority for BSA/AML compliance (under an agreement with FinCEN). The IRS also has some enforcement authority for certain BSA provisions."},
{"d":"hard","sub":"FINRA","q":"FINRA Rule 4370 requires member firms to maintain:","opts":{"A":"A minimum net capital ratio of 1:15","B":"A business continuity plan (BCP) that addresses significant business disruptions and provides for customer access to funds and securities","C":"A supervisory system that monitors all electronic communications in real time","D":"Flood and fire insurance on all branch offices"},"ans":"B","exp":"Rule 4370 requires FINRA members to maintain and update BCPs that address significant business disruptions. The BCP must cover: data backup and recovery, mission critical systems, alternative trading locations, customer communication during disruptions, and regulatory reporting capabilities."},
{"d":"medium","sub":"Securities Acts","q":"The PCAOB (Public Company Accounting Oversight Board) was created by:","opts":{"A":"The Securities Exchange Act of 1934","B":"The Sarbanes-Oxley Act of 2002","C":"The Investment Advisers Act of 1940","D":"Dodd-Frank Act of 2010"},"ans":"B","exp":"The PCAOB was established by SOX (2002) to oversee auditors of public companies. Before SOX, the accounting profession was self-regulated. The PCAOB registers and inspects public company auditors, sets auditing standards, and investigates and disciplines auditors who violate rules."},
{"d":"medium","sub":"Registration","q":"Securities sold in an intrastate offering may be exempt from federal registration under:","opts":{"A":"Regulation D","B":"Section 3(a)(11) of the Securities Act (intrastate exemption)","C":"Rule 144A","D":"Regulation A+"},"ans":"B","exp":"Section 3(a)(11) and Rule 147/147A provide exemptions for offerings made entirely within one state to residents of that state. The issuer must be incorporated and doing business in that state. Such offerings must still comply with state (blue sky) laws. This exemption was designed for local community offerings."},
{"d":"easy","sub":"FINRA","q":"Form U4 is used to:","opts":{"A":"Register a new broker-dealer firm with FINRA","B":"Register and update information about individual registered persons (associated persons) with FINRA and applicable regulators","C":"File annual financial statements with FINRA","D":"Report customer complaints to FINRA"},"ans":"B","exp":"Form U4 (Uniform Application for Securities Industry Registration) is used to register individuals with FINRA member firms and applicable SROs and state regulators. It includes employment history, disciplinary history, financial disclosures, and criminal history. Material changes must be updated within 30 days."},
{"d":"medium","sub":"Suitability","q":"Under Reg BI, 'conflicts of interest' that a broker-dealer must address include:","opts":{"A":"Only conflicts related to the broker's personal investment account","B":"Material conflicts arising from the firm's financial interests that could influence recommendations, including proprietary products, revenue sharing, and compensation incentives","C":"Only conflicts disclosed in writing to the SEC","D":"Conflicts that arise only in retirement accounts"},"ans":"B","exp":"Reg BI requires broker-dealers to identify and disclose (or eliminate) material conflicts of interest that could influence a recommendation. Key conflicts include: recommendations of proprietary products, revenue sharing arrangements, differential compensation based on product type, and sales contests that could incentivize self-serving recommendations."},
{"d":"hard","sub":"Securities Acts","q":"Section 11 of the Securities Act of 1933 creates civil liability when:","opts":{"A":"A broker-dealer commits insider trading","B":"A registration statement contains a material misstatement or omission—investors can sue every signer, director, and underwriter","C":"An investment adviser breaches fiduciary duty to a client","D":"A public company violates Reg FD"},"ans":"B","exp":"Section 11 provides a private right of action when a registration statement contains a material misstatement or omission. Defendants include the issuer, every officer who signed the registration, every director, every accountant/expert, and every underwriter. Unlike Rule 10b-5 fraud claims, plaintiffs need not prove scienter (intent)—strict liability for the issuer."},
{"d":"easy","sub":"AML","q":"Which federal agency administers the Bank Secrecy Act?","opts":{"A":"The Securities and Exchange Commission","B":"FinCEN (Financial Crimes Enforcement Network), a bureau of the U.S. Treasury Department","C":"The Federal Bureau of Investigation","D":"The Office of the Comptroller of the Currency"},"ans":"B","exp":"FinCEN, a bureau of the U.S. Department of the Treasury, is the primary administrator of the BSA. FinCEN collects and analyzes CTRs, SARs, and other financial intelligence to combat money laundering, terrorist financing, and other financial crimes. It coordinates with law enforcement and international partners."},
{"d":"medium","sub":"Registration","q":"An 'emerging growth company' (EGC) under the JOBS Act benefits from:","opts":{"A":"Complete exemption from SEC reporting requirements","B":"Reduced IPO disclosure requirements and a 5-year on-ramp period before full compliance with certain Sarbanes-Oxley provisions","C":"The right to list on exchanges without an underwriter","D":"Exemption from blue sky laws in all 50 states"},"ans":"B","exp":"EGCs (annual revenues under $1.235 billion at IPO) get a 5-year on-ramp: they can file a confidential draft S-1, use a reduced-disclosure prospectus, phase in certain SOX requirements (like internal control audits), and test the waters with institutional investors before the official IPO roadshow."},
{"d":"easy","sub":"FINRA","q":"What is the purpose of the FINRA Central Registration Depository (CRD)?","opts":{"A":"It stores customer account information for all broker-dealers","B":"It maintains registration and licensing records for broker-dealers and their associated persons, accessible via BrokerCheck","C":"It processes all securities trade settlements nationally","D":"It serves as the national database for all securities transactions"},"ans":"B","exp":"The CRD is FINRA's central database of registration information for all broker-dealers and associated persons (registered reps). It stores U4/U5 filings, examination history, and disciplinary records. The public-facing portion is BrokerCheck (brokercheck.finra.org), where investors can research broker backgrounds."},
{"d":"medium","sub":"Suitability","q":"FINRA Rule 2111's 'quantitative suitability' prong is designed to prevent:","opts":{"A":"Recommendations of unsuitable individual securities","B":"Excessive trading (churning) in customer accounts—even if each individual trade might be suitable, the overall frequency may be unsuitable","C":"Selling high-risk products to conservative investors","D":"Using unsuitable investment strategies for retirement accounts"},"ans":"B","exp":"The quantitative prong requires that the overall number of recommended transactions not be excessive in light of the customer's profile. Even if each individual recommendation is suitable, the cumulative effect of frequent trading can be unsuitable if it generates excessive costs relative to the expected returns—this is the legal basis for churning claims."},
